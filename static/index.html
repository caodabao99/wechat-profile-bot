<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#059669">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23059669'/%3E%3Ccircle cx='11' cy='13' r='4' fill='%23fff'/%3E%3Ccircle cx='21' cy='13' r='4' fill='%23fff' opacity='.7'/%3E%3Cpath d='M6 22c2-3 5-4 8-4s7 2 9 5' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<title>微信画像管理</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div id="app" v-cloak>

  <!-- ============ 登录页（Token + 2FA 两步） ============ -->
  <main v-if="!authed" class="login-wrap">
    <div class="card login-card">
      <h1 class="login-title">微信画像管理</h1>

      <!-- 第一步：API Token -->
      <form v-if="authStage==='token'" @submit.prevent="login">
        <p class="hint block">输入 config.json 里的 apiToken</p>
        <input class="text-input" type="password" v-model="tokenInput" placeholder="API Token" autocomplete="current-password">
        <button class="btn primary lg" type="submit" :disabled="loginChecking">{{ loginChecking ? '验证中…' : '下一步' }}</button>
      </form>

      <!-- 第二步（首次）：绑定 TOTP 验证器 -->
      <form v-else-if="authStage==='setup'" @submit.prevent="enable2FA">
        <p class="hint block">首次使用，先用验证器扫码绑定（Google/Microsoft Authenticator、微信、支付宝等均可）</p>
        <div class="qr-box"><img :src="setupQr" alt="2FA 绑定二维码"></div>
        <p class="hint block">无法扫码时手动添加密钥：</p>
        <p class="totp-secret">{{ setupSecret }}</p>
        <p class="hint block">扫码后输入验证器上显示的 6 位数字完成绑定</p>
        <input class="text-input" type="text" inputmode="numeric" maxlength="6" v-model="codeInput" placeholder="6 位动态码" autocomplete="one-time-code" autofocus>
        <button class="btn primary lg" type="submit" :disabled="loginChecking">{{ loginChecking ? '验证中…' : '确认绑定并进入' }}</button>
        <button class="btn ghost" type="button" @click="backToToken">返回</button>
      </form>

      <!-- 第二步（日常）：输入动态码 -->
      <form v-else @submit.prevent="verify2FA">
        <p class="hint block">请输入验证器上的 6 位动态码（每 30 秒变化）</p>
        <input class="text-input" type="text" inputmode="numeric" maxlength="6" v-model="codeInput" placeholder="6 位动态码" autocomplete="one-time-code" autofocus>
        <button class="btn primary lg" type="submit" :disabled="loginChecking">{{ loginChecking ? '验证中…' : '进入' }}</button>
        <button class="btn ghost" type="button" @click="backToToken">返回上一步</button>
      </form>

      <label class="check-row trust-row"><input type="checkbox" v-model="trustDevice"> 信任此设备，90 天内免输 Token 和动态码</label>
      <p class="login-err" v-if="loginError">{{ loginError }}</p>
    </div>
  </main>

  <template v-else>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <span class="logo">◉</span>
        <span>微信画像管理</span>
      </a>
      <nav class="tabs">
        <a href="#/" :class="{active: route.view==='contacts' || route.view==='detail'}">联系人</a>
        <a href="#/merges" :class="{active: route.view==='merges'}">合并记录</a>
        <a href="#/backup" :class="{active: route.view==='backup'}">备份</a>
        <a href="#/assistant" :class="{active: route.view==='assistant'}">关系助手</a>
        <a href="#/insights" :class="{active: route.view==='insights'}">洞察</a>
        <a href="#/status" :class="{active: route.view==='status'}">状态</a>
        <a href="#/help" :class="{active: route.view==='help'}">命令说明</a>
      </nav>
      <button class="btn logout" @click="logout">退出</button>
    </div>
  </header>

  <main class="container">

    <!-- ============ 联系人列表 ============ -->
    <section v-if="route.view==='contacts'">
      <div class="card">
        <div class="search-row">
          <input class="text-input grow" type="search" v-model="search"
                 placeholder="搜索昵称 / 备注 / 别名（忽略大小写）"
                 @keyup.enter="applySearch">
          <button class="btn sm" @click="applySearch" :disabled="loadingContacts">查询</button>
          <button class="btn ghost sm" v-if="searchApplied" @click="clearSearch" :disabled="loadingContacts">清除</button>
          <button class="btn ghost sm" @click="loadContacts()" :disabled="loadingContacts">刷新</button>
        </div>
        <label class="check-row"><input type="checkbox" v-model="showMerged" @change="loadContacts()"> 显示已并入的联系人</label>

        <!-- 标签筛选：选中多个标签时是「同时带这些标签」 -->
        <div class="tag-bar" v-if="tags.length">
          <span class="hint">标签：</span>
          <button type="button" class="tag-chip" v-for="t in tags" :key="t.id"
                  :class="{on: filterTagIds.indexOf(t.id) >= 0}"
                  @click="toggleFilterTag(t.id)">{{ t.name }}<em v-if="t.count"> {{ t.count }}</em></button>
          <button type="button" class="btn ghost xs" v-if="filterTagIds.length" @click="clearFilterTags">清除筛选</button>
          <button type="button" class="btn ghost xs" @click="showTagMgr = true">管理标签</button>
        </div>
        <div class="tag-bar" v-else-if="tagsError">
          <span class="hint">标签读取失败（{{ tagsError }}），标签筛选暂不可用</span>
          <button type="button" class="btn ghost xs" @click="loadTags">重试</button>
        </div>
        <div class="tag-bar" v-else>
          <span class="hint">给联系人打上标签（家人 / 客户 / 老同学…），可按标签筛选</span>
          <button type="button" class="btn ghost xs" @click="showTagMgr = true">新建标签</button>
        </div>
      </div>

      <!-- 批量操作条：勾选后出现 -->
      <div class="card batch-bar" v-if="picked.length">
        <span>已选 <strong>{{ picked.length }}</strong> 位联系人</span>
        <button class="btn sm" @click="openBatchTag" :disabled="tagBusy">批量打标签</button>
        <button class="btn ghost sm" @click="clearPicks">取消选择</button>
      </div>

      <div class="list-head">
        <h2>联系人 <span class="count" v-if="contactsTotal">{{ searchApplied || filterTagIds.length ? contactsTotal + ' 条匹配' : contactsTotal }}</span></h2>
        <div class="lh-actions">
          <label class="check-row inline" v-if="tags.length"><input type="checkbox" :checked="!!picked.length" @change="togglePickAll"> 全选本页</label>
        </div>
      </div>
      <p class="empty" v-if="!loadingContacts && !contacts.length">{{ searchApplied || filterTagIds.length ? '没有匹配的联系人' : '暂无联系人' }}</p>

      <div class="contact-card" v-for="c in contacts" :key="c.id" @click="gotoDetail(c.id)">
        <input class="pick" type="checkbox" v-if="tags.length" :checked="picked.indexOf(c.id) >= 0"
               @click.stop="togglePick(c.id)" aria-label="选择联系人">
        <div class="c-main">
          <div class="c-name">{{ displayName(c) }}</div>
          <div class="c-summary" v-if="c.profileSummary">{{ c.profileSummary }}</div>
          <div class="c-meta">
            <span>{{ c.otherMsgCount }} 条对方消息</span>
            <span v-if="c.lastUpdated">更新：{{ fmtTime(c.lastUpdated) }}</span>
            <span class="tag-chip mini" v-for="t in (c.tags || [])" :key="t.id">{{ t.name }}</span>
          </div>
        </div>
        <div class="c-side">
          <span class="chip st-gray" v-if="c.mergedInto">已并入</span>
          <span class="chip st-purple" v-else-if="c.mergeCount > 0">含{{ c.mergeCount }}人</span>
        </div>
      </div>

      <div class="more-row" v-if="contactsHasMore">
        <button class="btn" @click="loadMoreContacts" :disabled="loadingContacts">{{ loadingContacts ? '加载中…' : '加载更多（已显示 ' + contacts.length + ' / ' + contactsTotal + '）' }}</button>
      </div>
      <p class="empty end-hint" v-else-if="contacts.length > 0 && !searchApplied && contactsTotal > 30">已显示全部 {{ contactsTotal }} 个联系人</p>
    </section>

    <!-- ============ 联系人详情 ============ -->
    <section v-if="route.view==='detail'">
      <div class="card detail-head" v-if="contact">
        <div class="dh-top">
          <a class="back" href="#/">← 返回列表</a>
          <button class="btn ghost sm" @click="loadDetail" :disabled="loadingDetail">刷新</button>
        </div>
        <h2 class="dh-name">{{ displayName(contact) }}</h2>
        <div class="c-meta">
          <span>{{ contact.otherMsgCount }} 条对方消息</span>
          <span v-if="contact.aliases && contact.aliases.length">别名：{{ contact.aliases.join('、') }}</span>
          <span class="chip st-purple" v-if="contact.mergeCount > 0">含{{ contact.mergeCount }}人</span>
          <span class="chip st-gray" v-if="contact.mergedInto">已并入 #{{ contact.mergedInto }}</span>
          <span class="tag-chip mini" v-for="t in (contact.tags || [])" :key="t.id">{{ t.name }}</span>
        </div>
        <!-- 标签编辑：勾选即改，点保存生效 -->
        <div class="tag-bar" v-if="tagEditOpen && tags.length">
          <button type="button" class="tag-chip" v-for="t in tags" :key="t.id"
                  :class="{on: tagEditIds.indexOf(t.id) >= 0}" @click="toggleTagEdit(t.id)">{{ t.name }}</button>
          <button type="button" class="btn primary xs" @click="saveTagEdit" :disabled="tagBusy">{{ tagBusy ? '保存中…' : '保存' }}</button>
          <button type="button" class="btn ghost xs" @click="tagEditOpen = false">取消</button>
        </div>
        <p class="hint block" v-else-if="tagEditOpen">还没有标签，先在<a href="#/">联系人列表</a>页点「新建标签」</p>
        <div class="dh-actions">
          <button class="btn sm" @click="startRemark">改备注</button>
          <button class="btn sm" @click="openTagEdit">{{ tagEditOpen ? '收起标签' : '标签' }}</button>
          <button class="btn sm" @click="openFollowupModal(contact.id)" :disabled="!!contact.mergedInto">记一笔待跟进</button>
          <button class="btn sm" @click="startProfileEdit" :disabled="busy || !!contact.mergedInto">编辑画像</button>
          <button class="btn sm" @click="showSupplement = true; supplementNote = ''">补充画像</button>
          <button class="btn sm" @click="startMerge" :disabled="!!contact.mergedInto">关联昵称</button>
          <button class="btn sm" @click="doRegenerate" :disabled="busy">{{ busy ? '处理中…' : '重新生成画像' }}</button>
          <button class="btn sm danger" @click="doDelete">删除</button>
        </div>
      </div>

      <!-- 页签：画像 / 辅助 / 消息 / 历史 / 统计 -->
      <nav class="subtabs" v-if="contact">
        <a :class="{active: detailTab==='profile'}" @click.prevent="detailTab = 'profile'" href="#">画像</a>
        <a :class="{active: detailTab==='assist'}" @click.prevent="detailTab = 'assist'" href="#">辅助</a>
        <a :class="{active: detailTab==='messages'}" @click.prevent="switchTab('messages')" href="#">消息</a>
        <a :class="{active: detailTab==='history'}" @click.prevent="switchTab('history')" href="#">历史</a>
        <a :class="{active: detailTab==='stats'}" @click.prevent="switchTab('stats')" href="#">统计</a>
        <a :class="{active: detailTab==='timeline'}" @click.prevent="switchTab('timeline')" href="#">时间线</a>
      </nav>

      <div class="card section" v-if="contact && contact.id === route.id && detailTab==='assist'">
        <h2>回复前帮我看看</h2>
        <p>结合画像和最近上下文检查歧义，保留原意。仅展示和复制，不自动发送。</p>
        <textarea class="text-input" rows="3" maxlength="4000" v-model="assist.draft" :disabled="assist.reviewBusy" placeholder="粘贴自己准备发送的话"></textarea>
        <button class="btn" @click="reviewDraft" :disabled="assist.reviewBusy || !assist.draft.trim()">{{ assist.reviewBusy ? '检查中…' : '帮我看看' }}</button>
        <div v-if="assist.review">
          <p v-if="!assist.review.issues.length">未发现明显歧义</p>
          <p v-for="(issue, i) in assist.review.issues" :key="i">{{ issue }}</p>
          <p style="white-space:pre-wrap">{{ assist.review.improved }}</p>
          <button class="btn sm" @click="copyAssist(assist.review.improved)">复制改进版本</button>
        </div>
        <h2>候选回复 · 换个说法</h2>
        <textarea class="text-input" rows="2" maxlength="4000" v-model="assist.message" :disabled="assist.analyzeBusy" placeholder="粘贴对方最新消息，生成候选回复"></textarea>
        <button class="btn" @click="analyzeReplies" :disabled="assist.analyzeBusy || !assist.message.trim()">{{ assist.analyzeBusy ? '生成中…' : '生成候选回复' }}</button>
        <div v-for="(reply, i) in assist.replies" :key="i" class="card section reply-card">
          <h3><span class="chip st-purple">{{ reply.style }}</span></h3>
          <p style="white-space:pre-wrap">{{ reply.text }}</p>
          <div class="rewrite-row">
            <span class="rewrite-label">换成:</span>
            <label class="style-opt" v-for="s in styles" :key="s">
              <input type="radio" :name="'target-style-'+i" :value="s" v-model="reply.target" :disabled="reply.busy">{{ s }}
            </label>
            <button class="btn sm" @click="rewriteReply(reply)" :disabled="reply.busy">{{ reply.busy ? '改写中…' : '换个说法' }}</button>
            <button class="btn sm" @click="copyAssist(reply.text)">复制</button>
          </div>
        </div>
        <div class="block-head">
          <h2 style="margin:0">画像变化</h2>
          <button v-if="assist.changes" class="btn ghost sm" @click="closeChanges">收起</button>
        </div>
        <button class="btn" @click="loadChanges" :disabled="assist.changesBusy">{{ assist.changesBusy ? '读取中…' : (assist.changes ? '刷新变化' : '查看变化') }}</button>
        <div v-if="assist.changes">
          <p>{{ assist.changes.note }}</p>
          <div v-for="change in assist.changes.changes" :key="change.field" class="card section">
            <strong :class="change.kind === '删除' ? 'st-gray' : 'st-purple'">【{{ change.kind }}】{{ change.field }}</strong>
            <p style="white-space:pre-wrap">原：{{ change.before }}</p><p style="white-space:pre-wrap">现：{{ change.after }}</p>
          </div>
        </div>
      </div>

      <!-- 画像：按桌面端固定分节铺开 -->
      <div v-if="contact && detailTab==='profile'">
        <p class="empty" v-if="!profileSections.length">暂无画像，消息积累到一定数量后会自动生成</p>
        <div class="card section" v-for="sec in profileSections" :key="sec.title">
          <h2>{{ sec.title }}</h2>
          <div class="sec-lines">
            <p v-for="(line, i) in sec.lines" :key="i" :class="{item: line.startsWith('- ')}">{{ line }}</p>
          </div>
        </div>
      </div>

      <!-- 消息 -->
      <div v-if="contact && detailTab==='messages'">
        <div class="msg-row" v-for="(m, i) in messages" :key="i" :class="m.sender">
          <span class="m-sender">{{ m.sender === 'me' ? '我' : '对方' }}</span>
          <div class="m-body">
            <div class="m-content">{{ m.content }}</div>
            <div class="m-time">{{ m.msgTime }}</div>
          </div>
        </div>
        <p class="empty" v-if="!messagesLoading && !messages.length">暂无消息</p>
        <div class="more-row" v-if="messages.length && messagesHasMore">
          <button class="btn sm" @click="loadMessages(true)" :disabled="messagesLoading">{{ messagesLoading ? '加载中…' : '加载更多' }}</button>
        </div>
      </div>

      <!-- 画像历史 -->
      <div v-if="contact && detailTab==='history'">
        <p class="empty" v-if="!history.length">暂无画像历史</p>
        <div class="card history-card" v-for="h in history" :key="h.ID">
          <div class="h-head" @click="toggleHistory(h)">
            <span class="h-time">{{ fmtTime(h.CreatedAt) }}</span>
            <span class="h-summary">{{ h.ChangeSummary || '画像更新' }}</span>
            <span class="h-toggle">{{ expandedHistory === h.ID ? '收起' : '查看' }}</span>
          </div>
          <div v-if="expandedHistory === h.ID" class="h-detail">
            <p class="hint" v-if="!h.ProfileJSON || h.ProfileJSON === '{}'">该版本没有画像快照（事件日志）</p>
            <template v-else>
              <div class="sec-lines" v-for="sec in historySections(h)" :key="sec.title">
                <p class="sec-title">【{{ sec.title }}】</p>
                <p v-for="(line, i) in sec.lines" :key="i">{{ line }}</p>
              </div>
              <button class="btn sm" @click="rollback(h)" :disabled="busy">{{ busy ? '处理中…' : '回滚到此版本' }}</button>
            </template>
          </div>
        </div>
      </div>

      <!-- 统计 -->
      <div v-if="contact && detailTab==='stats'" class="card">
        <h2>消息统计</h2>
        <div class="stat-grid" v-if="stats">
          <div class="stat-row"><span class="st-label">总消息数</span><span class="st-val">{{ stats.Total }}</span></div>
          <div class="stat-row"><span class="st-label">我发的</span><span class="st-val">{{ stats.Mine }}</span></div>
          <div class="stat-row"><span class="st-label">对方发的</span><span class="st-val">{{ stats.Other }}</span></div>
          <div class="stat-row"><span class="st-label">首条消息</span><span class="st-val">{{ fmtTime(stats.FirstTime) || '—' }}</span></div>
          <div class="stat-row"><span class="st-label">最近消息</span><span class="st-val">{{ fmtTime(stats.LastTime) || '—' }}</span></div>
        </div>
      </div>

      <!-- 时间线：把这个人从认识到现在的节点串起来 -->
      <div v-if="contact && detailTab==='timeline'" class="card">
        <div class="tl-head">
          <h2>关系时间线</h2>
          <div>
            <button class="btn sm" @click="openEventModal">记一个事件</button>
            <button class="btn ghost sm" @click="loadTimeline" :disabled="timelineBusy">{{ timelineBusy ? '加载中…' : '刷新' }}</button>
          </div>
        </div>
        <p class="hint block">自动汇总创建、首条/最近消息、画像更新、改名改备注、合并等节点；也可以手动记下「一起吃饭」「借钱给他」这类事。</p>
        <p class="empty" v-if="!timelineBusy && !timeline.length">暂无时间线数据</p>
        <ul class="tl-list">
          <li v-for="(ev, i) in timeline" :key="i" :class="'tl-' + (ev.source || 'derived')">
            <span class="tl-time">{{ ev.eventTime }}</span>
            <span class="tl-body">
              <span class="tag" :class="ev.source === 'record' ? 'tag-green' : 'tag-gray'">{{ tlKind(ev.kind) }}</span>
              <strong>{{ ev.title }}</strong>
              <span class="hint" v-if="ev.detail">{{ ev.detail }}</span>
            </span>
            <button class="btn ghost xs" v-if="ev.id" @click="delEvent(ev)" :disabled="timelineBusy">删除</button>
          </li>
        </ul>
      </div>
    </section>

    <!-- ============ 合并记录 ============ -->
    <section v-if="route.view==='merges'">
      <div class="list-head">
        <h2>合并记录 <span class="count" v-if="mergeLogs.length">{{ mergeLogs.length }}</span></h2>
        <button class="btn ghost sm" @click="loadMergeLogs" :disabled="loadingMerges">刷新</button>
      </div>
      <p class="empty" v-if="!loadingMerges && !mergeLogs.length">暂无合并记录</p>
      <div class="card merge-card" v-for="l in mergeLogs" :key="l.ID">
        <div class="mg-main">
          <div class="mg-title">{{ l.SourceName }} → {{ l.TargetName }}</div>
          <div class="c-meta">
            <span>{{ fmtTime(l.CreatedAt) }}</span>
            <span class="chip st-gray" v-if="l.UndoneAt">已撤销 {{ fmtTime(l.UndoneAt) }}</span>
          </div>
        </div>
        <button class="btn sm danger" v-if="!l.UndoneAt" @click="undoMerge(l)" :disabled="busy">撤销合并</button>
      </div>
    </section>

    <!-- ============ 备份 / 恢复 ============ -->
    <section v-if="route.view==='backup'">
      <div class="card">
        <h2>备份与恢复</h2>
        <p class="hint block">
          备份是一个 zip 文件，包含：全部联系人、消息、画像、画像历史、别名与合并记录，
          以及配置（模型 Key）、微信登录凭据和 2FA 密钥。换服务器或电脑时，部署好新程序后直接在这里导入即可。
        </p>
        <div class="backup-actions">
          <button class="btn primary" @click="exportBackup" :disabled="backupBusy">
            {{ backupBusy === 'export' ? '正在生成…' : '导出备份（下载 zip）' }}
          </button>
          <input class="text-input grow" :type="showEncPwd ? 'text' : 'password'" v-model="encPassword"
                 placeholder="备份密码（选填，填了就加密密钥文件）" autocomplete="new-password">
        </div>
        <div class="backup-actions">
          <button class="btn" @click="pickImport" :disabled="backupBusy">导入备份（从 zip 恢复）</button>
          <input class="text-input grow" :type="showEncPwd ? 'text' : 'password'" v-model="impPassword"
                 placeholder="备份密码（备份加密过才需要填）" autocomplete="off">
          <label class="check-row inline"><input type="checkbox" v-model="showEncPwd"> 显示密码</label>
        </div>
        <input type="file" ref="backupFile" accept=".zip" style="display:none" @change="importBackup">
        <p class="hint block" v-if="backupResult">{{ backupResult }}</p>
        <ul class="backup-notes">
          <li>导入会<strong>整体替换</strong>当前所有数据；系统会在服务器数据目录自动留一份「恢复前自动备份」，可反悔。</li>
          <li>聊天数据导入后立即生效；配置、登录凭据、2FA 密钥文件需<strong>重启服务</strong>后生效。</li>
          <li>备份文件含有密钥，等同密码，请妥善保管、不要公开分享。</li>
          <li>填了「备份密码」时，模型 Key、微信登录凭据、2FA 密钥会以 AES-256 加密后放进 zip（文件名带 <code>.enc</code>），
            导入时需填同一密码。<strong>密码程序不会保存，忘了就无法恢复这几个文件</strong>（聊天数据不受影响）。</li>
          <li>加密只针对密钥文件，<strong>聊天数据库仍是明文</strong>；zip 也仍是标准格式，可直接用解压软件打开查看。</li>
          <li>也可以在微信给 ClawBot 发「备份」，在服务器数据目录生成备份文件（该方式不支持加密）。</li>
        </ul>
        <div class="backup-log-section" v-if="backupLogs.length">
          <h3>最近操作记录</h3>
          <table class="backup-log-table">
            <thead>
              <tr>
                <th>时间</th>
                <th>操作</th>
                <th>来源</th>
                <th>文件名</th>
                <th>大小</th>
                <th>详情</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="l in backupLogs" :key="l.id" :class="{err:!l.success}">
                <td>{{ l.createdAt ? fmtTime(l.createdAt).slice(0,16) : '-' }}</td>
                <td>
                  <span class="tag" :class="l.action==='export'?'tag-green':'tag-orange'">
                    {{ l.action==='export'?'导出':'恢复' }}
                  </span>
                  <span v-if="!l.success" class="tag tag-red">失败</span>
                </td>
                <td>{{ {web:'网页',wechat:'微信',desktop:'桌面'} [l.source] || l.source }}</td>
                <td :title="l.filename">{{ l.filename || '-' }}</td>
                <td>{{ l.sizeBytes ? (l.sizeBytes/1024/1024).toFixed(1)+' MB' : '-' }}</td>
                <td :title="l.detail" class="log-detail">{{ l.detail || '-' }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 消息归档 -->
      <div class="card">
        <h2>消息归档</h2>
        <p class="hint block">
          把超过保留期的旧消息移入同库的归档表，缩小活动数据、加快日常查询。
          归档消息不再出现在联系人聊天记录里，但会随备份一起导出，随时可恢复。
        </p>
        <div v-if="archive">
          <div class="backup-actions">
            <label class="check-row inline"><input type="checkbox" v-model="archiveForm.enabled"> 每日自动归档</label>
            <span class="hint">保留最近</span>
            <input class="text-input" style="width:90px" type="number" min="30" max="36500" v-model.number="archiveForm.retentionDays">
            <span class="hint">天的消息（默认 730 天 ≈ 2 年）</span>
            <button class="btn sm" @click="saveArchiveSettings" :disabled="archiveBusy">保存设置</button>
          </div>
          <p class="hint block">
            活动消息 {{ archive.stats.activeMessages }} 条 ·
            已归档 {{ archive.stats.archivedMessages }} 条 ·
            当前可归档 {{ archive.stats.eligible }} 条
            <template v-if="archive.stats.lastRunAt"> · 上次归档 {{ fmtTime(archive.stats.lastRunAt) }}</template>
          </p>
          <div class="backup-actions">
            <button class="btn primary" @click="runArchive" :disabled="archiveBusy || !archive.stats.eligible">
              {{ archiveBusy === 'run' ? '正在归档…' : '立即归档超期消息' }}
            </button>
            <button class="btn danger" @click="restoreArchive(0)" :disabled="archiveBusy || !archive.stats.archivedMessages">
              {{ archiveBusy === 'restore' ? '正在恢复…' : '恢复全部归档' }}
            </button>
          </div>
          <p class="hint block" v-if="archiveResult">{{ archiveResult }}</p>
          <div class="backup-log-section" v-if="archive.byContact.length">
            <h3>归档明细（按联系人）</h3>
            <table class="backup-log-table">
              <thead>
                <tr><th>联系人</th><th>归档条数</th><th>时间范围</th><th></th></tr>
              </thead>
              <tbody>
                <tr v-for="a in archive.byContact" :key="a.contactId">
                  <td>
                    <span v-if="a.deleted" class="tag tag-red">已删除的联系人</span>
                    <template v-else>{{ a.name || ('#' + a.contactId) }}</template>
                  </td>
                  <td>{{ a.count }}</td>
                  <td>{{ a.oldest ? fmtTime(a.oldest).slice(0,10) : '?' }} ~ {{ a.newest ? fmtTime(a.newest).slice(0,10) : '?' }}</td>
                  <td><button class="btn sm ghost" @click="restoreArchive(a.contactId)" :disabled="archiveBusy">恢复</button></td>
                </tr>
              </tbody>
            </table>
            <p class="hint block" v-if="archive.byContact.some(a => a.deleted)">「已删除的联系人」的归档消息无法恢复到聊天中（联系人不存在），恢复全部时会原地保留。</p>
          </div>
        </div>
        <p class="hint block" v-else-if="archiveError">归档状态读取失败，请重试 <button class="btn xs" @click="loadArchive">重新读取</button></p>
        <p class="hint block" v-else>正在读取归档状态…</p>
      </div>

      <!-- 可信设备 -->
      <div class="card">
        <h2>可信设备（免登录）</h2>
        <p class="hint block">
          登录时勾选「信任此设备」后，该浏览器 90 天内打开页面免输 Token 和动态码（每次使用自动续期）。
          设备丢失或不再使用时在这里吊销；关闭 2FA 会自动吊销全部可信设备。
        </p>
        <p class="empty" v-if="trustedList && !trustedList.length">暂无可信设备——下次登录时勾选「信任此设备」即可添加</p>
        <table class="backup-log-table" v-if="trustedList && trustedList.length">
          <thead>
            <tr><th>设备名</th><th>令牌</th><th>添加时间</th><th>最近使用</th><th>到期</th><th></th></tr>
          </thead>
          <tbody>
            <tr v-for="t in trustedList" :key="t.tokenPrefix">
              <td>{{ t.name }}</td>
              <td><code>{{ t.token }}</code></td>
              <td>{{ fmtTime(t.createdAt).slice(0,16) }}</td>
              <td>{{ t.lastUsedAt ? fmtAgo(t.lastUsedAt) : '未使用' }}<span v-if="t.lastIp" class="hint">（{{ t.lastIp }}）</span></td>
              <td>{{ fmtTime(t.expiresAt).slice(0,10) }}</td>
              <td><button class="btn sm danger" @click="revokeTrusted(t)" :disabled="trustedBusy">吊销</button></td>
            </tr>
          </tbody>
        </table>
        <div class="backup-actions" v-if="trustedList && trustedList.length">
          <button class="btn danger" @click="revokeAllTrusted" :disabled="trustedBusy">吊销全部可信设备</button>
        </div>
      </div>
    </section>

    <!-- ============ 关系助手 ============ -->
    <section v-if="route.view==='assistant'">
      <div class="card status-head-card">
        <div>
          <h2 style="margin:0">关系助手</h2>
          <p class="hint" style="margin:4px 0 0">重要日子 / 久未联系提醒、亲密度评分、情绪预警，全部通过邮件发送，不影响微信机器人现有功能</p>
        </div>
        <button class="btn sm" @click="loadAssistant" :disabled="asstLoading">{{ asstLoading ? '加载中…' : '刷新' }}</button>
      </div>

      <div v-if="!asst && asstLoading" class="card">正在读取关系助手数据…</div>
      <div v-if="!asst && !asstLoading" class="card">读取失败，点右上角「刷新」重试。</div>

      <template v-if="asst">
        <!-- 设置 -->
        <div class="card">
          <h3>提醒设置</h3>
          <label class="check-row"><input type="checkbox" v-model="asstForm.enabled">
            <strong>启用关系助手</strong>（关闭时不发任何邮件、不做任何分析，零开销）</label>
          <div class="asst-row">
            <label class="check-row inline"><input type="checkbox" v-model="asstForm.remindBirthday"> 重要日子提醒</label>
            <span class="hint">提前</span>
            <input class="text-input num-input" type="number" min="1" max="30" v-model.number="asstForm.birthdayAdvanceDays">
            <span class="hint">天 · 数据来源：联系人画像里的生日 / 纪念日</span>
          </div>
          <div class="asst-row">
            <label class="check-row inline"><input type="checkbox" v-model="asstForm.remindCooling"> 久未联系提醒</label>
            <span class="hint">超过</span>
            <input class="text-input num-input" type="number" min="1" max="365" v-model.number="asstForm.coolingDays">
            <span class="hint">天无任何互动即提醒（同一人 7 天内只提醒一次）</span>
          </div>
          <div class="asst-row">
            <span class="st-label">每日提醒时间</span>
            <input class="text-input num-input" type="time" v-model="asstForm.dailyCheckTime">
            <span class="hint">到点聚合当天所有提醒发一封邮件，没有内容则不发</span>
          </div>
          <div class="asst-row">
            <label class="check-row inline"><input type="checkbox" v-model="asstForm.weeklyReport"> 每周报告</label>
            <select class="text-input num-input" v-model.number="asstForm.weeklyDay">
              <option :value="0">周日</option><option :value="1">周一</option><option :value="2">周二</option>
              <option :value="3">周三</option><option :value="4">周四</option><option :value="5">周五</option>
              <option :value="6">周六</option>
            </select>
            <input class="text-input num-input" type="time" v-model="asstForm.weeklyTime">
            <span class="hint">互动统计 + 亲密度 + 情绪速览</span>
          </div>
          <div class="asst-row">
            <label class="check-row inline"><input type="checkbox" v-model="asstForm.emotionAlert"> 情绪预警</label>
            <span class="hint">用 LLM 分析近 7 天聊天，每日最多分析</span>
            <input class="text-input num-input" type="number" min="1" max="50" v-model.number="asstForm.emotionDailyMax">
            <span class="hint">个联系人（控制模型花费）</span>
          </div>
          <div class="asst-row">
            <label class="check-row inline"><input type="checkbox" v-model="asstForm.remindFollowup"> 待跟进提醒</label>
            <span class="hint">把「对方问了我没回 / 我答应的事 / 钱款往来」一起放进每日邮件</span>
          </div>
          <div class="asst-row" v-if="asstForm.remindFollowup">
            <label class="check-row inline"><input type="checkbox" v-model="asstForm.followupEnabled"> 自动从聊天记录里抽取</label>
            <span class="hint">近</span>
            <input class="text-input num-input" type="number" min="1" max="180" v-model.number="asstForm.followupWindowDays">
            <span class="hint">天，每日最多</span>
            <input class="text-input num-input" type="number" min="1" max="30" v-model.number="asstForm.followupDailyMax">
            <span class="hint">个联系人（要调模型，不勾选则只用手动记录，零花费）</span>
          </div>
          <div class="asst-row">
            <label class="check-row inline"><input type="checkbox" v-model="asstForm.blessingDraft"> 重要日子附 AI 祝福草稿</label>
            <span class="hint">每日邮件里给最紧急的最多 3 条重要日子各写 3 句祝福（要调模型）</span>
          </div>

          <h3 style="margin-top:18px">邮件发送（SMTP）</h3>
          <div class="asst-row">
            <input class="text-input grow" v-model.trim="asstForm.smtp.host" placeholder="SMTP 服务器，如 smtp.qq.com">
            <input class="text-input num-input" type="number" min="1" v-model.number="asstForm.smtp.port" placeholder="端口">
            <label class="check-row inline"><input type="checkbox" v-model="asstForm.smtp.ssl"> SSL（465 端口勾选）</label>
          </div>
          <div class="asst-row">
            <input class="text-input grow" v-model.trim="asstForm.smtp.user" placeholder="登录账号（QQ/163 邮箱填完整地址；留空则免认证）" autocomplete="off">
            <input class="text-input grow" type="password" v-model="asstForm.smtp.pass" placeholder="密码 / SMTP 授权码" autocomplete="new-password">
          </div>
          <div class="asst-row">
            <input class="text-input grow" v-model.trim="asstForm.smtp.from" placeholder="发件人地址（一般同登录账号）">
            <input class="text-input grow" v-model.trim="asstForm.smtp.toText" placeholder="收件人，多个用逗号分隔">
          </div>
          <div class="asst-row" style="margin-top:10px">
            <button class="btn primary sm" @click="saveAssistantSettings" :disabled="!!asstBusy">{{ asstBusy==='save' ? '保存中…' : '保存设置' }}</button>
            <button class="btn sm" @click="testAssistantEmail" :disabled="!!asstBusy">{{ asstBusy==='test' ? '发送中…' : '发测试邮件' }}</button>
            <span class="chip" :class="asst.smtpReady ? 'st-ok' : 'st-gray'">{{ asst.smtpReady ? 'SMTP 配置完整' : 'SMTP 未配置完整' }}</span>
          </div>
          <p class="hint block">提示：QQ 邮箱需在「设置 → 账户」开启 SMTP 并生成授权码；163 邮箱同理。密码只保存在服务器数据库中。</p>
        </div>

        <!-- 看板 -->
        <div class="status-grid" style="margin-top:14px">
          <div class="card">
            <h3>📅 近期重要日子（14 天内）</h3>
            <p class="hint" v-if="!(asst.upcoming || []).length">暂无——在联系人画像的「重要日子」里写上生日/纪念日（如 5月1日、1995-05-01）即可识别</p>
            <div class="asst-date" v-for="(d, i) in (asst.upcoming || [])" :key="i">
              <div class="stat-row">
                <span class="st-label"><a :href="'#/contact/' + d.contactId">{{ d.name }}</a> · {{ d.kind }}<span class="hint">（{{ d.raw }}）</span></span>
                <span class="st-val">{{ d.dateStr }} ·
                  <strong :class="d.daysUntil <= 1 ? 'asst-urgent' : ''">{{ d.daysUntil === 0 ? '今天' : (d.daysUntil === 1 ? '明天' : d.daysUntil + ' 天后') }}</strong>
                </span>
              </div>
              <div class="bless-row">
                <button class="btn ghost xs" @click="genBlessing(d, i)" :disabled="!!blessBusy">
                  {{ blessBusy === i + 1 ? '写作中…' : ((d.blessings && d.blessings.length) ? '换一批祝福' : '写祝福语') }}
                </button>
                <template v-if="d.blessings && d.blessings.length">
                  <div class="bless-item" v-for="(b, j) in d.blessings" :key="j">
                    <span class="bless-text">{{ b }}</span>
                    <button class="btn ghost xs" @click="copyText(b)">复制</button>
                  </div>
                </template>
              </div>
            </div>
            <p class="hint" v-if="asst.unparsedDates && asst.unparsedDates.length">
              另有 {{ asst.unparsedDates.length }} 条日期未能识别（如农历），可改成「5月1日」或「1995-05-01」格式
            </p>
          </div>

          <div class="card">
            <h3>🕐 久未联系（超过 {{ asstForm.coolingDays }} 天）</h3>
            <p class="hint" v-if="!(asst.cooling || []).length">没有冷却中的联系人，保持得不错</p>
            <div class="asst-cool" v-for="c in (asst.cooling || [])" :key="c.contactId">
              <div class="stat-row">
                <span class="st-label"><a :href="'#/contact/' + c.contactId">{{ c.name }}</a></span>
                <span class="st-val">{{ c.days }} 天没互动</span>
              </div>
              <p class="hint" v-if="c.lastContent" style="margin:0 0 6px">最后一句：{{ c.lastContent }}</p>
            </div>
          </div>

          <div class="card">
            <h3>💞 亲密度 Top10（近 30 天）</h3>
            <p class="hint" v-if="!(asst.intimacy || []).length">近 30 天还没有互动数据</p>
            <div class="meter-block" v-for="it in (asst.intimacy || [])" :key="it.contactId">
              <div class="meter-head">
                <span><a :href="'#/contact/' + it.contactId">{{ it.name }}</a>
                  <span class="hint">我 {{ it.mine }} / TA {{ it.other }} · 互动 {{ it.days }} 天</span></span>
                <span class="meter-val">{{ it.score }} 分</span>
              </div>
              <div class="meter"><div class="meter-bar lv-ok" :style="{width: it.score + '%'}"></div></div>
            </div>
          </div>

          <div class="card">
            <h3>💬 情绪关注（近 7 天）</h3>
            <p class="hint" v-if="!(asst.emotions || []).length">暂无分析记录——启用情绪预警后每日自动分析，也可在每日提醒邮件里看到</p>
            <div class="asst-cool" v-for="e in (asst.emotions || [])" :key="e.contactId">
              <div class="stat-row">
                <span class="st-label"><a :href="'#/contact/' + e.contactId">{{ e.name }}</a>
                  <span class="tag" :class="e.alert ? 'tag-red' : 'tag-green'" style="margin-left:6px">{{ e.emotion || '—' }}</span>
                </span>
                <span class="st-val">{{ e.score }} 分</span>
              </div>
              <p class="hint" style="margin:0" v-if="e.summary">{{ e.summary }}</p>
              <p class="hint" style="margin:2px 0 6px" v-if="e.advice">建议：{{ e.advice }}</p>
            </div>
          </div>

          <!-- 待跟进：对方问了我没回 / 我答应的事 / 钱款往来 -->
          <div class="card status-wide">
            <div class="tl-head">
              <h3 style="margin:0">📌 待跟进事项</h3>
              <div>
                <button class="btn ghost xs" v-for="st in [['open','待处理'],['done','已完成'],['ignored','已忽略'],['','全部']]"
                        :key="st[0]" :class="{on: followupFilter === st[0]}" @click="switchFollowup(st[0])">{{ st[1] }}</button>
                <button class="btn sm" @click="scanFollowups" :disabled="followupBusy">{{ followupBusy ? '扫描中…' : 'AI 扫一遍聊天记录' }}</button>
                <button class="btn sm" @click="openFollowupModal(0)">手动添加</button>
              </div>
            </div>
            <p class="hint block">「AI 扫一遍」会读最近 {{ asstForm.followupWindowDays }} 天的聊天，找出你答应过的事、对方问了没回的、以及涉及钱款的往来。手动添加的记录永远保留，不依赖模型。</p>
            <p class="empty" v-if="!followups.length">{{ followupBusy ? '加载中…' : '这个分类下没有记录' }}</p>
            <div class="fu-item" v-for="it in followups" :key="it.id">
              <div class="fu-main">
                <div class="fu-top">
                  <a :href="'#/contact/' + it.contactId">{{ it.name }}</a>
                  <span class="tag" :class="{'tag-red': it.kind==='money', 'tag-green': it.kind==='promise'}">{{ it.kindLabel || followupKinds[it.kind] || it.kind }}</span>
                  <span class="chip" :class="it.status==='open' ? 'st-warn' : 'st-gray'">{{ {open:'待处理',done:'已完成',ignored:'已忽略'}[it.status] || it.status }}</span>
                  <span class="hint" v-if="it.amount">金额：{{ it.amount }}</span>
                </div>
                <div class="fu-content">{{ it.content }}</div>
                <div class="c-meta"><span v-if="it.sourceTime">来源消息：{{ fmtTime(it.sourceTime) }}</span><span>记录于 {{ fmtTime(it.createdAt) }}</span></div>
              </div>
              <div class="fu-acts">
                <button class="btn ghost xs" v-if="it.status !== 'open'" @click="setFollowupStatus(it, 'open')" :disabled="followupBusy">重新打开</button>
                <button class="btn ghost xs" v-if="it.status !== 'done'" @click="setFollowupStatus(it, 'done')" :disabled="followupBusy">完成</button>
                <button class="btn ghost xs" v-if="it.status === 'open'" @click="setFollowupStatus(it, 'ignored')" :disabled="followupBusy">忽略</button>
                <button class="btn ghost xs danger-text" @click="delFollowup(it)" :disabled="followupBusy">删除</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 日历订阅 -->
        <div class="card" style="margin-top:14px">
          <h3>📆 日历订阅（重要日子导出 .ics）</h3>
          <p class="hint block">
            开启后得到一个专属订阅地址，把它添加到手机/电脑日历（iPhone「设置 → 日历 → 账户 → 添加账户 → 其他 → 添加已订阅的日历」；
            Android/Google 日历「添加订阅日历」；Outlook「添加日历 → 从 URL 订阅」），所有联系人的生日、纪念日就会按年重复出现在你自己的日历里，提前几天自动提醒。
          </p>
          <div class="asst-row">
            <template v-if="cal && cal.enabled">
              <span class="chip st-ok">已开启</span>
              <button class="btn sm" @click="copyText(cal.url)" :disabled="calBusy">复制订阅地址</button>
              <button class="btn ghost sm" @click="rotateCalendarKey" :disabled="calBusy">重新生成密钥</button>
              <button class="btn ghost sm danger-text" @click="clearCalendarKey" :disabled="calBusy">关闭订阅</button>
            </template>
            <template v-else>
              <span class="chip st-gray">未开启</span>
              <button class="btn primary sm" @click="rotateCalendarKey" :disabled="calBusy">{{ calBusy ? '生成中…' : '生成订阅地址' }}</button>
            </template>
          </div>
          <div class="cal-url" v-if="cal && cal.enabled">
            <code>{{ cal.url }}</code>
          </div>
          <p class="hint block" v-if="cal && cal.enabled">
            订阅内容只包含未来一年内的重要日子，每条都是全天、按年重复的透明事件（不占用忙闲时间）。
            地址里的密钥等同于访问凭据，不要转发给别人；泄露了就点「重新生成密钥」。
          </p>
        </div>

        <!-- 手动运行 + 日志 -->
        <div class="card" style="margin-top:14px">
          <h3>手动运行</h3>
          <div class="asst-row">
            <button class="btn sm" @click="runAssistantNow('daily')" :disabled="!!asstBusy">{{ asstBusy==='daily' ? '启动中…' : '立即执行每日提醒' }}</button>
            <button class="btn sm" @click="runAssistantNow('weekly')" :disabled="!!asstBusy">{{ asstBusy==='weekly' ? '启动中…' : '立即生成每周报告' }}</button>
            <span class="hint">需已启用助手并保存 SMTP；任务在后台执行，完成后刷新本页查看</span>
          </div>
          <div class="backup-log-section" v-if="(asst.runs || []).length">
            <h3>最近任务记录</h3>
            <table class="backup-log-table">
              <thead><tr><th>时间</th><th>任务</th><th>详情</th></tr></thead>
              <tbody>
                <tr v-for="(r, i) in (asst.runs || [])" :key="i">
                  <td>{{ fmtTime(r.createdAt).slice(0,16) }}</td>
                  <td>{{ {daily:'每日提醒', weekly:'每周报告', manual:'每日提醒(手动)', 'weekly-manual':'每周报告(手动)'}[r.kind] || r.kind }}</td>
                  <td class="log-detail" :title="r.detail">{{ r.detail || '-' }}</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="backup-log-section">
            <h3>邮件发送记录</h3>
            <table class="backup-log-table" v-if="(asst.emailLog || []).length">
              <thead><tr><th>时间</th><th>类型</th><th>主题</th><th>状态</th><th>错误</th></tr></thead>
              <tbody>
                <tr v-for="(l, i) in (asst.emailLog || [])" :key="i" :class="{err: l.status !== 'ok'}">
                  <td>{{ fmtTime(l.createdAt).slice(0,16) }}</td>
                  <td>{{ {daily:'每日提醒', weekly:'每周报告', test:'测试'}[l.kind] || l.kind }}</td>
                  <td :title="l.subject">{{ l.subject || '-' }}</td>
                  <td><span class="tag" :class="l.status==='ok' ? 'tag-green' : 'tag-red'">{{ l.status==='ok' ? '成功' : '失败' }}</span></td>
                  <td class="log-detail" :title="l.error">{{ l.error || '-' }}</td>
                </tr>
              </tbody>
            </table>
            <p class="hint" v-else>还没有发送过邮件</p>
          </div>
        </div>
      </template>
    </section>

    <!-- ============ 洞察 ============ -->
    <section v-if="route.view==='insights'">
      <nav class="subtabs">
        <a href="#" :class="{active: insightTab==='search'}" @click.prevent="switchInsight('search')">聊天记录搜索</a>
        <a href="#" :class="{active: insightTab==='report'}" @click.prevent="switchInsight('report')">年度报告</a>
        <a href="#" :class="{active: insightTab==='social'}" @click.prevent="switchInsight('social')">社交大盘</a>
        <a href="#" :class="{active: insightTab==='dup'}" @click.prevent="switchInsight('dup')">重复联系人</a>
      </nav>

      <!-- ---- 聊天记录全文搜索 ---- -->
      <template v-if="insightTab==='search'">
        <div class="card">
          <h2>聊天记录搜索</h2>
          <form class="search-row" @submit.prevent="doSearch">
            <input class="text-input grow" v-model.trim="srch.q" maxlength="80"
                   placeholder="关键词，多个词用空格隔开（需同时出现）" @keyup.enter="doSearch">
            <select class="text-input" v-model="srch.contactId">
              <option :value="0">全部联系人</option>
              <option v-for="c in srchContacts" :key="c.id" :value="c.id">{{ displayName(c) }}</option>
            </select>
            <input class="text-input" type="date" v-model="srch.from" title="开始日期">
            <input class="text-input" type="date" v-model="srch.to" title="结束日期">
            <label class="check-row inline"><input type="checkbox" v-model="srch.archive"> 含已归档</label>
            <button class="btn primary" type="submit" :disabled="srchBusy">{{ srchBusy ? '搜索中…' : '搜索' }}</button>
          </form>
          <p class="hint block">默认只搜活跃消息，每页 100 条；勾选「含已归档」会一并搜归档库（稍慢）。</p>
        </div>

        <div class="card" v-if="srchRes">
          <div class="tl-head">
            <h3>搜索结果</h3>
            <span class="hint">共 {{ srchRes.total }} 条 · 已显示 {{ (srchRes.list || []).length }} 条 · 耗时 {{ srchRes.tookMs }} ms</span>
          </div>
          <p class="hint block" v-if="srchRes.archiveSkipped">归档库当前不可用，本次只搜了活跃消息。</p>
          <p class="empty" v-if="!(srchRes.list || []).length">没有找到匹配的消息</p>
          <ul class="tl-list srch-list" v-else>
            <li v-for="h in srchRes.list" :key="h.archived ? 'a' + h.id : 'm' + h.id">
              <div class="tl-time">{{ h.msgTime }}</div>
              <div class="tl-body">
                <a href="#" @click.prevent="gotoDetail(h.contactId)">{{ h.contactName }}</a>
                <span class="tag" :class="h.sender === 'me' ? 'tag-green' : 'tag-gray'">{{ h.sender === 'me' ? '我' : '对方' }}</span>
                <span class="chip st-gray" v-if="h.archived">归档</span>
                <p class="srch-snip">{{ h.snippet }}</p>
              </div>
            </li>
          </ul>
          <div class="more-row" v-if="srchHasMore">
            <button class="btn sm" @click="searchMore" :disabled="srchBusy">{{ srchBusy ? '加载中…' : '加载更多' }}</button>
          </div>
        </div>
      </template>

      <!-- ---- 年度关系报告 ---- -->
      <template v-if="insightTab==='report'">
        <div class="card">
          <div class="tl-head">
            <h2>年度关系报告</h2>
            <div class="lh-actions">
              <button class="btn ghost xs" v-for="y in [reportYear + 1, reportYear, reportYear - 1, reportYear - 2]" :key="y"
                      :class="{on: y === reportYear}" @click="changeReportYear(y)" :disabled="reportBusy">{{ y }}</button>
              <button class="btn sm" @click="loadReport" :disabled="reportBusy">{{ reportBusy ? '生成中…' : '刷新' }}</button>
              <button class="btn sm primary" @click="openReportHTML" :disabled="reportBusy">生成可分享长页</button>
            </div>
          </div>
          <p class="hint block">「生成可分享长页」会打开一个新标签页，是排版好的完整报告，可直接保存或转发。</p>

          <template v-if="report">
            <p class="hint block" v-if="report.truncated">数据量较大，统计做了截断，数字仅供参考。</p>
            <div class="insight-grid">
              <div class="ins-cell"><b>{{ report.totalMessages }}</b><span>全年消息</span></div>
              <div class="ins-cell"><b>{{ report.myMessages }}</b><span>我发出</span></div>
              <div class="ins-cell"><b>{{ report.theirMessages }}</b><span>对方发出</span></div>
              <div class="ins-cell"><b>{{ report.activeContacts }}</b><span>聊过的人数</span></div>
              <div class="ins-cell"><b>{{ report.activeDays }}</b><span>有聊天的天数</span></div>
              <div class="ins-cell"><b>{{ report.newContacts }}</b><span>新增联系人</span></div>
            </div>

            <div class="insight-block">
              <h4>{{ report.year }} 年的高光时刻</h4>
              <div class="stat-row" v-if="report.busiestDay"><span class="st-label">最热闹的一天</span><span class="st-val">{{ report.busiestDay }}（{{ report.busiestDayCount }} 条）</span></div>
              <div class="stat-row" v-if="report.busiestMonth"><span class="st-label">最热闹的月份</span><span class="st-val">{{ report.busiestMonth }} 月</span></div>
              <div class="stat-row" v-if="report.longestSilenceDays"><span class="st-label">最长沉默</span><span class="st-val">{{ report.longestSilenceDays }} 天<span v-if="report.silenceBefore">（{{ report.silenceBefore }} → {{ report.silenceAfter }}）</span></span></div>
              <p class="empty" v-if="!report.busiestDay && !report.longestSilenceDays">这一年还没有聊天数据</p>
            </div>

            <div class="insight-block" v-if="(report.months || []).length">
              <h4>每月消息量</h4>
              <div class="bar-list">
                <div class="bar-row" v-for="m in report.months" :key="m.month">
                  <span class="bar-name">{{ m.month }} 月</span>
                  <span class="bar"><i class="bar-fill" :style="{width: barPct(m.total, reportMonthMax)}"></i></span>
                  <span class="bar-num">{{ m.total }}</span>
                </div>
              </div>
            </div>

            <div class="insight-block" v-if="(report.topContacts || []).length">
              <h4>聊得最多的人</h4>
              <table class="backup-log-table">
                <thead><tr><th>联系人</th><th>合计</th><th>我</th><th>对方</th><th>我主动</th><th>最后聊天</th></tr></thead>
                <tbody>
                  <tr v-for="t in report.topContacts" :key="t.contactId">
                    <td><a href="#" @click.prevent="gotoDetail(t.contactId)">{{ t.name }}</a></td>
                    <td>{{ t.total }}</td><td>{{ t.mine }}</td><td>{{ t.theirs }}</td><td>{{ t.myInitiate }}</td>
                    <td>{{ t.lastMsgTime || '-' }}</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="insight-block" v-if="report.emotionAvailable && (report.emotions || []).length">
              <h4>情绪走势（月均分，5 分为中性）</h4>
              <div class="bar-list">
                <div class="bar-row" v-for="e in report.emotions" :key="e.month">
                  <span class="bar-name">{{ e.month }} 月</span>
                  <span class="bar"><i class="bar-fill" :class="e.score >= 5 ? 'fill-ok' : 'fill-warn'"
                        :style="{width: barPct(e.score, 10)}"></i></span>
                  <span class="bar-num">{{ (e.score || 0).toFixed(1) }}</span>
                </div>
              </div>
            </div>

            <div class="insight-block" v-if="(report.intimacy || []).length">
              <h4>亲密度变化（上半年 vs 下半年）</h4>
              <table class="backup-log-table">
                <thead><tr><th>联系人</th><th>上半年</th><th>下半年</th><th>变化</th><th>趋势</th></tr></thead>
                <tbody>
                  <tr v-for="c in report.intimacy" :key="c.contactId">
                    <td><a href="#" @click.prevent="gotoDetail(c.contactId)">{{ c.name }}</a></td>
                    <td>{{ c.firstHalf }}</td><td>{{ c.secondHalf }}</td>
                    <td><span class="tag" :class="c.delta > 0 ? 'tag-green' : (c.delta < 0 ? 'tag-red' : 'tag-gray')">{{ c.delta > 0 ? '+' : '' }}{{ c.delta }}</span></td>
                    <td>{{ {up:'升温', down:'转淡', flat:'持平'}[c.trend] || c.trend }}</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="insight-block" v-if="(report.keywords || []).length">
              <h4>今年的高频词</h4>
              <div class="tag-bar">
                <span class="tag-chip" v-for="k in report.keywords" :key="k.phrase">{{ k.phrase }}<em>{{ k.count }}</em></span>
              </div>
            </div>

            <div class="insight-block" v-if="(report.events || []).length">
              <h4>大事记</h4>
              <ul class="tl-list">
                <li v-for="(e, i) in report.events" :key="i" class="tl-record">
                  <div class="tl-time">{{ e.date }}</div>
                  <div class="tl-body">
                    <span class="tag tag-gray">{{ tlKind(e.kind) || e.kind }}</span>
                    <strong>{{ e.title }}</strong>
                    <p class="hint" v-if="e.detail">{{ e.detail }}</p>
                  </div>
                </li>
              </ul>
            </div>
          </template>
          <p class="empty" v-else>{{ reportBusy ? '正在生成…' : '还没有这一年的报告，换个年份试试' }}</p>
        </div>
      </template>

      <!-- ---- 社交大盘 ---- -->
      <template v-if="insightTab==='social'">
        <div class="card">
          <div class="tl-head">
            <h2>我的社交大盘</h2>
            <div class="lh-actions">
              <button class="btn ghost xs" v-for="d in [7, 30, 90, 365]" :key="d"
                      :class="{on: d === socialDays}" @click="changeSocialDays(d)" :disabled="socialBusy">近 {{ d }} 天</button>
              <button class="btn sm" @click="loadSocial" :disabled="socialBusy">{{ socialBusy ? '统计中…' : '刷新' }}</button>
            </div>
          </div>
          <p class="hint block" v-if="social">统计区间：{{ social.from }} 起 · 生成于 {{ fmtTime(social.generatedAt) }}</p>
          <p class="hint block" v-if="social && social.truncated">消息量较大，统计做了截断，数字仅供参考。</p>

          <template v-if="social">
            <div class="insight-grid">
              <div class="ins-cell"><b>{{ social.totalMessages }}</b><span>消息总数</span></div>
              <div class="ins-cell"><b>{{ social.myMessages }}</b><span>我发出</span></div>
              <div class="ins-cell"><b>{{ social.theirMessages }}</b><span>对方发出</span></div>
              <div class="ins-cell"><b>{{ social.activeContacts }}</b><span>聊过的人数</span></div>
              <div class="ins-cell"><b>{{ social.activeDays }}</b><span>有聊天的天数</span></div>
              <div class="ins-cell"><b>{{ social.myInitiateTotal }} : {{ social.theirInitiateTotal }}</b><span>我 : 对方 主动开场</span></div>
            </div>

            <div class="insight-block">
              <h4>回复速度</h4>
              <div class="stat-row"><span class="st-label">我平均回复</span><span class="st-val">{{ fmtDur(social.myReplyAvgSeconds) }}<span class="hint" v-if="social.myReplySamples">（中位 {{ fmtDur(social.myReplyMedianSeconds) }} · {{ social.myReplySamples }} 个样本）</span></span></div>
              <div class="stat-row"><span class="st-label">对方平均回复我</span><span class="st-val">{{ fmtDur(social.theirReplyAvgSeconds) }}<span class="hint" v-if="social.theirReplySamples">（{{ social.theirReplySamples }} 个样本）</span></span></div>
              <div class="stat-row" v-if="social.longestStreakDay"><span class="st-label">最热闹的一天</span><span class="st-val">{{ social.longestStreakDay }}（{{ social.longestStreakCount }} 条）</span></div>
            </div>

            <div class="insight-block" v-if="(social.hourly || []).length">
              <h4>一天里的聊天时段</h4>
              <div class="hour-chart">
                <div class="hour-col" v-for="h in social.hourly" :key="h.hour"
                     :title="h.hour + ' 点：我 ' + h.mine + ' 条 / 对方 ' + h.theirs + ' 条'">
                  <span class="hour-bar"><i class="hb-mine" :style="{height: barPct(h.mine, socialHourMax)}"></i><i class="hb-theirs" :style="{height: barPct(h.theirs, socialHourMax)}"></i></span>
                  <em>{{ h.hour }}</em>
                </div>
              </div>
              <p class="hint block"><i class="lg lg-mine"></i>我发出　<i class="lg lg-theirs"></i>对方发出</p>
            </div>

            <div class="insight-block" v-if="(social.weekday || []).length">
              <h4>每周哪天聊得多</h4>
              <div class="bar-list">
                <div class="bar-row" v-for="(n, i) in social.weekday" :key="i">
                  <span class="bar-name">{{ weekdayNames[i] }}</span>
                  <span class="bar"><i class="bar-fill" :style="{width: barPct(n, socialWeekMax)}"></i></span>
                  <span class="bar-num">{{ n }}</span>
                </div>
              </div>
            </div>

            <div class="insight-block" v-if="(social.topContacts || []).length">
              <h4>聊得最多的人</h4>
              <table class="backup-log-table">
                <thead><tr><th>联系人</th><th>合计</th><th>我</th><th>对方</th><th>我主动</th><th>最后聊天</th></tr></thead>
                <tbody>
                  <tr v-for="t in social.topContacts" :key="t.contactId">
                    <td><a href="#" @click.prevent="gotoDetail(t.contactId)">{{ t.name }}</a></td>
                    <td>{{ t.total }}</td><td>{{ t.mine }}</td><td>{{ t.theirs }}</td><td>{{ t.myInitiate }}</td>
                    <td>{{ t.lastMsgTime || '-' }}</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="insight-block" v-if="(social.initiators || []).length">
              <h4>最常被我主动找的人</h4>
              <table class="backup-log-table">
                <thead><tr><th>联系人</th><th>我主动开场</th><th>合计消息</th></tr></thead>
                <tbody>
                  <tr v-for="t in social.initiators" :key="t.contactId">
                    <td><a href="#" @click.prevent="gotoDetail(t.contactId)">{{ t.name }}</a></td>
                    <td>{{ t.myInitiate }}</td><td>{{ t.total }}</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="insight-block" v-if="(social.myPhrases || []).length || (social.theirPhrases || []).length">
              <h4>高频口头禅</h4>
              <div class="phrase-cols">
                <div v-if="(social.myPhrases || []).length">
                  <p class="hint block">我常说</p>
                  <div class="tag-bar"><span class="tag-chip" v-for="p in social.myPhrases" :key="p.phrase">{{ p.phrase }}<em>{{ p.count }}</em></span></div>
                </div>
                <div v-if="(social.theirPhrases || []).length">
                  <p class="hint block">对方常说</p>
                  <div class="tag-bar"><span class="tag-chip" v-for="p in social.theirPhrases" :key="p.phrase">{{ p.phrase }}<em>{{ p.count }}</em></span></div>
                </div>
              </div>
            </div>
          </template>
          <p class="empty" v-else>{{ socialBusy ? '正在统计…' : '统计失败，点上面的「刷新」重试' }}</p>
        </div>
      </template>

      <!-- ---- 疑似重复联系人 ---- -->
      <template v-if="insightTab==='dup'">
        <div class="card">
          <div class="tl-head">
            <h2>疑似重复联系人</h2>
            <div class="lh-actions">
              <span class="hint" v-if="dup">比较了 {{ dup.scanned }} 个联系人</span>
              <button class="btn sm" @click="loadDuplicates" :disabled="dupBusy">{{ dupBusy ? '扫描中…' : '重新扫描' }}</button>
            </div>
          </div>
          <p class="hint block">名字去掉空格标点后相同、或编辑距离很近的会被列出来。合并会把聊天记录和画像历史一起搬到保留的那个上，事后可在「合并记录」里撤销。</p>
          <p class="hint block" v-if="dup && dup.truncated">联系人较多，只比较了前一批，结果可能不全。</p>
          <p class="empty" v-if="dup && !(dup.list || []).length">没有发现疑似重复的联系人</p>
          <ul class="dup-list" v-if="dup && (dup.list || []).length">
            <li v-for="(p, i) in dup.list" :key="i">
              <div class="dup-pair">
                <a href="#" :class="{ 'dup-keep': p.suggestedKeep === p.a.id }" @click.prevent="gotoDetail(p.a.id)">{{ dupName(p.a) }}</a>
                <span class="dup-vs">VS</span>
                <a href="#" :class="{ 'dup-keep': p.suggestedKeep === p.b.id }" @click.prevent="gotoDetail(p.b.id)">{{ dupName(p.b) }}</a>
              </div>
              <div class="dup-why">
                <span class="chip st-warn">{{ p.reason }}</span>
                <span class="hint">相似度 {{ p.score }}</span>
                <span class="hint">{{ p.a.msgCount }} 条 / {{ p.b.msgCount }} 条</span>
              </div>
              <div class="dup-acts">
                <span class="hint">建议保留：{{ p.suggestedKeep === p.a.id ? dupName(p.a) : dupName(p.b) }}</span>
                <button class="btn sm primary" @click="mergeDuplicate(p)" :disabled="dupBusy">按建议合并</button>
              </div>
            </li>
          </ul>
        </div>
      </template>
    </section>

    <!-- ============ 服务器状态 ============ -->
    <section v-if="route.view==='status'">
      <div class="card status-head-card">
        <div>
          <h2 style="margin:0">服务器状态</h2>
          <p class="hint" style="margin:4px 0 0" v-if="sysStatus">每 5 秒自动刷新 · 服务器时间 {{ fmtTime(sysStatus.serverTime) }}</p>
        </div>
        <button class="btn sm" @click="loadStatus" :disabled="statusLoading">{{ statusLoading ? '刷新中…' : '立即刷新' }}</button>
      </div>

      <div v-if="!sysStatus && statusLoading" class="card">正在读取服务器状态…</div>
      <div v-if="!sysStatus && !statusLoading" class="card">状态读取失败，点击右上角「立即刷新」重试。</div>

      <div v-if="sysStatus" class="status-grid">
        <!-- 微信连接 -->
        <div class="card">
          <h3>微信连接</h3>
          <div class="stat-row">
            <span class="st-label">登录状态</span>
            <span :class="['chip', sysStatus.loggedIn && !sysStatus.sessionExpired ? 'st-ok' : 'st-bad']">
              {{ sysStatus.sessionExpired ? '会话已过期' : (sysStatus.loggedIn ? '已登录' : '未登录') }}
            </span>
          </div>
          <div class="stat-row"><span class="st-label">最后成功轮询</span><span class="st-val">{{ fmtAgo(sysStatus.poll.lastOkSecAgo) }}</span></div>
          <div class="stat-row"><span class="st-label">最近轮询报错</span><span class="st-val">{{ sysStatus.poll.lastErrSecAgo < 0 ? '无' : fmtAgo(sysStatus.poll.lastErrSecAgo) }}</span></div>
          <div v-if="sysStatus.poll.lastErrSecAgo >= 0 && sysStatus.poll.lastErrMsg" class="status-err">{{ sysStatus.poll.lastErrMsg }}</div>
        </div>

        <!-- 服务运行 -->
        <div class="card">
          <h3>服务运行</h3>
          <div class="stat-row"><span class="st-label">程序版本</span><span class="st-val">{{ sysStatus.version }}</span></div>
          <div class="stat-row"><span class="st-label">主机名</span><span class="st-val">{{ sysStatus.sys.hostname || '—' }}</span></div>
          <div class="stat-row"><span class="st-label">操作系统</span><span class="st-val">{{ sysStatus.sys.os }} / {{ sysStatus.sys.arch }}</span></div>
          <div class="stat-row"><span class="st-label">已连续运行</span><span class="st-val">{{ fmtUptime(sysStatus.sys.uptimeSec) }}</span></div>
          <div class="stat-row">
            <span class="st-label">识别到的你的 IP</span>
            <span class="st-val">{{ sysStatus.clientIp || '—' }}</span>
          </div>
          <div class="stat-row">
            <span class="st-label">访问限制</span>
            <span class="st-val">
              <span class="chip" :class="sysStatus.whitelistEnabled ? 'st-ok' : 'st-gray'">{{ sysStatus.whitelistEnabled ? '白名单已启用' : '白名单未启用' }}</span>
              <span class="chip" :class="sysStatus.trustedProxy ? 'st-purple' : 'st-gray'">{{ sysStatus.trustedProxy ? '反代可信' : '直连模式' }}</span>
            </span>
          </div>
        </div>

        <!-- 服务器资源 -->
        <div class="card status-wide">
          <h3>服务器资源</h3>

          <div class="meter-block">
            <div class="meter-head"><span>CPU 占用（本程序进程）</span>
              <span class="meter-val">{{ sysStatus.sys.processCpuPercent }}% · {{ sysStatus.sys.numCpu }} 核</span></div>
            <div class="meter"><div :class="['meter-bar', pctClass(sysStatus.sys.processCpuPercent)]" :style="{width: sysStatus.sys.processCpuPercent + '%'}"></div></div>
          </div>

          <div class="meter-block">
            <div class="meter-head"><span>系统内存</span>
              <span class="meter-val">{{ fmtMB(sysStatus.sys.memTotalMb - sysStatus.sys.memAvailableMb) }} / {{ fmtMB(sysStatus.sys.memTotalMb) }} · {{ sysStatus.sys.memUsedPercent }}%</span></div>
            <div class="meter"><div :class="['meter-bar', pctClass(sysStatus.sys.memUsedPercent)]" :style="{width: sysStatus.sys.memUsedPercent + '%'}"></div></div>
          </div>

          <div class="meter-block">
            <div class="meter-head"><span>数据盘（{{ sysStatus.sys.diskPath }}）</span>
              <span class="meter-val">已用 {{ fmtMB(sysStatus.sys.diskTotalMb - sysStatus.sys.diskFreeMb) }} / {{ fmtMB(sysStatus.sys.diskTotalMb) }} · {{ sysStatus.sys.diskUsedPercent }}%</span></div>
            <div class="meter"><div :class="['meter-bar', pctClass(sysStatus.sys.diskUsedPercent)]" :style="{width: sysStatus.sys.diskUsedPercent + '%'}"></div></div>
          </div>

          <div class="stat-row"><span class="st-label">系统负载 1/5/15 分钟</span>
            <span class="st-val">
              <template v-if="sysStatus.sys.load1 >= 0">{{ sysStatus.sys.load1 }} / {{ sysStatus.sys.load5 }} / {{ sysStatus.sys.load15 }}</template>
              <template v-else>—（Windows 不提供）</template>
            </span></div>
        </div>

        <!-- 程序占用 -->
        <div class="card">
          <h3>程序占用</h3>
          <div class="stat-row"><span class="st-label">常驻内存（RSS）</span><span class="st-val">{{ fmtMB(sysStatus.sys.processRssMb) }}</span></div>
          <div class="stat-row"><span class="st-label">Go 堆在用</span><span class="st-val">{{ fmtMB(sysStatus.sys.goHeapAllocMb) }}</span></div>
          <div class="stat-row"><span class="st-label">协程数</span><span class="st-val">{{ sysStatus.sys.goroutines }}</span></div>
        </div>

        <!-- 数据 -->
        <div class="card">
          <h3>数据</h3>
          <div class="stat-row"><span class="st-label">联系人</span><span class="st-val">{{ sysStatus.contacts }} 人</span></div>
          <div class="stat-row"><span class="st-label">消息总数</span><span class="st-val">{{ sysStatus.messages }} 条</span></div>
        </div>
      </div>
    </section>

    <!-- ============ 微信命令说明（内容来自 bot.go helpText） ============ -->
    <section v-if="route.view==='help'">
      <div class="card help-card">
        <h2>微信命令说明</h2>
        <pre class="help-text">微信画像助手命令：

【直接粘贴聊天记录】
多选复制微信聊天记录发给我，自动识别并存入，同时返回意图分析
（内容较长被微信拆成多条发送时会自动合并，发完后稍等几秒出结果）

【回复辅助（仅展示，不代发）】
改写 昵称｜风格｜原回复 — 竖线中英文输入法都可以；风格：稳妥得体/简洁直接/亲切热情/委婉留余地
草稿检查 昵称｜准备发送的话 — 检查歧义并给出改进版本
画像变化 昵称 — 对比当前与上一历史画像，不调用模型
昵称含空格也可使用；原文中的竖线会保留。

【查询类】
画像 [昵称]        — 查看联系人画像（不填昵称显示最近更新的）
历史 [昵称] [编号] — 查看画像历史版本；加编号看该版完整画像（如：历史 小齐 1）
列表           — 查看所有联系人
统计 昵称       — 查看该联系人的消息统计

【管理类】
备注 昵称 备注内容   — 设置联系人备注
补充 昵称 信息内容   — 手动补充画像信息（后台处理，完成后单独推送）
备份            — 在服务器生成完整备份文件（下载/导入用网页管理界面）
合并 新昵称 旧昵称   — 合并两个联系人（新昵称并入旧昵称）
撤销合并 昵称       — 撤销最近一次的合并
合并记录           — 查看合并历史
删除 昵称           — 删除联系人及其所有数据（需再回复「确认删除 昵称」）

【系统类】
状态           — 查看登录、运行状态和服务器磁盘/内存（磁盘将满会提醒备份迁移）
重登           — 重新扫码登录（会话过期时用）

【提示】
- 聊天记录识别靠的是微信"多选复制"功能，复制后直接粘贴发给我
- 设置备注后，所有命令里的「昵称」位置填昵称或备注都能识别
- 首次生成画像需要积累一定数量的对方消息
- 发"帮助"查看本说明</pre>
      </div>
    </section>

  </main>

  <div class="mask" v-if="profileEditor">
    <form class="card modal pe-modal" style="max-height:90vh;overflow-y:auto" @submit.prevent="saveProfileEdit">
      <h2>编辑当前画像</h2>
      <p class="hint">分节与画像页完全一致；清空字段或列表项即可删除，再次 AI 生成可能重新提取。</p>
      <fieldset :disabled="profileSaving" style="border:0;padding:0">
        <div class="pe-sec" v-for="sec in profileSchema" :key="sec.title">
          <h3 class="pe-sec-title">{{ sec.title }}</h3>
          <template v-for="f in sec.fields" :key="f.path">
            <!-- 典型意图：名称 + 表现逐行编辑，与查看时「- 名称：表现」对应 -->
            <div v-if="f.kind === 'map'">
              <div class="pe-intent-row" v-for="(row, i) in profileEditor.intents" :key="row._uid">
                <input class="text-input pe-intent-name" v-model="row.name" aria-label="意图名称" placeholder="意图名称">
                <input class="text-input" v-model="row.description" aria-label="典型表现" placeholder="典型表现（可留空）">
                <button type="button" class="btn sm" @click="profileEditor.intents.splice(i, 1)">删除</button>
              </div>
              <button type="button" class="btn sm" @click="addIntentRow">添加意图</button>
            </div>
            <label v-else style="display:block;margin:8px 0">
              <span class="pe-label">
                <template v-if="f.label">{{ f.label }}</template>
                <template v-else>{{ sec.title }}</template>
                <em class="pe-hint" v-if="f.kind === 'list'">每行一项</em>
                <em class="pe-hint" v-else-if="f.hint">{{ f.hint }}</em>
              </span>
              <textarea class="text-input" :rows="f.kind === 'list' ? 3 : 2" v-model="profileEditor.values[f.path]"></textarea>
            </label>
          </template>
        </div>
      </fieldset>
      <p role="alert" v-if="profileEditError">{{ profileEditError }}</p>
      <div class="modal-actions">
        <button type="button" class="btn" :disabled="profileSaving" @click="profileEditor = null">取消</button>
        <button type="submit" class="btn primary" :disabled="profileSaving">{{ profileSaving ? '保存中…' : '保存' }}</button>
      </div>
    </form>
  </div>

  <!-- ============ 弹层：改备注 ============ -->
  <div class="mask" v-if="showRemark" @click.self="showRemark = false">
    <form class="card modal" @submit.prevent="doSetRemark">
      <h2>修改备注</h2>
      <input class="text-input" type="text" v-model="remarkInput" placeholder="留空表示清除备注">
      <div class="modal-actions">
        <button class="btn" type="button" @click="showRemark = false">取消</button>
        <button class="btn primary" type="submit" :disabled="busy">保存</button>
      </div>
    </form>
  </div>

  <!-- ============ 弹层：补充画像 ============ -->
  <div class="mask" v-if="showSupplement" @click.self="showSupplement = false">
    <form class="card modal" @submit.prevent="doSupplement">
      <h2>补充画像信息</h2>
      <textarea class="text-input ta" v-model="supplementNote" rows="5" placeholder="如：生日是 5 月 20 日、做后端开发、对猫毛过敏…"></textarea>
      <p class="hint">手动补充的信息优先级最高，会直接合并进画像（调用大模型，可能要等一两分钟）</p>
      <div class="modal-actions">
        <button class="btn" type="button" @click="showSupplement = false">取消</button>
        <button class="btn primary" type="submit" :disabled="busy || !supplementNote.trim()">{{ busy ? '处理中…' : '提交' }}</button>
      </div>
    </form>
  </div>

  <!-- ============ 弹层：关联昵称（合并） ============ -->
  <div class="mask" v-if="showMerge" @click.self="showMerge = false">
    <form class="card modal" @submit.prevent="doMerge">
      <h2>关联昵称（合并联系人）</h2>
      <p class="hint block">把选中的联系人并入「{{ contact ? displayName(contact) : '' }}」，其消息、别名、画像历史都会转移过去</p>
      <select class="text-input" v-model.number="mergeSourceId">
        <option :value="0" disabled>选择要并入的联系人</option>
        <option v-for="c in mergeCandidates" :key="c.id" :value="c.id">{{ displayName(c) }}</option>
      </select>
      <label class="check-row"><input type="checkbox" v-model="mergeUseSourceName"> 显示名改用对方昵称</label>
      <label class="check-row"><input type="checkbox" v-model="mergeRegenerate"> 合并后重新生成画像</label>
      <div class="modal-actions">
        <button class="btn" type="button" @click="showMerge = false">取消</button>
        <button class="btn primary" type="submit" :disabled="busy || !mergeSourceId">{{ busy ? '处理中…' : '合并' }}</button>
      </div>
    </form>
  </div>

  <!-- ============ 弹层：删除二次确认 ============ -->
  <div class="mask" v-if="showDelete" @click.self="showDelete = false">
    <div class="card modal">
      <h2>删除联系人</h2>
      <p>确定删除联系人「{{ contact ? displayName(contact) : '' }}」吗？<br>
      该联系人的消息、画像、画像历史、别名、合并记录都会被删除，<b>不可恢复</b>。</p>
      <div class="modal-actions">
        <button class="btn" @click="showDelete = false">取消</button>
        <button class="btn danger solid" @click="confirmDelete" :disabled="busy">{{ busy ? '删除中…' : '确认删除' }}</button>
      </div>
    </div>
  </div>

  <!-- ============ 弹层：标签管理 ============ -->
  <div class="mask" v-if="showTagMgr" @click.self="showTagMgr = false">
    <div class="card modal">
      <h2>管理标签</h2>
      <form class="search-row" @submit.prevent="createTag">
        <input class="text-input grow" v-model.trim="tagNewName" maxlength="20"
               placeholder="新标签名，如：家人 / 客户 / 老同学" @keyup.enter="createTag">
        <button class="btn primary" type="submit" :disabled="tagBusy || !tagNewName">新建</button>
      </form>
      <p class="empty" v-if="!tags.length">还没有标签，先建一个</p>
      <ul class="tag-mgr-list" v-else>
        <li v-for="t in tags" :key="t.id">
          <template v-if="tagEditId === t.id">
            <input class="text-input grow" v-model.trim="tagEditName" maxlength="20" @keyup.enter="commitTagRename">
            <button class="btn sm primary" type="button" @click="commitTagRename" :disabled="tagBusy || !tagEditName">保存</button>
            <button class="btn sm" type="button" @click="cancelTagRename">取消</button>
          </template>
          <template v-else>
            <span class="tm-name">{{ t.name }}</span>
            <span class="hint">{{ t.count || 0 }} 位联系人</span>
            <span class="tm-acts">
              <button class="btn ghost xs" type="button" @click="startTagRename(t)">改名</button>
              <button class="btn ghost xs danger" type="button" @click="deleteTag(t)" :disabled="tagBusy">删除</button>
            </span>
          </template>
        </li>
      </ul>
      <div class="modal-actions">
        <button class="btn" @click="showTagMgr = false">关闭</button>
      </div>
    </div>
  </div>

  <!-- ============ 弹层：批量打标签 ============ -->
  <div class="mask" v-if="showBatchTag" @click.self="showBatchTag = false">
    <div class="card modal">
      <h2>批量打标签</h2>
      <p class="hint block">已选中 {{ picked.length }} 位联系人，勾选要{{ batchTagRemove ? '移除' : '添加' }}的标签</p>
      <p class="empty" v-if="!tags.length">还没有标签，先去联系人列表页点「新建标签」</p>
      <div class="tag-bar" v-else>
        <button type="button" class="tag-chip" v-for="t in tags" :key="t.id"
                :class="{on: batchTagIds.indexOf(t.id) >= 0}" @click="toggleBatchTag(t.id)">{{ t.name }}</button>
      </div>
      <label class="check-row"><input type="checkbox" v-model="batchTagRemove"> 从这些联系人身上移除（而不是添加）</label>
      <div class="modal-actions">
        <button class="btn" type="button" @click="showBatchTag = false">取消</button>
        <button class="btn primary" type="button" @click="applyBatchTag"
                :disabled="tagBusy || !batchTagIds.length || !picked.length">{{ tagBusy ? '处理中…' : '确定' }}</button>
      </div>
    </div>
  </div>

  <!-- ============ 弹层：记一个时间线事件 ============ -->
  <div class="mask" v-if="showEventModal" @click.self="showEventModal = false">
    <form class="card modal" @submit.prevent="addEvent">
      <h2>记一个事件</h2>
      <p class="hint block">记到「{{ contact ? displayName(contact) : '' }}」的时间线上，和系统自动生成的事件排在一起</p>
      <input class="text-input" v-model.trim="eventForm.title" maxlength="60" placeholder="标题，如：一起吃了饭 / 借了我 500 块">
      <textarea class="text-input" v-model.trim="eventForm.detail" maxlength="500" rows="3"
                style="margin-top:10px" placeholder="补充说明（可不填）"></textarea>
      <input class="text-input" type="datetime-local" v-model="eventForm.eventTime" style="margin-top:10px">
      <div class="modal-actions">
        <button class="btn" type="button" @click="showEventModal = false">取消</button>
        <button class="btn primary" type="submit" :disabled="timelineBusy || !eventForm.title">{{ timelineBusy ? '保存中…' : '记下' }}</button>
      </div>
    </form>
  </div>

  <!-- ============ 弹层：手动添加待跟进 ============ -->
  <div class="mask" v-if="showFollowupModal" @click.self="showFollowupModal = false">
    <form class="card modal" @submit.prevent="addFollowup">
      <h2>记一笔待跟进</h2>
      <select class="text-input" v-model.number="followupForm.contactId">
        <option :value="0" disabled>选择联系人</option>
        <option v-for="c in pickContacts" :key="c.id" :value="c.id">{{ displayName(c) }}</option>
      </select>
      <select class="text-input" v-model="followupForm.kind" style="margin-top:10px">
        <option v-for="(label, k) in followupKinds" :key="k" :value="k">{{ label }}</option>
      </select>
      <textarea class="text-input" v-model.trim="followupForm.content" maxlength="300" rows="3"
                style="margin-top:10px" placeholder="要跟进什么，如：答应了帮他改简历 / 他问的报价还没回"></textarea>
      <input class="text-input" v-model.trim="followupForm.amount" maxlength="40"
             v-if="followupForm.kind === 'money'" style="margin-top:10px" placeholder="金额，如：500 元（借出 / 欠我）">
      <div class="modal-actions">
        <button class="btn" type="button" @click="showFollowupModal = false">取消</button>
        <button class="btn primary" type="submit"
                :disabled="followupBusy || !followupForm.contactId || !followupForm.content">{{ followupBusy ? '保存中…' : '添加' }}</button>
      </div>
    </form>
  </div>

  <div class="toasts">
    <transition-group name="toast">
      <div v-for="t in toasts" :key="t.id" class="toast" :class="t.type">{{ t.msg }}</div>
    </transition-group>
  </div>
  </template>

</div>
<script src="/assets/vue.global.prod.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
