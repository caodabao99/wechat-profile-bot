<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#059669">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23059669'/%3E%3Ccircle cx='11' cy='13' r='4' fill='%23fff'/%3E%3Ccircle cx='21' cy='13' r='4' fill='%23fff' opacity='.7'/%3E%3Cpath d='M6 22c2-3 5-4 8-4s7 2 9 5' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<title>微信画像管理</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div id="app" v-cloak>

  <!-- ============ 登录页（Token + 2FA 两步） ============ -->
  <main v-if="!authed" class="login-wrap">
    <div class="card login-card">
      <h1 class="login-title">微信画像管理</h1>

      <!-- 第一步：API Token -->
      <form v-if="authStage==='token'" @submit.prevent="login">
        <p class="hint block">输入 config.json 里的 apiToken</p>
        <input class="text-input" type="password" v-model="tokenInput" placeholder="API Token" autocomplete="current-password">
        <button class="btn primary lg" type="submit" :disabled="loginChecking">{{ loginChecking ? '验证中…' : '下一步' }}</button>
      </form>

      <!-- 第二步（首次）：绑定 TOTP 验证器 -->
      <form v-else-if="authStage==='setup'" @submit.prevent="enable2FA">
        <p class="hint block">首次使用，先用验证器扫码绑定（Google/Microsoft Authenticator、微信、支付宝等均可）</p>
        <div class="qr-box"><img :src="setupQr" alt="2FA 绑定二维码"></div>
        <p class="hint block">无法扫码时手动添加密钥：</p>
        <p class="totp-secret">{{ setupSecret }}</p>
        <p class="hint block">扫码后输入验证器上显示的 6 位数字完成绑定</p>
        <input class="text-input" type="text" inputmode="numeric" maxlength="6" v-model="codeInput" placeholder="6 位动态码" autocomplete="one-time-code" autofocus>
        <button class="btn primary lg" type="submit" :disabled="loginChecking">{{ loginChecking ? '验证中…' : '确认绑定并进入' }}</button>
        <button class="btn ghost" type="button" @click="backToToken">返回</button>
      </form>

      <!-- 第二步（日常）：输入动态码 -->
      <form v-else @submit.prevent="verify2FA">
        <p class="hint block">请输入验证器上的 6 位动态码（每 30 秒变化）</p>
        <input class="text-input" type="text" inputmode="numeric" maxlength="6" v-model="codeInput" placeholder="6 位动态码" autocomplete="one-time-code" autofocus>
        <button class="btn primary lg" type="submit" :disabled="loginChecking">{{ loginChecking ? '验证中…' : '进入' }}</button>
        <button class="btn ghost" type="button" @click="backToToken">返回上一步</button>
      </form>

      <label class="check-row trust-row"><input type="checkbox" v-model="trustDevice"> 信任此设备，90 天内免输 Token 和动态码</label>
      <p class="login-err" v-if="loginError">{{ loginError }}</p>
    </div>
  </main>

  <template v-else>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <span class="logo">◉</span>
        <span>微信画像管理</span>
      </a>
      <nav class="tabs">
        <a href="#/" :class="{active: route.view==='contacts' || route.view==='detail'}">联系人</a>
        <a href="#/merges" :class="{active: route.view==='merges'}">合并记录</a>
        <a href="#/backup" :class="{active: route.view==='backup'}">备份</a>
        <a href="#/assistant" :class="{active: route.view==='assistant'}">关系助手</a>
        <a href="#/insights" :class="{active: route.view==='insights'}">洞察</a>
        <a href="#/model" :class="{active: route.view==='model'}">模型与代理</a>
        <a href="#/status" :class="{active: route.view==='status'}">状态</a>
      </nav>
      <button class="btn logout" @click="logout">退出</button>
    </div>
  </header>

  <main class="container">

    <!-- ============ 联系人列表 ============ -->
    <section v-if="route.view==='contacts'">
      <!-- v6.1 §14 P10：Action Center 首页（Today / Memory / Risk / Portfolio） -->
      <div class="card action-center">
        <h2>今天 <span class="hint inline">系统只呈现「值得行动」的人，不制造噪音</span></h2>
        <p class="empty" v-if="todayLoading">计算中…</p>
        <p class="empty" v-else-if="!todayList.length">今天没有需要特别行动的关系</p>
        <div class="today-cards" v-else>
          <div class="today-card" v-for="(d, i) in todayList" :key="d.contact_id">
            <div class="tc-rank">{{ i + 1 }}</div>
            <div class="tc-body">
              <div class="tc-head">
                <a class="decision-who" :href="'#/contact/' + d.contact_id">{{ d.name }}</a>
                <span class="chip st-gray">{{ relStateText(d.state) }}</span>
                <span class="chip st-orange" v-if="d.risk>0">风险</span>
                <span class="chip st-blue" v-if="d.confidence">置信 {{ d.confidence }}</span>
              </div>
              <p class="tc-why"><strong>为什么：</strong>{{ (d.why_now && d.why_now.length) ? d.why_now.join('；') : decisionReasonText(d.reason_codes) }}</p>
              <p class="tc-what" v-if="d.action"><strong>做什么：</strong>{{ d.action }}</p>
              <p class="hint block" v-if="d.best_time">什么时候：{{ d.best_time }}</p>
              <p class="hint block" v-if="d.goal">相关目标：{{ d.goal }}</p>
              <p class="hint block" v-if="d.followup">相关待办：{{ d.followup }}</p>
              <div class="tc-ops">
                <button class="btn sm" :disabled="actionBusy>0" @click="acceptDecision(d)">接受</button>
                <button class="btn ghost sm" :disabled="actionBusy>0" @click="deferDecision(d)">稍后</button>
                <button class="btn ghost sm" :disabled="actionBusy>0" @click="dismissDecision(d)">忽略</button>
                <button class="btn ghost sm" :disabled="actionBusy>0" @click="completeDecision(d)">已完成</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 14.1 Memory Review：待确认记忆入口 -->
      <div class="card ac-strip" v-if="memReviewCount>0">
        <span class="ac-strip-main">🧠 <strong>{{ memReviewCount }} 条记忆需要确认</strong></span>
        <span class="hint" v-if="memReviewText">{{ memReviewText }}</span>
      </div>

      <!-- 14.2 Risk：关系风险入口 -->
      <div class="card ac-strip" v-if="riskCount>0">
        <span class="ac-strip-main">⚠️ <strong>{{ riskCount }} 个关系风险</strong></span>
        <span class="hint" v-if="riskSummaryText">{{ riskSummaryText }}</span>
      </div>

      <!-- 14.3 Portfolio：本周时间建议 -->
      <div class="card ac-strip" v-if="portfolioSummary">
        <span class="ac-strip-main">📊 <strong>本周时间建议</strong>（预算 {{ portfolioHours }}h）</span>
        <span class="hint">{{ portfolioTopText }}</span>
      </div>
      <div class="card">
        <div class="search-row">
          <input class="text-input grow" type="search" v-model="search"
                 placeholder="搜索昵称 / 备注 / 别名（忽略大小写）"
                 @keyup.enter="applySearch">
          <button class="btn sm" @click="applySearch" :disabled="loadingContacts">查询</button>
          <button class="btn ghost sm" v-if="searchApplied" @click="clearSearch" :disabled="loadingContacts">清除</button>
          <button class="btn ghost sm" @click="loadContacts()" :disabled="loadingContacts">刷新</button>
        </div>
        <label class="check-row"><input type="checkbox" v-model="showMerged" @change="loadContacts()"> 显示已并入的联系人</label>

        <!-- 标签筛选：选中多个标签时是「同时带这些标签」 -->
        <div class="tag-bar" v-if="tags.length">
          <span class="hint">标签：</span>
          <button type="button" class="tag-chip" v-for="t in tags" :key="t.id"
                  :class="{on: filterTagIds.indexOf(t.id) >= 0}"
                  @click="toggleFilterTag(t.id)">{{ t.name }}<em v-if="t.count"> {{ t.count }}</em></button>
          <button type="button" class="btn ghost xs" v-if="filterTagIds.length" @click="clearFilterTags">清除筛选</button>
          <button type="button" class="btn ghost xs" @click="showTagMgr = true">管理标签</button>
        </div>
        <div class="tag-bar" v-else-if="tagsError">
          <span class="hint">标签读取失败（{{ tagsError }}），标签筛选暂不可用</span>
          <button type="button" class="btn ghost xs" @click="loadTags">重试</button>
        </div>
        <div class="tag-bar" v-else>
          <span class="hint">给联系人打上标签（家人 / 客户 / 老同学…），可按标签筛选</span>
          <button type="button" class="btn ghost xs" @click="showTagMgr = true">新建标签</button>
        </div>
      </div>

      <!-- 批量操作条：勾选后出现 -->
      <div class="card batch-bar" v-if="picked.length">
        <span>已选 <strong>{{ picked.length }}</strong> 位联系人</span>
        <button class="btn sm" @click="openBatchTag" :disabled="tagBusy">批量打标签</button>
        <button class="btn ghost sm" @click="clearPicks">取消选择</button>
      </div>

      <div class="list-head">
        <h2>联系人 <span class="count" v-if="contactsTotal">{{ searchApplied || filterTagIds.length ? contactsTotal + ' 条匹配' : contactsTotal }}</span></h2>
        <div class="lh-actions">
          <label class="check-row inline" v-if="tags.length"><input type="checkbox" :checked="!!picked.length" @change="togglePickAll"> 全选本页</label>
        </div>
      </div>
      <p class="empty" v-if="!loadingContacts && !contacts.length">{{ searchApplied || filterTagIds.length ? '没有匹配的联系人' : '暂无联系人' }}</p>

      <div class="contact-card" v-for="c in contacts" :key="c.id" @click="gotoDetail(c.id)">
        <input class="pick" type="checkbox" v-if="tags.length" :checked="picked.indexOf(c.id) >= 0"
               @click.stop="togglePick(c.id)" aria-label="选择联系人">
        <div class="c-main">
          <div class="c-name">{{ displayName(c) }}</div>
          <div class="c-summary" v-if="c.profileSummary">{{ c.profileSummary }}</div>
          <div class="c-meta">
            <span>{{ c.otherMsgCount }} 条对方消息</span>
            <span v-if="c.lastUpdated">更新：{{ fmtTime(c.lastUpdated) }}</span>
            <span class="tag-chip mini" v-for="t in (c.tags || [])" :key="t.id">{{ t.name }}</span>
          </div>
        </div>
        <div class="c-side">
          <span class="chip st-gray" v-if="c.mergedInto">已并入</span>
          <span class="chip st-purple" v-else-if="c.mergeCount > 0">含{{ c.mergeCount }}人</span>
        </div>
      </div>

      <div class="more-row" v-if="contactsHasMore">
        <button class="btn" @click="loadMoreContacts" :disabled="loadingContacts">{{ loadingContacts ? '加载中…' : '加载更多（已显示 ' + contacts.length + ' / ' + contactsTotal + '）' }}</button>
      </div>
      <p class="empty end-hint" v-else-if="contacts.length > 0 && !searchApplied && contactsTotal > 30">已显示全部 {{ contactsTotal }} 个联系人</p>
    </section>

    <!-- ============ 联系人详情 ============ -->
    <section v-if="route.view==='detail'">
      <div class="card detail-head" v-if="contact">
        <div class="dh-top">
          <a class="back" href="#/">← 返回列表</a>
          <button class="btn ghost sm" @click="loadDetail" :disabled="loadingDetail">刷新</button>
        </div>
        <h2 class="dh-name">{{ displayName(contact) }}</h2>
        <div class="c-meta">
          <span>{{ contact.otherMsgCount }} 条对方消息</span>
          <span v-if="contact.aliases && contact.aliases.length">别名：{{ contact.aliases.join('、') }}</span>
          <span class="chip st-purple" v-if="contact.mergeCount > 0">含{{ contact.mergeCount }}人</span>
          <span class="chip st-gray" v-if="contact.mergedInto">已并入 #{{ contact.mergedInto }}</span>
          <span class="tag-chip mini" v-for="t in (contact.tags || [])" :key="t.id">{{ t.name }}</span>
        </div>
        <!-- OS 2.0 Phase 8：关系状态（Relationship State Machine 实时快照） -->
        <div class="c-meta rel-state" v-if="relState">
          <span class="chip st-blue">状态：{{ baseStateCN(relState.baseState) }} · {{ dynStateCN(relState.dynamicState) }}</span>
          <span class="chip st-gray" v-if="relState.intimacy!=null">亲密度 {{ relState.intimacy }}</span>
          <span class="chip st-gray" v-if="relState.trendState">趋势 {{ trendStateCN(relState.trendState) }}</span>
          <span class="chip st-orange" v-if="relState.alert && relState.alert!=='none'">预警 {{ alertLabel(relState.alert) }}</span>
          <span class="hint inline" v-if="relState.reason">{{ relState.reason }}</span>
        </div>
        <!-- 标签编辑：勾选即改，点保存生效 -->
        <div class="tag-bar" v-if="tagEditOpen && tags.length">
          <button type="button" class="tag-chip" v-for="t in tags" :key="t.id"
                  :class="{on: tagEditIds.indexOf(t.id) >= 0}" @click="toggleTagEdit(t.id)">{{ t.name }}</button>
          <button type="button" class="btn primary xs" @click="saveTagEdit" :disabled="tagBusy">{{ tagBusy ? '保存中…' : '保存' }}</button>
          <button type="button" class="btn ghost xs" @click="tagEditOpen = false">取消</button>
        </div>
        <p class="hint block" v-else-if="tagEditOpen">还没有标签，先在<a href="#/">联系人列表</a>页点「新建标签」</p>
        <div class="dh-actions">
          <button class="btn sm" @click="openReplay(contact.id)">重新认识 TA</button>
          <button class="btn sm" @click="startRemark">改备注</button>
          <button class="btn sm" @click="openTagEdit">{{ tagEditOpen ? '收起标签' : '标签' }}</button>
          <button class="btn sm" @click="openFollowupModal(contact.id)" :disabled="!!contact.mergedInto">记一笔待跟进</button>
          <button class="btn sm" @click="startProfileEdit" :disabled="busy || !!contact.mergedInto">编辑画像</button>
          <button class="btn sm" @click="showSupplement = true; supplementNote = ''">补充画像</button>
          <button class="btn sm" @click="startMerge" :disabled="!!contact.mergedInto">关联昵称</button>
          <button class="btn sm" @click="doRegenerate" :disabled="busy">{{ busy ? '处理中…' : '重新生成画像' }}</button>
          <button class="btn sm danger" @click="doDelete">删除</button>
        </div>
      </div>

      <!-- 页签：画像 / 辅助 / 消息 / 历史 / 统计 -->
      <nav class="subtabs" v-if="contact">
        <a :class="{active: detailTab==='profile'}" @click.prevent="detailTab = 'profile'" href="#">画像</a>
        <a :class="{active: detailTab==='assist'}" @click.prevent="detailTab = 'assist'" href="#">辅助</a>
        <a :class="{active: detailTab==='messages'}" @click.prevent="switchTab('messages')" href="#">消息</a>
        <a :class="{active: detailTab==='history'}" @click.prevent="switchTab('history')" href="#">历史</a>
        <a :class="{active: detailTab==='stats'}" @click.prevent="switchTab('stats')" href="#">统计</a>
        <a :class="{active: detailTab==='timeline'}" @click.prevent="switchTab('timeline')" href="#">时间线</a>
        <a :class="{active: detailTab==='rehearsal'}" @click.prevent="switchTab('rehearsal')" href="#">预演</a>
        <a :class="{active: detailTab==='cockpit'}" @click.prevent="switchTab('cockpit')" href="#">驾驶舱</a>
      </nav>

      <div class="card section" v-if="contact && contact.id === route.id && detailTab==='assist'">
        <h2>回复前帮我看看</h2>
        <p>结合画像和最近上下文检查歧义，保留原意。仅展示和复制，不自动发送。</p>
        <textarea class="text-input" rows="3" maxlength="4000" v-model="assist.draft" :disabled="assist.reviewBusy" placeholder="粘贴自己准备发送的话"></textarea>
        <button class="btn" @click="reviewDraft" :disabled="assist.reviewBusy || !assist.draft.trim()">{{ assist.reviewBusy ? '检查中…' : '帮我看看' }}</button>
        <div v-if="assist.review">
          <p v-if="!assist.review.issues.length">未发现明显歧义</p>
          <p v-for="(issue, i) in assist.review.issues" :key="i">{{ issue }}</p>
          <p style="white-space:pre-wrap">{{ assist.review.improved }}</p>
          <button class="btn sm" @click="copyAssist(assist.review.improved)">复制改进版本</button>
        </div>
        <h2>候选回复 · 换个说法</h2>
        <textarea class="text-input" rows="2" maxlength="4000" v-model="assist.message" :disabled="assist.analyzeBusy" placeholder="粘贴对方最新消息，生成候选回复"></textarea>
        <button class="btn" @click="analyzeReplies" :disabled="assist.analyzeBusy || !assist.message.trim()">{{ assist.analyzeBusy ? '生成中…' : '生成候选回复' }}</button>
        <div v-for="(reply, i) in assist.replies" :key="i" class="card section reply-card">
          <h3><span class="chip st-purple">{{ reply.style }}</span></h3>
          <p style="white-space:pre-wrap">{{ reply.text }}</p>
          <div class="rewrite-row">
            <span class="rewrite-label">换成:</span>
            <label class="style-opt" v-for="s in styles" :key="s">
              <input type="radio" :name="'target-style-'+i" :value="s" v-model="reply.target" :disabled="reply.busy">{{ s }}
            </label>
            <button class="btn sm" @click="rewriteReply(reply)" :disabled="reply.busy">{{ reply.busy ? '改写中…' : '换个说法' }}</button>
            <button class="btn sm" @click="copyAssist(reply.text)">复制</button>
          </div>
        </div>
        <div class="block-head">
          <h2 style="margin:0">画像变化</h2>
          <button v-if="assist.changes" class="btn ghost sm" @click="closeChanges">收起</button>
        </div>
        <button class="btn" @click="loadChanges" :disabled="assist.changesBusy">{{ assist.changesBusy ? '读取中…' : (assist.changes ? '刷新变化' : '查看变化') }}</button>
        <div v-if="assist.changes">
          <p>{{ assist.changes.note }}</p>
          <div v-for="change in assist.changes.changes" :key="change.field" class="card section">
            <strong :class="change.kind === '删除' ? 'st-gray' : 'st-purple'">【{{ change.kind }}】{{ change.field }}</strong>
            <p style="white-space:pre-wrap">原：{{ change.before }}</p><p style="white-space:pre-wrap">现：{{ change.after }}</p>
          </div>
        </div>
      </div>

      <!-- 画像：按桌面端固定分节铺开 -->
      <div v-if="contact && detailTab==='profile'">
        <p class="empty" v-if="!profileSections.length">暂无画像，消息积累到一定数量后会自动生成</p>
        <div class="card section" v-for="sec in profileSections" :key="sec.title">
          <h2>{{ sec.title }}</h2>
          <div class="sec-lines">
            <p v-for="(line, i) in sec.lines" :key="i" :class="{item: line.startsWith('- ')}">{{ line }}</p>
          </div>
        </div>
      </div>

      <!-- 消息 -->
      <div v-if="contact && detailTab==='messages'">
        <div class="msg-row" v-for="(m, i) in messages" :key="i" :id="'msg-' + m.id" :class="m.sender">
          <span class="m-sender">{{ m.sender === 'me' ? '我' : '对方' }}</span>
          <div class="m-body">
            <div class="m-content">{{ m.content }}</div>
            <div class="m-time">{{ m.msgTime }}</div>
          </div>
        </div>
        <p class="empty" v-if="!messagesLoading && !messages.length">暂无消息</p>
        <div class="more-row" v-if="messages.length && messagesHasMore">
          <button class="btn sm" @click="loadMessages(true)" :disabled="messagesLoading">{{ messagesLoading ? '加载中…' : '加载更多' }}</button>
        </div>
      </div>

      <!-- 画像历史 -->
      <div v-if="contact && detailTab==='history'">
        <p class="empty" v-if="!history.length">暂无画像历史</p>
        <div class="card history-card" v-for="h in history" :key="h.ID">
          <div class="h-head" @click="toggleHistory(h)">
            <span class="h-time">{{ fmtTime(h.CreatedAt) }}</span>
            <span class="h-summary">{{ h.ChangeSummary || '画像更新' }}</span>
            <span class="h-toggle">{{ expandedHistory === h.ID ? '收起' : '查看' }}</span>
          </div>
          <div v-if="expandedHistory === h.ID" class="h-detail">
            <p class="hint" v-if="!h.ProfileJSON || h.ProfileJSON === '{}'">该版本没有画像快照（事件日志）</p>
            <template v-else>
              <div class="sec-lines" v-for="sec in historySections(h)" :key="sec.title">
                <p class="sec-title">【{{ sec.title }}】</p>
                <p v-for="(line, i) in sec.lines" :key="i">{{ line }}</p>
              </div>
              <button class="btn sm" @click="rollback(h)" :disabled="busy">{{ busy ? '处理中…' : '回滚到此版本' }}</button>
            </template>
          </div>
        </div>
      </div>

      <!-- 统计 -->
      <div v-if="contact && detailTab==='stats'" class="card">
        <h2>消息统计</h2>
        <div class="stat-grid" v-if="stats">
          <div class="stat-row"><span class="st-label">总消息数</span><span class="st-val">{{ stats.Total }}</span></div>
          <div class="stat-row"><span class="st-label">我发的</span><span class="st-val">{{ stats.Mine }}</span></div>
          <div class="stat-row"><span class="st-label">对方发的</span><span class="st-val">{{ stats.Other }}</span></div>
          <div class="stat-row"><span class="st-label">首条消息</span><span class="st-val">{{ fmtTime(stats.FirstTime) || '—' }}</span></div>
          <div class="stat-row"><span class="st-label">最近消息</span><span class="st-val">{{ fmtTime(stats.LastTime) || '—' }}</span></div>
        </div>
      </div>

      <!-- 时间线：把这个人从认识到现在的节点串起来 -->
      <div v-if="contact && detailTab==='timeline'" class="card">
        <div class="tl-head">
          <h2>关系时间线</h2>
          <div>
            <button class="btn sm" @click="openEventModal">记一个事件</button>
            <button class="btn ghost sm" @click="loadTimeline" :disabled="timelineBusy">{{ timelineBusy ? '加载中…' : '刷新' }}</button>
          </div>
        </div>
        <p class="hint block">自动汇总创建、首条/最近消息、画像更新、改名改备注、合并等节点；也可以手动记下「一起吃饭」「借钱给他」这类事。</p>
        <p class="empty" v-if="!timelineBusy && !timeline.length">暂无时间线数据</p>
        <ul class="tl-list">
          <li v-for="(ev, i) in timeline" :key="i" :class="'tl-' + (ev.source || 'derived')">
            <span class="tl-time">{{ ev.eventTime }}</span>
            <span class="tl-body">
              <span class="tag" :class="ev.source === 'record' ? 'tag-green' : 'tag-gray'">{{ tlKind(ev.kind) }}</span>
              <strong>{{ ev.title }}</strong>
              <span class="hint" v-if="ev.detail">{{ ev.detail }}</span>
            </span>
            <button class="btn ghost xs" v-if="ev.id" @click="delEvent(ev)" :disabled="timelineBusy">删除</button>
          </li>
        </ul>
      </div>

      <!-- 对话预演：AI 照画像扮演对方，陪用户把一场重要对话先过一遍 -->
      <div v-if="contact && detailTab==='rehearsal'" class="rh-panel">
        <div class="card" v-if="!rh.started">
          <h2>对话预演</h2>
          <p class="hint block">描述你想练的场景，AI 会照这个人的画像和真实聊天语气扮演他，跟你对练。演练内容不保存、也不会真的发出去。</p>
          <textarea class="text-input" rows="3" maxlength="500" v-model="rh.scene" :disabled="rh.busy"
            placeholder="例：我要跟他谈涨薪，一年没调了，手上那个大项目刚上线"></textarea>
          <div class="rewrite-row">
            <span class="rewrite-label">谁先开口:</span>
            <label class="style-opt"><input type="radio" name="rh-first" value="me" v-model="rh.first" :disabled="rh.busy">我先说</label>
            <label class="style-opt"><input type="radio" name="rh-first" value="other" v-model="rh.first" :disabled="rh.busy">对方先说</label>
          </div>
          <button class="btn" @click="startRehearsal" :disabled="rh.busy || !rh.scene.trim()">{{ rh.busy ? '准备中…' : '开始预演' }}</button>
          <div v-if="rh.ctx">
            <h3>扮演依据</h3>
            <p class="empty" v-if="!rh.ctx.hints.length && !rh.ctx.sampleLines.length">这个人还没有画像，也没有历史消息，AI 只能按常理推测，预演效果会打折。</p>
            <div class="sec-lines" v-if="rh.ctx.hints.length">
              <p v-for="(h, i) in rh.ctx.hints" :key="i">{{ h }}</p>
            </div>
            <div v-if="rh.ctx.sampleLines.length">
              <p class="hint">他真实聊天里的说话样例：</p>
              <div class="sec-lines">
                <p v-for="(l, i) in rh.ctx.sampleLines" :key="'s' + i">「{{ l }}」</p>
              </div>
            </div>
          </div>
          <p class="empty" v-else-if="!rh.ctxBusy && rh.ctxFailed">没能读取扮演依据，请检查 LLM 配置后刷新页面。</p>
        </div>

        <div class="card" v-if="rh.started">
          <div class="tl-head">
            <h2>预演中</h2>
            <div>
              <button class="btn sm" @click="reviewRehearsal" :disabled="rh.busy || rh.reviewBusy || !rhMineCount">结束并复盘</button>
              <button class="btn ghost sm" @click="copyRehearsal" :disabled="!rh.turns.length">复制全文</button>
              <button class="btn ghost sm" @click="restartRehearsal" :disabled="rh.busy || rh.reviewBusy">重来</button>
            </div>
          </div>
          <p class="hint block">场景：{{ rh.scene }}</p>
          <div class="rh-log">
            <p class="empty" v-if="!rh.turns.length && !rh.busy">还没有对话，在下面输入你要说的第一句。</p>
            <div class="msg-row" v-for="(t, i) in rh.turns" :key="i" :class="t.role">
              <span class="m-sender">{{ t.role === 'me' ? '我' : (rh.ctx ? rh.ctx.name : '对方') }}</span>
              <div class="m-body">
                <div class="m-content">{{ t.text }}</div>
                <div class="m-time" v-if="t.emotion">情绪：{{ t.emotion }}</div>
              </div>
            </div>
            <p class="hint" v-if="rh.busy">对方正在输入…</p>
          </div>
          <textarea class="text-input" rows="2" maxlength="2000" v-model="rh.input" :disabled="rh.busy || rh.reviewBusy"
            placeholder="你要说的话（Ctrl+Enter 发送）" @keydown.ctrl.enter.prevent="sendRehearsal"></textarea>
          <button class="btn" @click="sendRehearsal" :disabled="rh.busy || rh.reviewBusy || !rh.input.trim()">{{ rh.busy ? '对方正在输入…' : '发送' }}</button>
        </div>

        <div class="card" v-if="rh.review">
          <div class="tl-head">
            <h2>复盘</h2>
            <span class="chip st-purple">达成可能 {{ rh.review.score }} / 10</span>
          </div>
          <p v-if="rh.review.summary">{{ rh.review.summary }}</p>
          <div v-if="rh.review.good.length">
            <h3>做得好</h3>
            <div class="sec-lines"><p v-for="(x, i) in rh.review.good" :key="i">· {{ x }}</p></div>
          </div>
          <div v-if="rh.review.bad.length">
            <h3>有问题</h3>
            <div class="sec-lines"><p v-for="(x, i) in rh.review.bad" :key="i">· {{ x }}</p></div>
          </div>
          <div v-if="rh.review.risks.length">
            <h3>真去谈可能踩的坑</h3>
            <div class="sec-lines"><p v-for="(x, i) in rh.review.risks" :key="i">· {{ x }}</p></div>
          </div>
          <div v-if="rh.review.suggestions.length">
            <h3>可以这么说</h3>
            <div class="sec-lines"><p v-for="(x, i) in rh.review.suggestions" :key="i">· {{ x }}</p></div>
          </div>
        </div>
      </div>

      <!-- ============ 关系驾驶舱（Phase 8） ============ -->
      <div v-if="contact && detailTab==='cockpit'" class="cockpit-panel">
        <!-- v4.8.0 对话质量评分：四维 0-100 + 手绘内联 SVG 雷达（纯本地、零 LLM） -->
        <div class="card quality-card">
          <div class="tl-head">
            <h2>对话质量 <span class="chip st-blue">本地评分</span></h2>
            <div class="q-ctrl">
              <select class="text-input sm" v-model.number="ck.qualityDays" @change="reloadQuality">
                <option :value="30">近 30 天</option>
                <option :value="90">近 90 天</option>
                <option :value="180">近 180 天</option>
                <option :value="365">近 1 年</option>
              </select>
              <button class="btn ghost sm" @click="loadQuality" :disabled="ck.qualityBusy">{{ ck.qualityBusy ? '评分中…' : '刷新' }}</button>
            </div>
          </div>
          <p class="empty" v-if="ck.qualityBusy && !ck.quality">正在量化回复及时性、对话深度、话题多样性与情绪正向度…</p>
          <p class="empty" v-else-if="ck.qualityFailed && !ck.quality">{{ ck.qualityError }}</p>
          <div v-else-if="ck.quality" class="q-body">
            <div class="q-radar-wrap">
              <svg class="q-radar" viewBox="0 0 200 200" role="img" aria-label="对话质量雷达图">
                <polygon v-for="(r,i) in qualityRadar.rings" :key="'ring'+i" :points="r" class="q-ring" />
                <line v-for="(a,i) in qualityRadar.axes" :key="'ax'+i" :x1="qualityRadar.cx" :y1="qualityRadar.cy" :x2="a.x2" :y2="a.y2" class="q-axis" />
                <polygon :points="qualityRadar.poly" class="q-poly" />
                <text v-for="(a,i) in qualityRadar.axes" :key="'lb'+i" :x="a.lx" :y="a.ly" class="q-axis-label" text-anchor="middle" dominant-baseline="middle">{{ a.label }}<tspan v-if="a.value!=null" class="q-axis-val"> {{ a.value }}</tspan><tspan v-else class="q-axis-val"> —</tspan></text>
              </svg>
              <div class="q-score-cap"><span class="q-score-big" :class="qScoreCls(ck.quality.score)">{{ ck.quality.score }}</span> 综合分</div>
            </div>
            <div class="q-dims">
              <div class="q-dim" v-for="d in ck.quality.dims" :key="d.key">
                <div class="q-dim-head">
                  <span class="q-dim-label">{{ d.label }}</span>
                  <span class="q-dim-val" :class="qScoreCls(d.value)">{{ d.value >= 0 ? d.value : '—' }}</span>
                </div>
                <div class="q-bar"><i :class="qScoreCls(d.value)" :style="{width: (d.value>=0?d.value:0)+'%'}"></i></div>
                <p class="q-dim-detail">{{ d.detail }}</p>
              </div>
            </div>
            <div class="q-history" v-if="qualityHistory.count >= 2">
              <div class="qh-head">
                <span class="qh-label">综合分趋势 · 近 {{ qualityHistory.count }} 周</span>
                <span class="qh-delta" :class="qualityHistory.deltaCls">{{ qualityHistory.deltaText }}</span>
              </div>
              <svg class="trend-spark qh-spark" width="220" height="40" viewBox="0 0 220 40" preserveAspectRatio="none">
                <polyline fill="none" stroke="currentColor" stroke-width="1.5" :points="qualityHistory.points"/>
              </svg>
              <p class="qh-hint">每次刷新按周留存综合分快照，追踪关系变化的长期信号。</p>
            </div>
          </div>
          <p class="hint" v-if="ck.quality">全部在本地根据消息与画像计算，不调用模型；可随时刷新，结果稳定可复现。</p>
        </div>

        <div class="card achieve-card">
          <div class="tl-head">
            <h2>关系成就 <span class="chip st-purple" v-if="ck.achievements">{{ ck.achievements.summary }}</span></h2>
            <button class="btn ghost sm" @click="loadAchievements" :disabled="ck.achBusy">{{ ck.achBusy ? '检测中…' : '刷新' }}</button>
          </div>
          <p class="empty" v-if="ck.achBusy && !ck.achievements">正在自动检测聊天里程碑（累计消息、连续互动、相识周年）…</p>
          <p class="empty" v-else-if="!ck.achievements || !ck.achievements.items || !ck.achievements.items.length">暂无成就数据</p>
          <div class="ach-grid" v-else>
            <div class="ach-item" :class="{ met: it.met }" v-for="(it,i) in ck.achievements.items" :key="i">
              <div class="ach-top">
                <span class="ach-title">{{ it.label }} {{ it.tier }} {{ it.unit }}</span>
                <span class="ach-state" :class="it.met ? 'met' : 'todo'">{{ it.met ? '已达成' : '未达成' }}</span>
              </div>
              <div class="ach-bar"><i :style="{width: (it.pct>100?100:it.pct) + '%'}"></i></div>
              <div class="ach-meta"><span class="ach-prog">{{ it.current }} / {{ it.target }}</span><span class="ach-date" v-if="it.met && it.achievedAt">{{ it.achievedAt.slice(0,10) }}</span></div>
            </div>
          </div>
          <p class="hint" v-if="ck.achievements">里程碑由本地聊天记录自动派生、首次跨越即写入时间线；可在「时间线」标签查看解锁历史。</p>
        </div>

        <!-- v5.4.0 #2 消息密度热力图：GitHub 贡献图式 53×7 SVG 网格（纯本地、零 LLM） -->
        <div class="card heatmap-card">
          <div class="tl-head">
            <h2>消息密度热力图 <span class="chip st-blue">全年</span></h2>
            <div class="q-ctrl">
              <select class="text-input sm" v-model.number="ck.hmYear" @change="reloadHeatmap">
                <option v-for="y in heatYears" :key="y" :value="y">{{ y }} 年</option>
              </select>
              <button class="btn ghost sm" @click="loadHeatmap" :disabled="ck.hmBusy">{{ ck.hmBusy ? '生成中…' : '刷新' }}</button>
            </div>
          </div>
          <p class="empty" v-if="ck.hmBusy && !ck.heatmap">正在按天聚合你与 TA 的全年互动密度…</p>
          <p class="empty" v-else-if="ck.hmFailed && !ck.heatmap">{{ ck.hmError }}</p>
          <template v-else-if="ck.heatmap && heatmapGrid">
            <p class="hint block">颜色越深代表当天互动越多；一眼看穿关系的季节变化与“消失的那段日子”。</p>
            <div class="hm-scroll">
              <svg class="hm-grid" :width="heatmapGrid.width" :height="heatmapGrid.height" :viewBox="'0 0 ' + heatmapGrid.width + ' ' + heatmapGrid.height" role="img" aria-label="全年消息密度热力图">
                <rect v-for="cell in heatmapGrid.cells" :key="cell.key" :x="cell.x" :y="cell.y" :width="heatmapGrid.cell" :height="heatmapGrid.cell" rx="2" :class="'hm-cell hm-l' + cell.lvl"><title>{{ cell.key }}：{{ cell.c }} 条</title></rect>
              </svg>
            </div>
            <div class="hm-legend">
              <span class="hint">少</span>
              <span class="hm-cell hm-l0"></span><span class="hm-cell hm-l1"></span><span class="hm-cell hm-l2"></span><span class="hm-cell hm-l3"></span><span class="hm-cell hm-l4"></span>
              <span class="hint">多</span>
              <span class="hint hm-total">全年共 {{ heatmapGrid.total }} 条 · 单日峰值 {{ heatmapGrid.max }}</span>
            </div>
          </template>
        </div>

        <!-- v5.4.0 #3 互动节奏分析：回复中位数/秒回率/时段签名（纯本地、零 LLM） -->
        <div class="card rhythm-card">
          <div class="tl-head">
            <h2>互动节奏 <span class="chip st-purple">节奏画像</span></h2>
            <button class="btn ghost sm" @click="loadRhythm" :disabled="ck.rhBusy">{{ ck.rhBusy ? '分析中…' : '刷新' }}</button>
          </div>
          <p class="empty" v-if="ck.rhBusy && !ck.rhythm">正在统计你回复 TA 的速度与活跃时段…</p>
          <p class="empty" v-else-if="ck.rhFailed && !ck.rhythm">{{ ck.rhError }}</p>
          <template v-else-if="ck.rhythm">
            <p class="empty" v-if="ck.rhythm.note">{{ ck.rhythm.note }}</p>
            <template v-else>
              <div class="rh-metrics">
                <div class="rh-metric"><span class="rh-num">{{ fmtMedian(ck.rhythm.replyMedianMin) }}</span><span class="rh-lbl">回复中位数</span></div>
                <div class="rh-metric"><span class="rh-num">{{ Math.round(ck.rhythm.fastRatio) }}%</span><span class="rh-lbl">秒回率</span></div>
                <div class="rh-metric"><span class="rh-num rh-sig">{{ ck.rhythm.signature }}</span><span class="rh-lbl">时段签名</span></div>
              </div>
              <div class="rh-hours" v-if="ck.rhythm.bestHours && ck.rhythm.bestHours.length">
                <span class="rh-sub">最活跃时段</span>
                <span class="chip st-blue rh-hour" v-for="h in ck.rhythm.bestHours" :key="h">{{ h }}:00</span>
              </div>
              <div class="rh-hours" v-if="ck.rhythm.bestWeekdays && ck.rhythm.bestWeekdays.length">
                <span class="rh-sub">最活跃日</span>
                <span class="chip st-blue rh-hour" v-for="w in ck.rhythm.bestWeekdays" :key="w">{{ w }}</span>
              </div>
              <p class="hint" v-if="ck.rhythm.sample">基于 TA 的 {{ ck.rhythm.sample }} 条发言样本，纯本地统计、不花模型费用。</p>
            </template>
          </template>
        </div>

        <!-- v5.4.0 #5 对话风格镜像：你在 TA 面前的样子（纯本地文本统计、零 LLM） -->
        <div class="card mirror-card">
          <div class="tl-head">
            <h2>风格镜像 <span class="chip st-blue">你在 TA 面前</span></h2>
            <button class="btn ghost sm" @click="loadMirror" :disabled="ck.miBusy">{{ ck.miBusy ? '分析中…' : '刷新' }}</button>
          </div>
          <p class="empty" v-if="ck.miBusy && !ck.mirror">正在对比你在 TA 面前与平时的说话风格…</p>
          <p class="empty" v-else-if="ck.miFailed && !ck.mirror">{{ ck.miError }}</p>
          <template v-else-if="ck.mirror">
            <p class="empty" v-if="ck.mirror.note">{{ ck.mirror.note }}</p>
            <template v-else>
              <div class="mi-traits" v-if="ck.mirror.traits && ck.mirror.traits.length">
                <span class="chip st-purple mi-trait" v-for="t in ck.mirror.traits" :key="t">{{ t }}</span>
              </div>
              <div class="mi-dims">
                <div class="mi-dim" v-for="d in ck.mirror.dimensions" :key="d.key">
                  <div class="mi-dim-head">
                    <span class="mi-dim-label">{{ d.label }}</span>
                    <span class="mi-dim-val">{{ mirrorValText(d) }}<span class="hint mi-base">平时 {{ mirrorValText({ key: d.key, value: d.baseline }) }}</span></span>
                    <span class="chip mi-delta" :class="mirrorDeltaCls(d.delta)">{{ d.delta }}</span>
                  </div>
                  <div class="mi-bar"><i :style="{width: mirrorValPct(d) + '%'}"></i><em class="mi-base-mark" :style="{left: mirrorBasePct(d) + '%'}"></em></div>
                </div>
              </div>
              <p class="hint" v-if="ck.mirror.sample">基于你发给 TA 的 {{ ck.mirror.sample }} 条消息，与你的全局均值对比；纯本地文本统计。</p>
            </template>
          </template>
        </div>

        <div class="card">
          <div class="tl-head">
            <h2>关系趋势</h2>
            <div>
              <span class="chip" :class="ck.trend ? ((ckTrendMeta[ck.trend.state]||{cls:'st-gray'}).cls) : 'st-gray'" v-if="ck.trend">{{ (ckTrendMeta[ck.trend.state]||{label:ck.trend.state}).label }}</span>
              <button class="btn ghost sm" @click="loadTrend" :disabled="ck.trendBusy">{{ ck.trendBusy ? '计算中…' : '刷新' }}</button>
            </div>
          </div>
          <p class="empty" v-if="ck.trendBusy && !ck.trend">正在根据互动频度计算趋势…</p>
          <p class="empty" v-else-if="!ck.trend">暂无趋势数据</p>
          <div v-else>
            <p class="hint block">{{ ck.trend.summary }}</p>
            <div class="ck-metrics">
              <div><span class="ck-num">{{ ck.trend.recent30 }}</span><span class="ck-lbl">近 30 天互动</span></div>
              <div><span class="ck-num">{{ ck.trend.prior30 }}</span><span class="ck-lbl">前 30 天互动</span></div>
              <div><span class="ck-num">{{ ck.trend.daysSinceLast }}</span><span class="ck-lbl">距上次(天)</span></div>
              <div><span class="ck-num">{{ Math.round((ck.trend.meRatioRecent||0)*100) }}%</span><span class="ck-lbl">我方占比</span></div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="tl-head">
            <h2>下一步行动建议</h2>
            <button class="btn sm" @click="genSuggestions" :disabled="ck.sugBusy">{{ ck.sugBusy ? '生成中…' : '生成/刷新' }}</button>
          </div>
          <p class="empty" v-if="!ck.suggestions.length && !ck.sugBusy">暂无建议。点“生成/刷新”根据互动变化生成。</p>
          <div class="ck-sug" v-for="s in ck.suggestions" :key="s.id" :class="'ck-sug-'+s.status">
            <div class="ck-sug-main">
              <span class="chip st-warn" v-if="s.status==='open'">{{ ckKindLabel[s.kind] || s.kind }}</span>
              <span class="chip st-gray" v-else>{{ s.status==='done' ? '已完成' : '已忽略' }} · {{ ckKindLabel[s.kind] || s.kind }}</span>
              <span class="ck-reason">{{ s.reason }}</span>
            </div>
            <p class="ck-draft" v-if="s.draft">建议这样开口：{{ s.draft }}</p>
            <div class="ck-sug-acts" v-if="s.status==='open'">
              <button class="btn ghost xs" @click="setSuggestionStatus(s,'done')">标记完成</button>
              <button class="btn ghost xs" @click="setSuggestionStatus(s,'dismissed')">忽略</button>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="tl-head">
            <h2>可信画像 · 事实与证据</h2>
            <button class="btn ghost sm" @click="loadFacts(true)" :disabled="ck.factsBusy">{{ ck.factsBusy ? '重建中…' : '重建' }}</button>
          </div>
          <p class="hint block">从画像拆出的离散事实，自动链到支撑它的真实聊天。证据越多置信度越高，点一行可展开证据。</p>
          <p class="empty" v-if="ck.factsBusy && !ck.facts.length">正在读取事实…</p>
          <p class="empty" v-else-if="!ck.facts.length">还没有事实。请先生成画像。</p>
          <ul class="ck-facts" v-else>
            <li v-for="f in ck.facts" :key="f.id">
              <div class="ck-fact-head" @click="ckToggleFact(f.id)">
                <span class="ck-ftype">{{ factTypeCN(f.type) }}</span>
                <span class="ck-fkey" v-if="f.key">{{ f.key }}：</span>
                <span class="ck-fval">{{ f.value }}</span>
                <span class="ck-conf" :title="'置信度 ' + ckPct(f.confidence)">
                  <i class="ck-conf-bar" :style="{width: ckPct(f.confidence)}"></i>{{ ckPct(f.confidence) }}
                </span>
                <span class="ck-ev-n">{{ (f.evidence||[]).length }} 证据</span>
              </div>
              <div class="ck-ev" v-if="ckExpanded[f.id]">
                <p class="empty" v-if="!(f.evidence||[]).length">暂无支撑该事实的消息</p>
                <div class="ck-ev-item" v-for="(ev, i) in (f.evidence||[])" :key="i">
                  <span class="ck-ev-time">{{ ev.msgTime }}</span>
                  <span class="chip st-gray" v-if="ev.archived">已归档</span>
                  <div class="ck-ev-snip">{{ ev.snippet }}</div>
                </div>
              </div>
            </li>
          </ul>
        </div>

        <div class="card">
          <h2>回复前推演 <span class="chip st-purple">AI 模拟</span></h2>
          <p class="hint block">写好你打算发出去的一句，先看对方大概率会怎么接。这是 AI 基于画像与历史的推测，不代表真实反应。</p>
          <textarea class="text-input" rows="2" maxlength="500" v-model="ck.draft" :disabled="ck.simBusy" placeholder="例：这周末有空吗？想约你去新开的展览馆"></textarea>
          <button class="btn" @click="runSimulate" :disabled="ck.simBusy || !ck.draft.trim()">{{ ck.simBusy ? '推演中…' : '推演对方反应' }}</button>
          <p class="empty" v-if="ck.simFailed && !ck.simResult">{{ ck.simError }}</p>
          <div v-if="ck.simResult">
            <div class="ck-sim" v-for="(r, i) in ck.simResult.replies" :key="i">
              <span class="chip" :class="r.mood==='积极' ? 'st-ok' : (r.mood==='消极' ? 'st-bad' : 'st-gray')">{{ r.mood || '中性' }}</span>
              <div class="ck-sim-text">「{{ r.text }}」</div>
              <div class="ck-sim-why" v-if="r.rationale">{{ r.rationale }}</div>
            </div>
            <p class="hint" v-if="ck.simResult.note">{{ ck.simResult.note }}</p>
          </div>
        </div>

        <div class="card">
          <h2>问 TA 的历史 <span class="chip st-blue">检索 + AI</span></h2>
          <p class="hint block">用大白话问关于这个人的往事（例：他上次说想去哪玩？）。系统先检索相关历史原文，再让模型带出处作答；答案只依据检索到的真实消息。</p>
          <div class="ck-ask-bar">
            <input class="text-input" v-model="ck.askQ" :disabled="ck.askBusy" maxlength="200" placeholder="例：她提过想看的那部电影是什么？" @keyup.enter="askContact" />
            <button class="btn" @click="askContact" :disabled="ck.askBusy || !ck.askQ.trim()">{{ ck.askBusy ? '查找中…' : '提问' }}</button>
          </div>
          <p class="empty" v-if="ck.askFailed && !ck.askResult">{{ ck.askError }}</p>
          <div v-if="ck.askResult" class="ck-ask-result">
            <div class="ck-ask-answer">{{ ck.askResult.answer }}</div>
            <div class="ck-ask-sources" v-if="ck.askResult.sources && ck.askResult.sources.length">
              <div class="ck-ask-src-title">出处（点击可跳转聊天记录定位）</div>
              <div class="ck-ask-src" v-for="s in ck.askResult.sources" :key="s.n" @click="jumpToAskSource(s)">
                <span class="ck-ask-n">[{{ s.n }}]</span>
                <span class="ck-ask-who">{{ s.who }}</span>
                <span class="ck-ask-time">{{ s.msgTime }}<template v-if="s.archived"> · 已归档</template></span>
                <div class="ck-ask-snip">{{ s.snippet }}</div>
              </div>
            </div>
            <p class="hint" v-if="ck.askResult.note">{{ ck.askResult.note }}</p>
          </div>
        </div>

        <div class="card sum-card">
          <h2>回顾摘要 <span class="chip st-purple">AI · 带出处</span></h2>
          <p class="hint block">选一个时间窗口，基于窗口内的真实聊天原文自动总结：讨论了什么（overview + topics）、需要跟进什么（todos）；每条带 [n] 出处可点击跳转原文，待办可一键转跟进。未配置模型时返回 503，不编造。</p>
          <div class="sum-bar">
            <select class="text-input sel" v-model.number="ck.summaryDays" :disabled="ck.summaryBusy">
              <option :value="7">近 7 天</option>
              <option :value="30">近 30 天</option>
              <option :value="90">近 90 天</option>
              <option :value="180">近 180 天</option>
            </select>
            <button class="btn" @click="genSummary" :disabled="ck.summaryBusy">{{ ck.summaryBusy ? '生成中…' : (ck.summaryResult ? '重新生成' : '生成回顾') }}</button>
          </div>
          <p class="empty" v-if="ck.summaryFailed && !ck.summaryResult">{{ ck.summaryError }}</p>
          <div v-if="ck.summaryResult" class="sum-body">
            <div class="sum-meta">回顾窗口：{{ ck.summaryResult.from }} → {{ ck.summaryResult.to }}</div>
            <div class="sum-overview" v-if="ck.summaryResult.overview">{{ ck.summaryResult.overview }}</div>
            <div class="sum-overview-empty" v-else>窗口内原文不足，未生成总结（不硬编）。</div>
            <div class="sum-topics" v-if="ck.summaryResult.topics && ck.summaryResult.topics.length">
              <span class="sum-topic" v-for="(t,i) in ck.summaryResult.topics" :key="i">{{ t }}</span>
            </div>
            <div class="sum-todos" v-if="ck.summaryResult.todos && ck.summaryResult.todos.length">
              <div class="sum-todos-title">待办事项</div>
              <div class="sum-todo" v-for="(td,i) in ck.summaryResult.todos" :key="i">
                <span class="sum-owner" :class="td.owner==='对方' ? 'is-other':'is-me'">{{ td.owner }}</span>
                <span class="sum-text">{{ td.text }}</span>
                <a class="sum-ref" v-if="td.ref" @click="jumpToSummarySource(td)">{{ td.ref }}</a>
                <button class="btn ghost sm sum-add" @click="todoToFollowup(td)" :disabled="td._added">{{ td._added ? '已加入' : '记为待跟进' }}</button>
              </div>
            </div>
            <div class="sum-sources" v-if="ck.summaryResult.sources && ck.summaryResult.sources.length">
              <div class="sum-src-title">出处（点击可跳转聊天记录定位）</div>
              <div class="sum-src" v-for="s in ck.summaryResult.sources" :key="s.n" @click="jumpToAskSource(s)">
                <span class="sum-n">[{{ s.n }}]</span>
                <span class="sum-who">{{ s.who }}</span>
                <span class="sum-time">{{ s.msgTime }}</span>
                <div class="sum-snip">{{ s.snippet }}</div>
              </div>
            </div>
            <p class="hint" v-if="ck.summaryResult.note">{{ ck.summaryResult.note }}</p>
          </div>
        </div>

        <!-- v5.5.0 #6 关系叙事：LLM + 双重降级（无模型回落确定性叙事，永不 503），可导出精美卡片 -->
        <div class="card narr-card">
          <div class="tl-head">
            <h2>关系故事 <span class="chip st-purple">AI · 双重降级</span></h2>
            <div class="q-ctrl">
              <select class="text-input sm" v-model.number="ck.narrDays" :disabled="ck.narrBusy">
                <option :value="30">近 30 天</option>
                <option :value="90">近 90 天</option>
                <option :value="180">近 180 天</option>
                <option :value="365">近 1 年</option>
              </select>
              <button class="btn" @click="genNarrative" :disabled="ck.narrBusy">{{ ck.narrBusy ? '书写中…' : (ck.narr ? '重新书写' : '写下我们的故事') }}</button>
            </div>
          </div>
          <p class="hint block">基于你们的往来事实（相识年数、首次互动、近期主题、消息量）写一段温暖的关系叙事；未配置模型时自动回落为「确定性叙事」，不编造、不报 503。可一键导出为精美卡片分享。</p>
          <p class="empty" v-if="ck.narrBusy && !ck.narr">正在为你和 TA 书写这段关系的故事…</p>
          <p class="empty" v-else-if="ck.narrFailed && !ck.narr">{{ ck.narrError }}</p>
          <div v-else-if="ck.narr" class="narr-body">
            <div class="narr-meta">
              <span class="narr-badge" :class="ck.narr.source==='llm' ? 'is-llm':'is-det'">{{ ck.narr.source==='llm' ? 'AI 生成' : '事实叙事' }}</span>
              <span class="narr-stat" v-if="ck.narr.years>=1">相识 {{ ck.narr.years }} 年</span>
              <span class="narr-stat" v-if="ck.narr.msgCount>0">往来 {{ ck.narr.msgCount }} 条</span>
              <span class="narr-stat" v-if="ck.narr.firstDate">始于 {{ ck.narr.firstDate }}</span>
            </div>
            <p class="narr-text">{{ ck.narr.narrative }}</p>
            <div class="narr-topics" v-if="ck.narr.recentTopics && ck.narr.recentTopics.length">
              <span class="chip st-blue narr-topic" v-for="(t,i) in ck.narr.recentTopics" :key="i">{{ t }}</span>
            </div>
            <p class="hint" v-if="ck.narr.note">{{ ck.narr.note }}</p>
            <div class="narr-actions">
              <button class="btn ghost sm" @click="downloadNarrativeCard" :disabled="!ck.narr.narrative">下载分享卡片</button>
            </div>
          </div>
        </div>

        <!-- v5.5.0 #7 关系目标（联系人详情：仅显示该联系人的目标）-->
        <div class="card cg-card" v-if="contactGoals.length">
          <div class="tl-head">
            <h2>TA 的目标 <span class="chip st-blue">{{ contactGoals.length }}</span></h2>
            <button class="btn ghost sm" @click="openGoalForm(contact.id)">＋ 新目标</button>
          </div>
          <ul class="cg-list">
            <li class="cg-item" :class="{done: g.status==='done'}" v-for="g in contactGoals" :key="g.id">
              <div class="cg-top">
                <span class="cg-title">{{ g.title }}</span>
                <span class="cg-cur">{{ g.current }} / {{ g.targetCount }}</span>
              </div>
              <div class="cg-bar"><i :style="{width: goalPct(g) + '%'}"></i></div>
              <div class="cg-foot">
                <span class="hint">{{ goalMetricLabel(g.metric) }}</span>
                <template v-if="g.status==='active'">
                  <button class="btn ghost xs" @click="completeGoal(g)">标记达成</button>
                  <button class="btn ghost xs" @click="deleteGoal(g)">删除</button>
                </template>
                <span class="chip st-ok" v-else>已达成</span>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </section>

    <!-- ============ 合并记录 ============ -->
    <section v-if="route.view==='merges'">
      <div class="list-head">
        <h2>合并记录 <span class="count" v-if="mergeLogs.length">{{ mergeLogs.length }}</span></h2>
        <button class="btn ghost sm" @click="loadMergeLogs" :disabled="loadingMerges">刷新</button>
      </div>
      <p class="empty" v-if="!loadingMerges && !mergeLogs.length">暂无合并记录</p>
      <div class="card merge-card" v-for="l in mergeLogs" :key="l.ID">
        <div class="mg-main">
          <div class="mg-title">{{ l.SourceName }} → {{ l.TargetName }}</div>
          <div class="c-meta">
            <span>{{ fmtTime(l.CreatedAt) }}</span>
            <span class="chip st-gray" v-if="l.UndoneAt">已撤销 {{ fmtTime(l.UndoneAt) }}</span>
          </div>
        </div>
        <button class="btn sm danger" v-if="!l.UndoneAt" @click="undoMerge(l)" :disabled="busy">撤销合并</button>
      </div>
    </section>

    <!-- ============ 备份 / 恢复 ============ -->
    <section v-if="route.view==='backup'">
      <div class="card">
        <h2>备份与恢复</h2>
        <p class="hint block">
          备份是一个 zip 文件，包含：全部联系人、消息、画像、画像历史、别名与合并记录，
          以及配置（模型 Key）、微信登录凭据和 2FA 密钥。换服务器或电脑时，部署好新程序后直接在这里导入即可。
        </p>
        <div class="backup-actions">
          <button class="btn primary" @click="exportBackup" :disabled="backupBusy">
            {{ backupBusy === 'export' ? '正在生成…' : '导出备份（下载 zip）' }}
          </button>
          <input class="text-input grow" :type="showEncPwd ? 'text' : 'password'" v-model="encPassword"
                 placeholder="备份密码（选填，填了就加密密钥文件）" autocomplete="new-password">
        </div>
        <div class="backup-actions">
          <button class="btn" @click="pickImport" :disabled="backupBusy">导入备份（从 zip 恢复）</button>
          <input class="text-input grow" :type="showEncPwd ? 'text' : 'password'" v-model="impPassword"
                 placeholder="备份密码（备份加密过才需要填）" autocomplete="off">
          <label class="check-row inline"><input type="checkbox" v-model="showEncPwd"> 显示密码</label>
        </div>
        <input type="file" ref="backupFile" accept=".zip" style="display:none" @change="importBackup">
        <p class="hint block" v-if="backupResult">{{ backupResult }}</p>
        <ul class="backup-notes">
          <li>导入会<strong>整体替换</strong>当前所有数据；系统会在服务器数据目录自动留一份「恢复前自动备份」，可反悔。</li>
          <li>聊天数据导入后立即生效；配置、登录凭据、2FA 密钥文件需<strong>重启服务</strong>后生效。</li>
          <li>备份文件含有密钥，等同密码，请妥善保管、不要公开分享。</li>
          <li>填了「备份密码」时，模型 Key、微信登录凭据、2FA 密钥会以 AES-256 加密后放进 zip（文件名带 <code>.enc</code>），
            导入时需填同一密码。<strong>密码程序不会保存，忘了就无法恢复这几个文件</strong>（聊天数据不受影响）。</li>
          <li>加密只针对密钥文件，<strong>聊天数据库仍是明文</strong>；zip 也仍是标准格式，可直接用解压软件打开查看。</li>
          <li>也可以在微信给 ClawBot 发「备份」，在服务器数据目录生成备份文件（该方式不支持加密）。</li>
        </ul>
        <div class="backup-log-section" v-if="backupLogs.length">
          <h3>最近操作记录</h3>
          <table class="backup-log-table">
            <thead>
              <tr>
                <th>时间</th>
                <th>操作</th>
                <th>来源</th>
                <th>文件名</th>
                <th>大小</th>
                <th>详情</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="l in backupLogs" :key="l.id" :class="{err:!l.success}">
                <td>{{ l.createdAt ? fmtTime(l.createdAt).slice(0,16) : '-' }}</td>
                <td>
                  <span class="tag" :class="l.action==='export'?'tag-green':'tag-orange'">
                    {{ l.action==='export'?'导出':'恢复' }}
                  </span>
                  <span v-if="!l.success" class="tag tag-red">失败</span>
                </td>
                <td>{{ {web:'网页',wechat:'微信',desktop:'桌面'} [l.source] || l.source }}</td>
                <td :title="l.filename">{{ l.filename || '-' }}</td>
                <td>{{ l.sizeBytes ? (l.sizeBytes/1024/1024).toFixed(1)+' MB' : '-' }}</td>
                <td :title="l.detail" class="log-detail">{{ l.detail || '-' }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 消息归档 -->
      <div class="card">
        <h2>消息归档</h2>
        <p class="hint block">
          把超过保留期的旧消息移入同库的归档表，缩小活动数据、加快日常查询。
          归档消息不再出现在联系人聊天记录里，但会随备份一起导出，随时可恢复。
        </p>
        <div v-if="archive">
          <div class="backup-actions">
            <label class="check-row inline"><input type="checkbox" v-model="archiveForm.enabled"> 每日自动归档</label>
            <span class="hint">保留最近</span>
            <input class="text-input" style="width:90px" type="number" min="30" max="36500" v-model.number="archiveForm.retentionDays">
            <span class="hint">天的消息（默认 730 天 ≈ 2 年）</span>
            <button class="btn sm" @click="saveArchiveSettings" :disabled="archiveBusy">保存设置</button>
          </div>
          <p class="hint block">
            活动消息 {{ archive.stats.activeMessages }} 条 ·
            已归档 {{ archive.stats.archivedMessages }} 条 ·
            当前可归档 {{ archive.stats.eligible }} 条
            <template v-if="archive.stats.lastRunAt"> · 上次归档 {{ fmtTime(archive.stats.lastRunAt) }}</template>
          </p>
          <div class="backup-actions">
            <button class="btn primary" @click="runArchive" :disabled="archiveBusy || !archive.stats.eligible">
              {{ archiveBusy === 'run' ? '正在归档…' : '立即归档超期消息' }}
            </button>
            <button class="btn danger" @click="restoreArchive(0)" :disabled="archiveBusy || !archive.stats.archivedMessages">
              {{ archiveBusy === 'restore' ? '正在恢复…' : '恢复全部归档' }}
            </button>
          </div>
          <p class="hint block" v-if="archiveResult">{{ archiveResult }}</p>
          <div class="backup-log-section" v-if="archive.byContact.length">
            <h3>归档明细（按联系人）</h3>
            <table class="backup-log-table">
              <thead>
                <tr><th>联系人</th><th>归档条数</th><th>时间范围</th><th></th></tr>
              </thead>
              <tbody>
                <tr v-for="a in archive.byContact" :key="a.contactId">
                  <td>
                    <span v-if="a.deleted" class="tag tag-red">已删除的联系人</span>
                    <template v-else>{{ a.name || ('#' + a.contactId) }}</template>
                  </td>
                  <td>{{ a.count }}</td>
                  <td>{{ a.oldest ? fmtTime(a.oldest).slice(0,10) : '?' }} ~ {{ a.newest ? fmtTime(a.newest).slice(0,10) : '?' }}</td>
                  <td><button class="btn sm ghost" @click="restoreArchive(a.contactId)" :disabled="archiveBusy">恢复</button></td>
                </tr>
              </tbody>
            </table>
            <p class="hint block" v-if="archive.byContact.some(a => a.deleted)">「已删除的联系人」的归档消息无法恢复到聊天中（联系人不存在），恢复全部时会原地保留。</p>
          </div>
        </div>
        <p class="hint block" v-else-if="archiveError">归档状态读取失败，请重试 <button class="btn xs" @click="loadArchive">重新读取</button></p>
        <p class="hint block" v-else>正在读取归档状态…</p>
      </div>

      <!-- 可信设备 -->
      <div class="card">
        <h2>可信设备（免登录）</h2>
        <p class="hint block">
          登录时勾选「信任此设备」后，该浏览器 90 天内打开页面免输 Token 和动态码（每次使用自动续期）。
          设备丢失或不再使用时在这里吊销；关闭 2FA 会自动吊销全部可信设备。
        </p>
        <p class="empty" v-if="trustedList && !trustedList.length">暂无可信设备——下次登录时勾选「信任此设备」即可添加</p>
        <table class="backup-log-table" v-if="trustedList && trustedList.length">
          <thead>
            <tr><th>设备名</th><th>令牌</th><th>添加时间</th><th>最近使用</th><th>到期</th><th></th></tr>
          </thead>
          <tbody>
            <tr v-for="t in trustedList" :key="t.tokenPrefix">
              <td>{{ t.name }}</td>
              <td><code>{{ t.token }}</code></td>
              <td>{{ fmtTime(t.createdAt).slice(0,16) }}</td>
              <td>{{ t.lastUsedAt ? fmtAgo(t.lastUsedAt) : '未使用' }}<span v-if="t.lastIp" class="hint">（{{ t.lastIp }}）</span></td>
              <td>{{ fmtTime(t.expiresAt).slice(0,10) }}</td>
              <td><button class="btn sm danger" @click="revokeTrusted(t)" :disabled="trustedBusy">吊销</button></td>
            </tr>
          </tbody>
        </table>
        <div class="backup-actions" v-if="trustedList && trustedList.length">
          <button class="btn danger" @click="revokeAllTrusted" :disabled="trustedBusy">吊销全部可信设备</button>
        </div>
      </div>
    </section>

    <!-- ============ 关系助手 ============ -->
    <section v-if="route.view==='assistant'">
      <div class="card status-head-card">
        <div>
          <h2 style="margin:0">关系助手</h2>
          <p class="hint" style="margin:4px 0 0">重要日子 / 久未联系提醒、亲密度评分、情绪预警，全部通过邮件发送，不影响微信机器人现有功能</p>
        </div>
        <button class="btn sm" @click="loadAssistant" :disabled="asstLoading">{{ asstLoading ? '加载中…' : '刷新' }}</button>
      </div>

      <div v-if="!asst && asstLoading" class="card">正在读取关系助手数据…</div>
      <div v-if="!asst && !asstLoading" class="card">读取失败，点右上角「刷新」重试。</div>

      <template v-if="asst">
        <!-- 使用引导：三步上手 -->
        <div class="card guide-card">
          <h3>怎么用·三步上手</h3>
          <p class="hint block" style="margin-top:0">它的本质：把“今天该联系谁、该说什么”每天通过邮件推给你。第一次用按下面三步配好即可，之后无需再动。</p>
          <ol class="guide-steps">
            <li><strong>配一次邮箱（SMTP）</strong>：填服务器、端口、账号和<em>授权码</em>（不是登录密码；QQ/163 需在邮箱设置里开启 SMTP 并生成）与收件人 →「保存设置」→「发测试邮件」，右上角芯片变绿「SMTP 配置完整」才算通。</li>

          <p class="hint block">关系助手与微信机器人相互独立：不配邮箱或不启用时零开销，不影响现有功能。</p>

        <!-- v5.3.0 #5 关系教练：周计划话术 + 该联系人的最佳联系时机（纯确定性、零新模型调用） -->
        <div class="card coach-card">

          <p class="empty" v-else-if="!coach.items.length">本周暂无教练建议——保持得不错。</p>
          <ul class="coach-list" v-else>
            <li class="coach-item" v-for="it in coach.items" :key="it.contactId">
              <div class="co-top">
                <a :href="'#/contact/' + it.contactId">{{ it.name }}</a>
                <span class="chip co-action" v-if="it.action">{{ it.action }}</span>
              </div>
              <p class="co-reason hint" v-if="it.reason">{{ it.reason }}</p>

              </div>
            </li>
          </ul>
          <p class="hint block" v-if="coach.generatedAt">更新于 {{ coach.generatedAt }}</p>
        </div>

        <!-- v5.3.0 #8 维护挑战 / 游戏化：本周挑战 + XP/等级 + 徽章（确定性完成检测） -->
        <div class="card chal-card">
          <div class="tl-head">
            <h3 style="margin:0">🏆 维护挑战</h3>
            <button class="btn ghost sm" @click="loadChallenges" :disabled="chalsBusy">{{ chalsBusy ? '刷新中…' : '刷新' }}</button>
          </div>
          <p class="hint block">每周从久未联系、待回复、核心圈里自动挑最多 3 条小目标；你照常发消息，系统按本周新增互动自动判定达成并加经验值——不用手动打勾。</p>
          <div class="chal-head" v-if="chals.total || chals.xp">
            <div class="chal-week">
              <span class="cw-label">本周进度</span>
              <span class="cw-num">{{ chals.done }} / {{ chals.total }}</span>
              <span class="cw-bar"><i :style="{width: chalWeekPct() + '%'}"></i></span>
            </div>
            <div class="chal-level">
              <span class="cl-label">Lv.{{ chals.level }}</span>
              <span class="cl-num">{{ chals.xp }} XP</span>
              <span class="cl-bar"><i :style="{width: chalLevelPct() + '%'}"></i></span>
              <span class="cl-next hint">距下一级还差 {{ chals.nextLevelAt - chals.xp }} XP</span>
            </div>
          </div>
          <p class="empty" v-if="!chals.challenges.length">本周还没有生成挑战——多录入一些聊天记录后自动会出。</p>
          <ul class="chal-list" v-else>
            <li class="chal-item" :class="{done: c.achieved}" v-for="c in chals.challenges" :key="c.kind + '-' + c.contactId">
              <span class="ci-check">{{ c.achieved ? '✓' : '○' }}</span>
              <div class="ci-body">
                <div class="ci-title">{{ c.title }}</div>
                <a class="hint" :href="'#/contact/' + c.contactId" v-if="c.contactId">{{ c.name }}</a>
              </div>
              <span class="ci-xp">+{{ c.xp }} XP</span>
            </li>
          </ul>
          <p class="hint block" v-if="chals.badgesUnlocked">已解锁成就徽章 {{ chals.badgesUnlocked }} 枚 · 详见「洞察 · 成就」。</p>
          <p class="hint block" v-if="chals.weekStart">统计周起始：{{ chals.weekStart }}</p>
        </div>

        <!-- v5.5.0 #7 关系目标：用户自设可量化目标 + 自动达标加 XP（与上方“维护挑战=系统建议”语义划清）-->
        <div class="card goal-card">
          <div class="tl-head">
            <h3 style="margin:0">🎯 关系目标</h3>
            <div>
              <button class="btn ghost sm" @click="openGoalForm(0)">＋ 新建目标</button>
              <button class="btn ghost sm" @click="loadGoals" :disabled="goalsBusy">{{ goalsBusy ? '刷新中…' : '刷新' }}</button>
            </div>
          </div>
          <p class="hint block">区别于上方的系统维护挑战：这里是你自己给自己定的小目标（如“本周主动发 5 条”）。你照常发消息，系统按窗口内我方发言条数自动判定达标并加经验值。</p>
          <div class="gl-head" v-if="goals.total || goals.xp">
            <div class="gl-stat">
              <span class="gw-label">目标进度</span>
              <span class="gw-num">{{ goals.done }} / {{ goals.total }}</span>
              <span class="gw-bar"><i :style="{width: (goals.total ? Math.round(goals.done / goals.total * 100) : 0) + '%'}"></i></span>
            </div>
            <div class="gl-level">
              <span class="cl-label">Lv.{{ goals.level }}</span>
              <span class="cl-num">{{ goals.xp }} XP</span>
            </div>
          </div>
          <p class="empty" v-if="!goals.goals.length">{{ goals.note || '还没有关系目标，给自己定一个可量化的小目标吧。' }}</p>
          <ul class="gl-list" v-else>
            <li class="gl-item" :class="{done: g.status==='done'}" v-for="g in goals.goals" :key="g.id">
              <span class="gi-check">{{ g.status==='done' ? '✓' : '○' }}</span>
              <div class="gi-body">
                <div class="gi-title">{{ g.title }}</div>
                <div class="gi-meta">
                  <a class="hint" :href="'#/contact/' + g.contactId" v-if="g.contactId">{{ g.name }}</a>
                  <span class="hint">{{ goalMetricLabel(g.metric) }} · {{ g.current }} / {{ g.targetCount }}</span>
                </div>
                <div class="gi-bar"><i :style="{width: goalPct(g) + '%'}"></i></div>
              </div>
              <div class="gi-acts" v-if="g.status==='active'">
                <button class="btn ghost xs" @click="completeGoal(g)">达成</button>
                <button class="btn ghost xs" @click="deleteGoal(g)">删除</button>
              </div>
              <span class="chip st-ok gi-done" v-else>已达成</span>
            </li>
          </ul>
          <p class="hint block" v-if="goals.weekStart">统计周起始：{{ goals.weekStart }}</p>
        </div>

        <!-- 设置 -->

          <label class="check-row"><input type="checkbox" v-model="asstForm.enabled">

            <label class="check-row inline"><input type="checkbox" v-model="asstForm.remindBirthday"> 重要日子提醒</label>

          </div>

            <span class="st-label">每日提醒时间</span>
            <input class="text-input num-input" type="time" v-model="asstForm.dailyCheckTime">
            <span class="hint">到点聚合当天所有提醒发一封邮件，没有内容则不发</span>
          </div>
          <div class="asst-row">
            <label class="check-row inline"><input type="checkbox" v-model="asstForm.emotionAlert"> 情绪预警</label>

            <input class="text-input num-input" type="number" min="1" max="50" v-model.number="asstForm.emotionDailyMax">

          </div>

            <label class="check-row inline"><input type="checkbox" v-model="asstForm.remindFollowup"> 待跟进提醒</label>
            <span class="hint">把「对方问了我没回 / 我答应的事 / 钱款往来」一起放进每日邮件</span>
          </div>
          <div class="asst-row" v-if="asstForm.remindFollowup">
            <label class="check-row inline"><input type="checkbox" v-model="asstForm.followupEnabled"> 自动从聊天记录里抽取</label>
            <span class="hint">近</span>
            <input class="text-input num-input" type="number" min="1" max="180" v-model.number="asstForm.followupWindowDays">

            <input class="text-input num-input" type="number" min="1" max="30" v-model.number="asstForm.followupDailyMax">
            <span class="hint">个联系人（要调模型，不勾选则只用手动记录，零花费）</span>
          </div>

          </div>
          <div class="asst-row">
            <label class="check-row inline"><input type="checkbox" v-model="asstForm.weeklyPlanEnabled"> 启用每周维护计划</label>
            <span class="hint">每周一自动排行该联系谁并草拟开场白（要调模型），结果在本页看板展示，不发邮件</span>
          </div>

          </div>
          <div class="asst-row">

          </div>

          <h3 style="margin-top:18px">数据可携与遗忘</h3>
          <div class="asst-row">
            <label class="check-row inline"><input type="checkbox" v-model="exportRedact"> 脱敏导出（姓名→伪名、消息正文抹除，保留结构/计数/时间）</label>
            <span class="hint">导出为单个开放 JSON（含归档与派生缓存），纯本地、只读、零费用</span>

          <div class="asst-row">
            <input class="text-input grow" v-model.trim="asstForm.smtp.host" placeholder="SMTP 服务器，如 smtp.qq.com">

          </div>
          <div class="asst-row" style="margin-top:10px">
            <button class="btn primary sm" @click="saveAssistantSettings" :disabled="!!asstBusy">{{ asstBusy==='save' ? '保存中…' : '保存设置' }}</button>

          <p class="hint block">提示：QQ 邮箱需在「设置 → 账户」开启 SMTP 并生成授权码；163 邮箱同理。密码只保存在服务器数据库中。</p>
        </div>

          <h3>🗓 关系维护日历</h3>

              </tbody>

          </div>

      <!-- ============ v5.2.0 分析插件（提示词模板）管理 ============ -->
      <div class="card pmt-card">
        <div class="tl-head">
          <h3 style="margin:0">🧩 分析插件（提示词）</h3>
          <button class="btn ghost sm" @click="loadPrompts" :disabled="prompts.busy">{{ prompts.busy ? '加载中…' : '刷新' }}</button>
        </div>
        <p class="hint block">全部 13 个 LLM 提示词模板集中在此编辑。内置默认逐字内嵌，你保存的修改作为「自定义覆盖」存进数据库并<strong>运行时热加载</strong>（改完即生效、无需重启），每个模板都可一键<strong>恢复默认</strong>。变量一律用字面占位符（形如 <code>{{ pmtToken('变量名') }}</code>），保存时后端会校验必填变量是否齐备、拒绝未知占位符、限 8KB。编辑提示词等价于编辑本工具的模型指令，仅影响送给模型的文本，不改变代码路径与降级语义。</p>

        <div v-if="prompts.busy && !prompts.list.length" class="pmt-empty">正在加载提示词列表…</div>
        <div v-else-if="prompts.failed" class="pmt-empty">{{ prompts.error }}　<button class="btn ghost xs" @click="loadPrompts">重试</button></div>
        <div v-else-if="!prompts.list.length" class="pmt-empty">暂无提示词模板</div>

        <ul class="pmt-list" v-else>
          <li v-for="it in prompts.list" :key="it.key" class="pmt-item" :class="{open: prompts.openKey===it.key}">
            <div class="pmt-row" @click="openPrompt(it.key)">
              <span class="pmt-title">{{ it.title }}</span>
              <span class="pmt-feature">{{ it.feature }}</span>
              <span class="pmt-badge" :class="it.isCustom ? 'pmt-badge-custom' : 'pmt-badge-default'">{{ it.isCustom ? '已自定义' : '内置默认' }}</span>
              <span class="hint pmt-meta">{{ (it.vars || []).length }} 个变量<span v-if="it.updatedAt"> · {{ fmtTime(it.updatedAt).slice(0,16) }}</span></span>
              <span class="pmt-caret">{{ prompts.openKey===it.key ? '收起' : '编辑' }}</span>
            </div>

            <div class="pmt-editor" v-if="prompts.openKey===it.key">
              <div v-if="prompts.detailBusy" class="pmt-empty">加载模板详情…</div>
              <template v-else-if="prompts.detail && prompts.detail.key===it.key">
                <!-- 可用变量 chips -->
                <div class="pmt-vars">
                  <span class="pmt-vars-label">可用变量（点击插入到光标处）：</span>
                  <button type="button" class="pmt-var" v-for="v in (prompts.detail.vars || [])" :key="v" @click="insertPromptVar(v)">{{ pmtToken(v) }}</button>
                </div>

                <!-- 编辑区 -->
                <textarea ref="promptTA" class="pmt-textarea" rows="10" spellcheck="false" v-model="prompts.editContent"></textarea>
                <div class="pmt-tools">
                  <span class="hint">{{ byteLen(prompts.editContent) }} / {{ PROMPT_MAX_BYTES }} 字节</span>
                  <span class="pmt-ovr" v-if="byteLen(prompts.editContent) > PROMPT_MAX_BYTES">超过上限，无法保存</span>
                  <span class="pmt-dirty" v-else-if="prompts.detail.isCustom && prompts.editContent!==prompts.detail.override">有未保存修改</span>
                </div>

                <!-- 默认内容对照（只读） -->
                <details class="pmt-default">
                  <summary>查看内置默认（对照用，只读）</summary>
                  <pre class="pmt-pre">{{ prompts.detail.default }}</pre>
                </details>

                <div class="pmt-actions">
                  <button class="btn primary sm" @click="savePrompt" :disabled="prompts.saving || byteLen(prompts.editContent) > PROMPT_MAX_BYTES || byteLen(prompts.editContent)===0">{{ prompts.saving ? '保存中…' : '保存自定义' }}</button>
                  <button class="btn sm" @click="previewPrompt" :disabled="prompts.previewBusy">{{ prompts.previewBusy ? '渲染中…' : '预览' }}</button>
                  <button class="btn ghost sm" @click="resetPrompt" :disabled="prompts.resetting || !prompts.detail.isCustom">{{ prompts.resetting ? '恢复中…' : '恢复默认' }}</button>
                </div>

                <div class="pmt-preview" v-if="prompts.previewText">
                  <div class="pmt-preview-head">预览（用样本变量字面渲染，不调模型）</div>
                  <pre class="pmt-pre">{{ prompts.previewText }}</pre>
                </div>
              </template>
            </div>
          </li>
        </ul>
      </div>
    </section>

      <!-- ---- 年度关系报告 ---- -->
      <template v-if="insightTab==='report'">

                    <line v-for="e in netEdgeGeo" :key="e.key" class="net-edge"
