      <!-- ---- 自我关系画像（镜像层） ---- -->
      <template v-if="insightTab==='self'">
        <div class="card life-card">
          <div class="tl-head">
            <h2>自我画像</h2>
            <div class="lh-actions">
              <span class="hint" v-if="selfpt.generatedAt">更新于 {{ selfpt.generatedAt }}</span>
              <button class="btn sm" @click="recomputeInsights" :disabled="advBusy">{{ advBusy ? '计算中…' : '重新计算' }}</button>
            </div>
          </div>
          <p class="hint block">从全体关系里反照出你自己的社交模式——谁在主动先开口、精力往哪里迁移、有多少关系几乎一厢情愿。工具变镜子，零新增采数。</p>
          <p class="empty" v-if="advBusy && !selfpt.self">分析中…</p>
          <template v-if="selfpt.self">
            <div class="sp-tags" v-if="selfpt.self.styleTags && selfpt.self.styleTags.length">
              <span class="sp-tag" v-for="t in selfpt.self.styleTags" :key="t.key" :title="t.reason">{{ t.label }}</span>
            </div>
            <div class="life-metrics">
              <div class="life-metric"><span class="lm-num">{{ Math.round(selfpt.self.initiationRate) }}%</span><span class="lm-lbl">你先开口</span></div>
              <div class="life-metric"><span class="lm-num">{{ selfpt.self.activeContacts }}</span><span class="lm-lbl">近期往来人数</span></div>
              <div class="life-metric"><span class="lm-num down">{{ selfpt.self.oneWayCount }}</span><span class="lm-lbl">单向关系</span></div>
              <div class="life-metric"><span class="lm-num">{{ Math.round(selfpt.self.imbalanceAvg) }}%</span><span class="lm-lbl">平均失衡度</span></div>
            </div>
            <div class="trend-row" v-if="sparkPoints(trendSeries('initiationRate'), 140, 30)">
              <span class="hint">你先开口率近{{ trend.weeks.length }}周</span>
              <svg class="trend-spark" width="140" height="30" viewBox="0 0 140 30" preserveAspectRatio="none">
                <polyline fill="none" stroke="currentColor" stroke-width="1.5" :points="sparkPoints(trendSeries('initiationRate'), 140, 30)"/>
              </svg>
            </div>

            <h3 class="life-sub">你先开口的比例（按类别）</h3>
            <ul class="sp-bars">
              <li v-for="(v,k) in selfpt.self.categoryInitiation" :key="k">
                <span class="sp-cat">{{ k }}</span>
                <span class="sp-bar"><i :style="{width: v+'%'}"></i></span>
                <span class="hint">{{ Math.round(v) }}%</span>
              </li>
            </ul>

            <h3 class="life-sub" v-if="selfpt.self.migration && selfpt.self.migration.length">精力去向</h3>
            <ul class="life-insights" v-if="selfpt.self.migration && selfpt.self.migration.length">
              <li v-for="(s,i) in selfpt.self.migration" :key="i">{{ s }}</li>
            </ul>
            <ul class="life-insights" v-if="selfpt.self.insights && selfpt.self.insights.length">
              <li v-for="(s,i) in selfpt.self.insights" :key="i">{{ s }}</li>
            </ul>
          </template>
        </div>
      </template>

      <!-- ---- 证据化干预学习（因果层） ---- -->
      <template v-if="insightTab==='learning'">
        <div class="card life-card">
          <div class="tl-head">
            <h2>干预学习</h2>
            <div class="lh-actions">
              <span class="hint" v-if="learn.generatedAt">更新于 {{ learn.generatedAt }}</span>
              <button class="btn sm" @click="recomputeInsights" :disabled="advBusy">{{ advBusy ? '计算中…' : '重新计算' }}</button>
            </div>
          </div>
          <p class="hint block">用你自己的历史回测数据学“对哪类人做什么真有效”：建议被执行 14 天后自动回测互动变化，系统算出带置信区间的回暖率。样本不够时会诚实标注。</p>
          <p class="empty" v-if="advBusy && !learn.intervention">学习中…</p>
          <template v-if="learn.intervention">
            <p class="hint block" v-if="learn.intervention.dataNote">{{ learn.intervention.dataNote }}</p>
            <div class="life-metrics" v-if="learn.intervention.totalResolved>0">
              <div class="life-metric"><span class="lm-num">{{ learn.intervention.totalResolved }}</span><span class="lm-lbl">已回测样本</span></div>
              <div class="life-metric"><span class="lm-num">{{ Math.round(learn.intervention.baseRate) }}%</span><span class="lm-lbl">整体回暖率</span></div>
            </div>
            <div class="trend-row" v-if="sparkPoints(trendSeries('outcomeSample'), 140, 30)">
              <span class="hint">回测样本量近{{ trend.weeks.length }}周</span>
              <svg class="trend-spark" width="140" height="30" viewBox="0 0 140 30" preserveAspectRatio="none">
                <polyline fill="none" stroke="currentColor" stroke-width="1.5" :points="sparkPoints(trendSeries('outcomeSample'), 140, 30)"/>
              </svg>
            </div>
            <h3 class="life-sub" v-if="learn.intervention.byKind && learn.intervention.byKind.length">按干预方式的效果</h3>
            <ul class="iv-list" v-if="learn.intervention.byKind && learn.intervention.byKind.length">
              <li v-for="(a,i) in learn.intervention.byKind" :key="i" :class="{low: a.lowSample}">
                <span class="iv-kind">{{ a.kindLabel }}</span>
                <span class="iv-rate">{{ Math.round(a.successRate) }}%</span>
                <span class="hint">回暖 {{ a.improved }} / 共 {{ a.n }}（置信 {{ Math.round(a.wilsonLow) }}~{{ Math.round(a.wilsonHigh) }}%）</span>
                <span class="chip" v-if="a.lowSample">样本不足</span>
                <div class="hint" v-if="a.verdict">{{ a.verdict }}</div>
              </li>
            </ul>
            <h3 class="life-sub" v-if="learn.intervention.bestActions && learn.intervention.bestActions.length">被验证有效的动作</h3>
            <ul class="life-insights" v-if="learn.intervention.bestActions && learn.intervention.bestActions.length">
              <li v-for="(s,i) in learn.intervention.bestActions" :key="i">{{ s }}</li>
            </ul>
            <p class="empty" v-if="learn.intervention.totalResolved===0">还没有回测样本。当你在周计划里联系某人，系统 14 天后会自动回测，数据攒够这里就有结论。</p>
          </template>
        </div>
      </template>
    </section>

    <!-- ============ 服务器状态 ============ -->
    <section v-if="route.view==='status'">
      <div class="card status-head-card">
        <div>
          <h2 style="margin:0">服务器状态</h2>
          <p class="hint" style="margin:4px 0 0" v-if="sysStatus">每 5 秒自动刷新 · 服务器时间 {{ fmtTime(sysStatus.serverTime) }}</p>
        </div>
        <button class="btn sm" @click="loadStatus" :disabled="statusLoading">{{ statusLoading ? '刷新中…' : '立即刷新' }}</button>
      </div>

      <div v-if="!sysStatus && statusLoading" class="card">正在读取服务器状态…</div>
      <div v-if="!sysStatus && !statusLoading" class="card">状态读取失败，点击右上角「立即刷新」重试。</div>

      <div v-if="sysStatus" class="status-grid">
        <!-- 微信连接 -->
        <div class="card">
          <h3>微信连接</h3>
          <div class="stat-row">
            <span class="st-label">登录状态</span>
            <span :class="['chip', sysStatus.loggedIn && !sysStatus.sessionExpired ? 'st-ok' : 'st-bad']">
              {{ sysStatus.sessionExpired ? '会话已过期' : (sysStatus.loggedIn ? '已登录' : '未登录') }}
            </span>
          </div>
          <div class="stat-row"><span class="st-label">最后成功轮询</span><span class="st-val">{{ fmtAgo(sysStatus.poll.lastOkSecAgo) }}</span></div>
          <div class="stat-row"><span class="st-label">最近轮询报错</span><span class="st-val">{{ sysStatus.poll.lastErrSecAgo < 0 ? '无' : fmtAgo(sysStatus.poll.lastErrSecAgo) }}</span></div>
          <div v-if="sysStatus.poll.lastErrSecAgo >= 0 && sysStatus.poll.lastErrMsg" class="status-err">{{ sysStatus.poll.lastErrMsg }}</div>
        </div>

        <!-- 服务运行 -->
        <div class="card">
          <h3>服务运行</h3>
          <div class="stat-row"><span class="st-label">程序版本</span><span class="st-val">{{ sysStatus.version }}</span></div>
          <div class="stat-row"><span class="st-label">主机名</span><span class="st-val">{{ sysStatus.sys.hostname || '—' }}</span></div>
          <div class="stat-row"><span class="st-label">操作系统</span><span class="st-val">{{ sysStatus.sys.os }} / {{ sysStatus.sys.arch }}</span></div>
          <div class="stat-row"><span class="st-label">已连续运行</span><span class="st-val">{{ fmtUptime(sysStatus.sys.uptimeSec) }}</span></div>
          <div class="stat-row">
            <span class="st-label">识别到的你的 IP</span>
            <span class="st-val">{{ sysStatus.clientIp || '—' }}</span>
          </div>
          <div class="stat-row">
            <span class="st-label">访问限制</span>
            <span class="st-val">
              <span class="chip" :class="sysStatus.whitelistEnabled ? 'st-ok' : 'st-gray'">{{ sysStatus.whitelistEnabled ? '白名单已启用' : '白名单未启用' }}</span>
              <span class="chip" :class="sysStatus.trustedProxy ? 'st-purple' : 'st-gray'">{{ sysStatus.trustedProxy ? '反代可信' : '直连模式' }}</span>
            </span>
          </div>
        </div>

        <!-- 服务器资源 -->
        <div class="card status-wide">
          <h3>服务器资源</h3>

          <div class="meter-block">
            <div class="meter-head"><span>CPU 占用（本程序进程）</span>
              <span class="meter-val">{{ sysStatus.sys.processCpuPercent }}% · {{ sysStatus.sys.numCpu }} 核</span></div>
            <div class="meter"><div :class="['meter-bar', pctClass(sysStatus.sys.processCpuPercent)]" :style="{width: sysStatus.sys.processCpuPercent + '%'}"></div></div>
          </div>

          <div class="meter-block">
            <div class="meter-head"><span>系统内存</span>
              <span class="meter-val">{{ fmtMB(sysStatus.sys.memTotalMb - sysStatus.sys.memAvailableMb) }} / {{ fmtMB(sysStatus.sys.memTotalMb) }} · {{ sysStatus.sys.memUsedPercent }}%</span></div>
            <div class="meter"><div :class="['meter-bar', pctClass(sysStatus.sys.memUsedPercent)]" :style="{width: sysStatus.sys.memUsedPercent + '%'}"></div></div>
          </div>

          <div class="meter-block">
            <div class="meter-head"><span>数据盘（{{ sysStatus.sys.diskPath }}）</span>
              <span class="meter-val">已用 {{ fmtMB(sysStatus.sys.diskTotalMb - sysStatus.sys.diskFreeMb) }} / {{ fmtMB(sysStatus.sys.diskTotalMb) }} · {{ sysStatus.sys.diskUsedPercent }}%</span></div>
            <div class="meter"><div :class="['meter-bar', pctClass(sysStatus.sys.diskUsedPercent)]" :style="{width: sysStatus.sys.diskUsedPercent + '%'}"></div></div>
          </div>

          <div class="stat-row"><span class="st-label">系统负载 1/5/15 分钟</span>
            <span class="st-val">
              <template v-if="sysStatus.sys.load1 >= 0">{{ sysStatus.sys.load1 }} / {{ sysStatus.sys.load5 }} / {{ sysStatus.sys.load15 }}</template>
              <template v-else>—（Windows 不提供）</template>
            </span></div>
        </div>

        <!-- 程序占用 -->
        <div class="card">
          <h3>程序占用</h3>
          <div class="stat-row"><span class="st-label">常驻内存（RSS）</span><span class="st-val">{{ fmtMB(sysStatus.sys.processRssMb) }}</span></div>
          <div class="stat-row"><span class="st-label">Go 堆在用</span><span class="st-val">{{ fmtMB(sysStatus.sys.goHeapAllocMb) }}</span></div>
          <div class="stat-row"><span class="st-label">协程数</span><span class="st-val">{{ sysStatus.sys.goroutines }}</span></div>
        </div>

        <!-- 数据 -->
        <div class="card">
          <h3>数据</h3>
          <div class="stat-row"><span class="st-label">联系人</span><span class="st-val">{{ sysStatus.contacts }} 人</span></div>
          <div class="stat-row"><span class="st-label">消息总数</span><span class="st-val">{{ sysStatus.messages }} 条</span></div>
        </div>

        <!-- v6.2 模型与代理 -->
        <div class="card">
          <h3>模型与代理</h3>
          <div class="stat-row"><span class="st-label">活动模型</span><span class="st-val">
            <span class="chip" :class="sysStatus.llm && sysStatus.llm.configured ? 'st-ok' : 'st-gray'">
              {{ sysStatus.llm && sysStatus.llm.configured ? '已配置' : '未配置' }}
            </span>
            <template v-if="sysStatus.llm && sysStatus.llm.active"> {{ sysStatus.llm.active.label }} · {{ sysStatus.llm.active.model }}</template>
          </span></div>
          <div v-if="sysStatus.llm && sysStatus.llm.active" class="stat-row"><span class="st-label">区域 / 推理</span><span class="st-val">{{ sysStatus.llm.active.region==='foreign' ? '国外' : '国内' }} · {{ sysStatus.llm.active.disableThinking ? '已关闭' : '开启' }}</span></div>
          <div v-if="sysStatus.llm" class="stat-row"><span class="st-label">代理</span><span class="st-val">
            <span class="chip" :class="sysStatus.llm.proxy && sysStatus.llm.proxy.enabled ? 'st-purple' : 'st-gray'">{{ sysStatus.llm.proxy && sysStatus.llm.proxy.enabled ? '已启用' : '未启用' }}</span>
            <template v-if="sysStatus.llm.proxy && sysStatus.llm.proxy.egressIp"> 出口 {{ sysStatus.llm.proxy.egressIp }}</template>
          </span></div>
          <div v-if="sysStatus.llm && sysStatus.llm.usage" class="stat-row"><span class="st-label">今日调用</span><span class="st-val">{{ sysStatus.llm.usage.today.calls }} 次 · {{ sysStatus.llm.usage.today.totalTokens }} tokens</span></div>
          <div class="stat-row"><span class="st-label"></span><a class="btn sm" href="#/model">前往配置</a></div>
        </div>
      </div>

      <!-- v5.4.0 #9 数据健康自检（只读 SQL 聚合，按需手动刷新） -->
      <div class="card dr-card">
        <div class="tl-head">
          <h2>数据健康自检</h2>
          <div class="lh-actions">
            <span class="hint" v-if="dataReport.data">更新于 {{ (dataReport.data.generatedAt || '').slice(0,16).replace('T',' ') }}</span>
            <button class="btn sm" @click="loadDataReport" :disabled="dataReport.busy">{{ dataReport.busy ? '自检中…' : (dataReport.data ? '重新自检' : '开始自检') }}</button>
          </div>
        </div>
        <p class="hint block">本地盘点数据库体积、消息增速、画像/标签/时间线覆盖率与各派生缓存表行数，一眼看清数据健康度。纯本地只读，不花模型费用。</p>
        <p class="empty" v-if="dataReport.busy && !dataReport.data">正在盘点本地数据…</p>
        <p class="empty" v-else-if="dataReport.failed && !dataReport.data">{{ dataReport.error }}</p>
        <template v-else-if="dataReport.data">
          <div class="dr-metrics">
            <div class="dr-metric"><span class="dr-num">{{ dataReport.data.contactsTotal }}</span><span class="dr-lbl">联系人</span></div>
            <div class="dr-metric"><span class="dr-num">{{ dataReport.data.messagesTotal }}</span><span class="dr-lbl">消息总数</span></div>
            <div class="dr-metric"><span class="dr-num">{{ dataReport.data.messagesLast30d }}</span><span class="dr-lbl">近 30 天新增</span></div>
            <div class="dr-metric"><span class="dr-num">{{ fmtBytes(dataReport.data.dbSizeBytes) }}</span><span class="dr-lbl">数据库体积</span></div>
          </div>
          <div class="dr-rows">
            <div class="dr-row"><span class="dr-k">画像覆盖率</span><span class="dr-v"><span class="dr-bar"><i :style="{width: dataReport.data.profileCoverage + '%'}"></i></span>{{ dataReport.data.profiledContacts }}/{{ dataReport.data.contactsTotal }}（{{ Math.round(dataReport.data.profileCoverage) }}%）</span></div>
            <div class="dr-row"><span class="dr-k">标签联系人</span><span class="dr-v">{{ dataReport.data.taggedContacts }} 人</span></div>
            <div class="dr-row"><span class="dr-k">时间线事件</span><span class="dr-v">{{ dataReport.data.timelineEvents }} 条</span></div>
            <div class="dr-row"><span class="dr-k">消息日均增速</span><span class="dr-v">{{ dataReport.data.messagesGrowthPerDay }} 条/天</span></div>
            <div class="dr-row"><span class="dr-k">最近成功备份</span><span class="dr-v"><span class="chip" :class="dataReport.data.lastBackupOk ? 'st-ok' : 'st-warn'">{{ dataReport.data.lastBackupOk ? '正常' : '无/失败' }}</span>{{ dataReport.data.lastBackupAt || '从未备份' }}</span></div>
          </div>
          <h3 class="life-sub">派生缓存表</h3>
          <div class="dr-cache">
            <span class="chip dr-cache-item" :class="ct.present ? 'st-blue' : 'st-gray'" v-for="ct in dataReport.data.cacheTables" :key="ct.table">{{ ct.table }} · {{ ct.rows }}</span>
          </div>
        </template>
      </div>
    </section>

    <!-- ============ v6.2 模型与代理 ============ -->
    <section v-if="route.view==='model'">
      <div class="card status-head-card">
        <div>
          <h2 style="margin:0">模型与代理</h2>
          <p class="hint" style="margin:4px 0 0">切换对话模型、适配国内外预设、开关推理模式、添加自定义模型；代理仅作于模型调用，其他功能仍走本地直连。</p>
        </div>
        <button class="btn sm" @click="loadModelPage" :disabled="mp.loading">{{ mp.loading ? '刷新中…' : '重新加载' }}</button>
      </div>

      <div v-if="mp.error" class="card">加载失败：{{ mp.error }}</div>

      <template v-if="mp.settings">
        <!-- 模型档案列表 -->
        <div class="card">
          <div class="tl-head">
            <h2>模型档案</h2>
            <div class="lh-actions"><button class="btn sm primary" @click="openNewForm">＋ 新建自定义模型</button></div>
          </div>
          <p class="empty" v-if="!mp.settings.profiles || !mp.settings.profiles.length">尚无模型档案，可从下方预设一键添加，或新建自定义模型。</p>
          <div class="mp-profile" v-for="p in mp.settings.profiles" :key="p.id"
               :class="{active: p.id===mp.settings.activeProfileId}">
            <div class="mp-pf-main">
              <div class="mp-pf-title">
                <span class="mp-pf-label">{{ p.label || p.model }}</span>
                <span class="chip" :class="p.id===mp.settings.activeProfileId ? 'st-ok' : 'st-gray'">{{ p.id===mp.settings.activeProfileId ? '使用中' : '备用' }}</span>
                <span class="chip" :class="p.region==='foreign' ? 'st-purple' : 'st-blue'">{{ regionLabel(p.region) }}</span>
                <span class="chip" :class="p.disableThinking ? 'st-gray' : 'st-blue'">{{ p.disableThinking ? '推理已关' : '推理开启' }}</span>
                <span class="chip" :class="p.useProxy ? 'st-purple' : 'st-gray'">{{ p.useProxy ? '走代理' : '直连' }}</span>
              </div>
              <div class="mp-pf-meta">模型 {{ p.model }} · 厂商 {{ p.provider }} · 接口 {{ p.baseURL }}</div>
            </div>
            <div class="mp-pf-acts">
              <button class="btn sm" v-if="p.id!==mp.settings.activeProfileId" @click="activateProfile(p.id)" :disabled="mp.busy">设为活动</button>
              <button class="btn sm" @click="openEditForm(p)">编辑</button>
              <button class="btn sm danger" @click="deleteProfile(p.id)" :disabled="mp.busy">删除</button>
            </div>
          </div>
        </div>

        <!-- 预设目录 -->
        <div class="card">
          <h2>从预设快速添加</h2>
          <h3 class="life-sub">国内模型（无需代理）</h3>
          <div class="mp-preset-row">
            <button class="btn sm" v-for="p in mp.domestic" :key="p.key" @click="openPresetForm(p)">{{ p.label }}</button>
          </div>
          <h3 class="life-sub">国外模型（建议配合代理）</h3>
          <div class="mp-preset-row">
            <button class="btn sm" v-for="p in mp.foreign" :key="p.key" @click="openPresetForm(p)">{{ p.label }}</button>
          </div>
          <p class="hint block">选择预设会自动填好接口地址与常用模型，你只需补上 API Key。</p>
        </div>

        <!-- 代理与连通性 -->
        <div class="card">
          <h2>网络代理</h2>
          <p class="hint block">用于访问国外模型。代理只作用于模型 API 调用；微信同步、邮件等其他功能仍走本地直连。</p>
          <label class="mp-check"><input type="checkbox" v-model="mp.proxyForm.enabled"> 启用代理（仅模型调用）</label>
          <div class="field"><label>代理地址</label>
            <input type="text" v-model="mp.proxyForm.url" placeholder="http://127.0.0.1:7890 或 socks5://127.0.0.1:1080"></div>
          <div class="field"><label>不走代理（逗号分隔，可选）</label>
            <input type="text" v-model="mp.proxyForm.noProxy" placeholder="example.com,10.0.0.0/8"></div>
          <div class="mp-preset-row">
            <button class="btn sm" @click="saveProxy" :disabled="mp.proxySaving">{{ mp.proxySaving ? '保存中…' : '保存代理设置' }}</button>
            <button class="btn sm primary" @click="testProxy" :disabled="mp.proxyTesting">{{ mp.proxyTesting ? '测试中…' : '测试连通性' }}</button>
            <button class="btn sm" @click="testModel" :disabled="mp.modelTesting">{{ mp.modelTesting ? '调用中…' : '测试活动模型' }}</button>
            <button class="btn sm" @click="runCapabilityEval" :disabled="mp.capTesting">{{ mp.capTesting ? '测试中（约 1 分钟）…' : '验证模型能力' }}</button>
          </div>

          <div v-if="mp.settings.proxy && mp.settings.proxy.testedAt" class="mp-test-result">
            <div class="stat-row"><span class="st-label">上次测试</span><span class="st-val">{{ fmtTime(mp.settings.proxy.testedAt) }}</span></div>
            <div class="stat-row"><span class="st-label">直连出口 IP</span><span class="st-val">{{ mp.settings.proxy.directIp || '未获取' }}</span></div>
            <div class="stat-row"><span class="st-label">代理出口 IP</span><span class="st-val">{{ mp.settings.proxy.egressIp || '未获取' }}</span></div>
            <div v-if="mp.settings.proxy.sites && mp.settings.proxy.sites.length" class="mp-sites">
              <div class="mp-site" v-for="s in mp.settings.proxy.sites" :key="s.url">
                <span class="chip" :class="s.ok ? 'st-ok' : 'st-bad'">{{ s.ok ? '可达' : '不可达' }}</span>
                <span class="mp-site-url">{{ s.url }}</span>
                <span class="mp-site-lat" v-if="s.ok">{{ s.latencyMs }} ms</span>
                <span class="mp-site-err" v-if="s.error">{{ s.error }}</span>
              </div>
            </div>
          </div>

          <div v-if="mp.modelTestResult" class="mp-test-result">
            <span class="chip" :class="mp.modelTestResult.ok ? 'st-ok' : 'st-bad'">{{ mp.modelTestResult.ok ? '模型可达' : '模型不可达' }}</span>
            <span v-if="mp.modelTestResult.latencyMs!=null" class="mp-site-lat">{{ mp.modelTestResult.latencyMs }} ms</span>
            <span class="mp-site-err" v-if="mp.modelTestResult.error">{{ mp.modelTestResult.error }}</span>
          </div>

          <div v-if="mp.capResult" class="mp-test-result">
            <div v-if="!mp.capResult.ok" class="mp-site-err">{{ mp.capResult.error || '未配置可用模型' }}</div>
            <template v-else>
              <div class="stat-row"><span class="st-label">被测模型</span><span class="st-val">{{ mp.capResult.model || '—' }}</span></div>
              <div class="stat-row"><span class="st-label">结论</span><span class="st-val">{{ mp.capResult.verdict }}</span></div>
              <div class="dr-metrics">
                <div class="dr-metric"><span class="dr-num">{{ mp.capResult.passed }}/{{ mp.capResult.ran }}</span><span class="dr-lbl">通过</span></div>
                <div class="dr-metric"><span class="dr-num">{{ (mp.capResult.accuracy*100).toFixed(0) }}%</span><span class="dr-lbl">准确率</span></div>
                <div class="dr-metric"><span class="dr-num">{{ (mp.capResult.jsonValidity*100).toFixed(0) }}%</span><span class="dr-lbl">JSON合法</span></div>
                <div class="dr-metric"><span class="dr-num">{{ (mp.capResult.hallucination*100).toFixed(0) }}%</span><span class="dr-lbl">幻觉</span></div>
              </div>
              <div class="mp-sites">
                <div class="mp-site" v-for="c in mp.capResult.cases" :key="c.id">
                  <span class="chip" :class="c.pass ? 'st-ok' : 'st-bad'">{{ c.pass ? '通过' : '未过' }}</span>
                  <span class="mp-site-url">{{ c.id }}</span>
                  <span class="mp-site-err" v-if="c.error">{{ c.error }}</span>
                  <span class="mp-site-err" v-else-if="!c.pass && c.missed && c.missed.length">缺: {{ c.missed.join(' / ') }}</span>
                  <span class="mp-site-err" v-else-if="!c.pass && c.hitForbidden && c.hitForbidden.length">疑幻觉: {{ c.hitForbidden.join(' / ') }}</span>
                </div>
              </div>
              <div v-if="mp.capResult.skippedRateLimit || mp.capResult.errored" class="mp-site-err">{{ mp.capResult.skippedRateLimit }} 个限流、{{ mp.capResult.errored }} 个超时/出错未完成（结论仅基于已完成的 {{ mp.capResult.ran }} 条）</div>
            </template>
          </div>
        </div>

        <!-- 调用量统计 -->
        <div class="card" v-if="mp.usage">
          <h2>模型调用量</h2>
          <div class="dr-metrics">
            <div class="dr-metric"><span class="dr-num">{{ mp.usage.today.calls }}</span><span class="dr-lbl">今日调用</span></div>
            <div class="dr-metric"><span class="dr-num">{{ mp.usage.today.totalTokens }}</span><span class="dr-lbl">今日 tokens</span></div>
            <div class="dr-metric"><span class="dr-num">{{ mp.usage.week.calls }}</span><span class="dr-lbl">近 7 天调用</span></div>
            <div class="dr-metric"><span class="dr-num">{{ mp.usage.month.calls }}</span><span class="dr-lbl">近 30 天调用</span></div>
          </div>
          <div class="dr-rows">
            <div class="dr-row"><span class="dr-k">今日成功/失败</span><span class="dr-v">{{ mp.usage.today.success }} / {{ mp.usage.today.errors }}</span></div>
            <div class="dr-row"><span class="dr-k">今日平均延迟</span><span class="dr-v">{{ mp.usage.today.avgLatencyMs }} ms</span></div>
            <div class="dr-row"><span class="dr-k">近 30 天总 tokens</span><span class="dr-v">{{ mp.usage.month.totalTokens }}</span></div>
            <div class="dr-row"><span class="dr-k">经代理调用（近 30 天）</span><span class="dr-v">{{ mp.usage.month.proxyCalls }}</span></div>
          </div>
          <!-- 日预算护栏（v6.3 P2c）：只拦后台批量派生，不拦用户当场发起的调用 -->
          <h3 class="life-sub">日预算</h3>
          <div class="dr-rows">
            <div class="dr-row"><span class="dr-k">今日已用 / 上限</span>
              <span class="dr-v" v-if="!mp.budget || mp.budget.unlimited">{{ mp.usage.today.totalTokens }} / 不限制</span>
              <span class="dr-v" v-else>{{ mp.budget.usedToday }} / {{ mp.budget.limit }}<span v-if="mp.budget.over" class="tag tag-red">已用尽</span></span>
            </div>
            <div class="dr-row" v-if="mp.budget && !mp.budget.unlimited && !mp.budget.over">
              <span class="dr-k">剩余</span><span class="dr-v">{{ mp.budget.remaining }} tokens</span>
            </div>
          </div>
          <div class="field"><label>每日 token 上限（0 = 不限制）</label>
            <input type="number" min="0" step="1000" v-model="mp.budgetForm.limit" placeholder="留空或 0 表示不限制"></div>
          <div class="mp-preset-row">
            <button class="btn sm" @click="saveBudget" :disabled="mp.budgetSaving">{{ mp.budgetSaving ? '保存中…' : '保存预算' }}</button>
          </div>
          <p class="hint block">预算只止后台自动派生（情绪分析 / 待跟进抽取 / 周开场白等）；你手动点击的功能不受预算影响，已被跳过的后台任务次日会自动重试。</p>
          <template v-if="mp.usage.byModel && mp.usage.byModel.length">
            <h3 class="life-sub">按模型</h3>
            <table class="mp-usage-table">
              <thead><tr><th>模型</th><th>调用</th><th>成功</th><th>tokens</th><th>均延(ms)</th></tr></thead>
              <tbody>
                <tr v-for="m in mp.usage.byModel" :key="m.model">
                  <td>{{ m.label || m.model }}</td><td>{{ m.calls }}</td><td>{{ m.success }}</td><td>{{ m.totalTokens }}</td><td>{{ m.avgLatencyMs }}</td>
                </tr>
              </tbody>
            </table>
          </template>
          <!-- 按任务：V6.3 §5.4 / P2 任务级成本归因（含未接管调用，以免隐藏成本） -->
          <template v-if="mp.usage.byTask && mp.usage.byTask.length">
            <h3 class="life-sub">按任务</h3>
            <table class="mp-usage-table">
              <thead><tr><th>任务</th><th>调用</th><th>成功</th><th>tokens</th><th>均延(ms)</th></tr></thead>
              <tbody>
                <tr v-for="t in mp.usage.byTask" :key="t.task">
                  <td>{{ t.label || t.task }}<span v-if="!t.registered" class="tag tag-gray">未登记</span></td>
                  <td>{{ t.calls }}</td><td>{{ t.success }}</td><td>{{ t.totalTokens }}</td><td>{{ t.avgLatencyMs }}</td>
                </tr>
              </tbody>
            </table>
          </template>
          <p class="hint block">口径：仅统计真实发起的 API 调用（缓存命中不计），故反映实际模型消费。</p>
        </div>
      </template>

      <!-- 新建/编辑模型档案弹框 -->
      <div class="mask" v-if="mp.editing">
        <form class="card modal" style="max-width:520px" @submit.prevent="saveProfile">
          <h2>{{ mp.formIsNew ? '新建模型档案' : '编辑模型档案' }}</h2>
          <div class="field"><label>显示名称</label><input type="text" v-model="mp.editing.label" placeholder="如：DeepSeek 对话"></div>
          <div class="field"><label>厂商标识</label><input type="text" v-model="mp.editing.provider" placeholder="deepseek / openai / custom…"></div>
          <div class="field"><label>接口地址（OpenAI 兼容，不带末尾斜杠）</label><input type="text" v-model="mp.editing.baseURL" placeholder="https://api.deepseek.com"></div>
          <div class="field"><label>API Key<span v-if="!mp.formNeedsKey" class="hint">（本地模型可留空）</span></label>
            <input type="text" v-model="mp.editing.apiKey" :placeholder="mp.formIsNew ? 'sk-…' : '******（不修改则保留）'"></div>
          <div class="field"><label>模型名</label>
            <input type="text" v-model="mp.editing.model" list="mp-model-list" placeholder="deepseek-chat">
            <datalist id="mp-model-list"><option v-for="mo in (mp.presetModels||[])" :key="mo" :value="mo"></option></datalist>
          </div>
          <div class="field"><label>区域</label>
            <select v-model="mp.editing.region"><option value="domestic">国内</option><option value="foreign">国外</option></select></div>
          <label class="mp-check"><input type="checkbox" v-model="mp.editing.disableThinking"> 关闭推理/思考模式</label>
          <label class="mp-check"><input type="checkbox" v-model="mp.editing.useProxy"> 本模型经代理访问（国外建议勾选）</label>
          <div class="field"><label>自定义请求参数（JSON 对象，选填）</label>
            <textarea rows="3" v-model="mp.editing.extraBody" placeholder='{"thinking":{"type":"low"}}'></textarea>
            <span class="hint">逐键合并进每次请求（可覆盖内置默认）。用于适配不同厂商的思考/推理参数命名，如 <code>{"thinking":{"type":"low"}}</code>、<code>{"enable_thinking":false}</code>、<code>{"reasoning_effort":"low"}</code>、<code>{"temperature":0.3}</code>。留空=不额外发送。</span>
          </div>
          <p class="mp-form-err" v-if="mp.formError">{{ mp.formError }}</p>
          <div class="modal-actions">
            <button type="button" class="btn" @click="closeForm" :disabled="mp.busy">取消</button>
            <button type="submit" class="btn primary" :disabled="mp.busy">{{ mp.busy ? '保存中…' : '保存' }}</button>
          </div>
        </form>
      </div>
    </section>

  </main>

  <div class="mask" v-if="profileEditor">
    <form class="card modal pe-modal" style="max-height:90vh;overflow-y:auto" @submit.prevent="saveProfileEdit">
      <h2>编辑当前画像</h2>
      <p class="hint">分节与画像页完全一致；清空字段或列表项即可删除，再次 AI 生成可能重新提取。</p>
      <fieldset :disabled="profileSaving" style="border:0;padding:0">
        <div class="pe-sec" v-for="sec in profileSchema" :key="sec.title">
          <h3 class="pe-sec-title">{{ sec.title }}</h3>
          <template v-for="f in sec.fields" :key="f.path">
            <!-- 典型意图：名称 + 表现逐行编辑，与查看时「- 名称：表现」对应 -->
            <div v-if="f.kind === 'map'">
              <div class="pe-intent-row" v-for="(row, i) in profileEditor.intents" :key="row._uid">
                <input class="text-input pe-intent-name" v-model="row.name" aria-label="意图名称" placeholder="意图名称">
                <input class="text-input" v-model="row.description" aria-label="典型表现" placeholder="典型表现（可留空）">
                <button type="button" class="btn sm" @click="profileEditor.intents.splice(i, 1)">删除</button>
              </div>
              <button type="button" class="btn sm" @click="addIntentRow">添加意图</button>
            </div>
            <label v-else style="display:block;margin:8px 0">
              <span class="pe-label">
                <template v-if="f.label">{{ f.label }}</template>
                <template v-else>{{ sec.title }}</template>
                <em class="pe-hint" v-if="f.kind === 'list'">每行一项</em>
                <em class="pe-hint" v-else-if="f.hint">{{ f.hint }}</em>
              </span>
              <textarea class="text-input" :rows="f.kind === 'list' ? 3 : 2" v-model="profileEditor.values[f.path]"></textarea>
            </label>
          </template>
        </div>
      </fieldset>
      <p role="alert" v-if="profileEditError">{{ profileEditError }}</p>
      <div class="modal-actions">
        <button type="button" class="btn" :disabled="profileSaving" @click="profileEditor = null">取消</button>
        <button type="submit" class="btn primary" :disabled="profileSaving">{{ profileSaving ? '保存中…' : '保存' }}</button>
      </div>
    </form>
  </div>

  <!-- ============ 弹层：改备注 ============ -->
  <div class="mask" v-if="showRemark" @click.self="showRemark = false">
    <form class="card modal" @submit.prevent="doSetRemark">
      <h2>修改备注</h2>
      <input class="text-input" type="text" v-model="remarkInput" placeholder="留空表示清除备注">
      <div class="modal-actions">
        <button class="btn" type="button" @click="showRemark = false">取消</button>
        <button class="btn primary" type="submit" :disabled="busy">保存</button>
      </div>
    </form>
  </div>

  <!-- ============ 弹层：补充画像 ============ -->
  <div class="mask" v-if="showSupplement" @click.self="showSupplement = false">
    <form class="card modal" @submit.prevent="doSupplement">
      <h2>补充画像信息</h2>
      <textarea class="text-input ta" v-model="supplementNote" rows="5" placeholder="如：生日是 5 月 20 日、做后端开发、对猫毛过敏…"></textarea>
      <p class="hint">手动补充的信息优先级最高，会直接合并进画像（调用大模型，可能要等一两分钟）</p>
      <div class="modal-actions">
        <button class="btn" type="button" @click="showSupplement = false">取消</button>
        <button class="btn primary" type="submit" :disabled="busy || !supplementNote.trim()">{{ busy ? '处理中…' : '提交' }}</button>
      </div>
    </form>
  </div>

  <!-- ============ 弹层：关联昵称（合并） ============ -->
  <div class="mask" v-if="showMerge" @click.self="showMerge = false">
    <form class="card modal" @submit.prevent="doMerge">
      <h2>关联昵称（合并联系人）</h2>
      <p class="hint block">把选中的联系人并入「{{ contact ? displayName(contact) : '' }}」，其消息、别名、画像历史都会转移过去</p>
      <select class="text-input" v-model.number="mergeSourceId">
        <option :value="0" disabled>选择要并入的联系人</option>
        <option v-for="c in mergeCandidates" :key="c.id" :value="c.id">{{ displayName(c) }}</option>
      </select>
      <label class="check-row"><input type="checkbox" v-model="mergeUseSourceName"> 显示名改用对方昵称</label>
      <label class="check-row"><input type="checkbox" v-model="mergeRegenerate"> 合并后重新生成画像</label>
      <div class="modal-actions">
        <button class="btn" type="button" @click="showMerge = false">取消</button>
        <button class="btn primary" type="submit" :disabled="busy || !mergeSourceId">{{ busy ? '处理中…' : '合并' }}</button>
      </div>
    </form>
  </div>

  <!-- ============ 弹层：删除二次确认 ============ -->
  <div class="mask" v-if="showDelete" @click.self="showDelete = false">
    <div class="card modal">
      <h2>删除联系人</h2>
      <p>确定删除联系人「{{ contact ? displayName(contact) : '' }}」吗？<br>
      该联系人的消息、画像、画像历史、别名、合并记录都会被删除，<b>不可恢复</b>。</p>
      <div class="modal-actions">
        <button class="btn" @click="showDelete = false">取消</button>
        <button class="btn danger solid" @click="confirmDelete" :disabled="busy">{{ busy ? '删除中…' : '确认删除' }}</button>
      </div>
    </div>
  </div>

  <!-- ============ 弹层：重新认识 TA（Memory Replay，确定性关系回放） ============ -->
  <div class="mask" v-if="showReplay" @click.self="closeReplay()">
    <div class="card modal replay-modal">
      <h2>重新认识 TA</h2>
      <pre class="replay-body">{{ replayText }}</pre>
      <div class="modal-actions">
        <button class="btn" @click="closeReplay()">关闭</button>
      </div>
    </div>
  </div>

  <!-- ============ 弹层：标签管理 ============ -->
  <div class="mask" v-if="showTagMgr" @click.self="showTagMgr = false">
    <div class="card modal">
      <h2>管理标签</h2>
      <form class="search-row" @submit.prevent="createTag">
        <input class="text-input grow" v-model.trim="tagNewName" maxlength="20"
               placeholder="新标签名，如：家人 / 客户 / 老同学" @keyup.enter="createTag">
        <button class="btn primary" type="submit" :disabled="tagBusy || !tagNewName">新建</button>
      </form>
      <p class="empty" v-if="!tags.length">还没有标签，先建一个</p>
      <ul class="tag-mgr-list" v-else>
        <li v-for="t in tags" :key="t.id">
          <template v-if="tagEditId === t.id">
            <input class="text-input grow" v-model.trim="tagEditName" maxlength="20" @keyup.enter="commitTagRename">
            <button class="btn sm primary" type="button" @click="commitTagRename" :disabled="tagBusy || !tagEditName">保存</button>
            <button class="btn sm" type="button" @click="cancelTagRename">取消</button>
          </template>
          <template v-else>
            <span class="tm-name">{{ t.name }}</span>
            <span class="hint">{{ t.count || 0 }} 位联系人</span>
            <span class="tm-acts">
              <button class="btn ghost xs" type="button" @click="startTagRename(t)">改名</button>
              <button class="btn ghost xs danger" type="button" @click="deleteTag(t)" :disabled="tagBusy">删除</button>
            </span>
          </template>
        </li>
      </ul>
      <div class="sug-panel">
        <div class="sug-head">
          <h3>智能分组建议 <span class="chip st-purple">确定性规则·零模型</span></h3>
          <span class="sug-head-acts">
            <button class="btn ghost sm" type="button" @click="loadTagSuggestions" :disabled="suggest.busy">{{ suggest.busy ? '生成中…' : (suggest.loaded ? '刷新' : '生成建议') }}</button>
            <button class="btn sm primary" type="button" @click="acceptAllSuggestions" :disabled="suggest.busy || !suggest.items.filter(s => s._picked && !s._done).length">全部采纳</button>
          </span>
        </div>
        <p class="hint block">基于画像（地域/职业/兴趣）+ 亲密度分层 + 情绪告警 + 待跟进，确定性规则自动打标签建议。已挂同名标签自动去重、每联系人限 4 条。只读不写库，需你确认采纳。</p>
        <p class="empty" v-if="suggest.failed && !suggest.items.length">{{ suggest.error }}</p>
        <p class="empty" v-else-if="suggest.loaded && !suggest.items.length">暂无可采纳的建议（可能画像未生成、也无情绪告警/待跟进）</p>
        <table class="sug-table" v-if="suggest.items.length">
          <thead><tr>
            <th class="sug-col-pick">选</th>
            <th>联系人</th><th>建议标签</th><th class="sug-col-conf">置信度</th><th>理由</th><th class="sug-col-act">操作</th>
          </tr></thead>
          <tbody>
            <tr v-for="(s, i) in suggest.items" :key="i" :class="{done: s._done}">
              <td><input type="checkbox" v-model="s._picked" :disabled="s._done"></td>
              <td class="sug-name">{{ s.name }}</td>
              <td><span class="sug-tag">{{ s.tagName }}</span></td>
              <td class="sug-conf"><span class="sug-bar"><i :style="{width: s.confidence + '%'}"></i></span><span class="sug-conf-n">{{ s.confidence }}</span></td>
              <td class="sug-reason">{{ s.reason }}</td>
              <td>
                <button class="btn ghost xs" type="button" @click="acceptSuggestion(s)" :disabled="s._done || s._busy">{{ s._done ? '已采纳' : (s._busy ? '处理中…' : '采纳') }}</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="conflict-panel">
        <div class="sug-head">
          <h3>标签冲突检测 <span class="chip st-purple">确定性互斥组·零模型</span></h3>
          <span class="sug-head-acts">
            <button class="btn ghost sm" type="button" @click="loadTagConflicts" :disabled="conflicts.busy">{{ conflicts.busy ? '检测中…' : (conflicts.loaded ? '重新检测' : '开始检测') }}</button>
          </span>
        </div>
        <p class="hint block">同一联系人身上同时命中互斥标签（如“核心/密友”与“弱联系/点头之交”）时报出，帮你保持标签体系自洽。只读不写库。</p>
        <p class="empty" v-if="conflicts.failed && !conflicts.items.length">{{ conflicts.error }}</p>
        <p class="empty" v-else-if="conflicts.loaded && !conflicts.items.length">{{ conflicts.note || '标签体系自洽，未发现矛盾分组。' }}</p>
        <ul class="cf-list" v-else-if="conflicts.items.length">
          <li class="cf-item" v-for="(c, i) in conflicts.items" :key="i">
            <span class="cf-name" @click="gotoDetail(c.contactId)">{{ c.name }}</span>
            <span class="chip st-warn cf-tag">{{ c.tagA }}</span>
            <span class="cf-vs">×</span>
            <span class="chip st-warn cf-tag">{{ c.tagB }}</span>
            <span class="hint cf-reason">{{ c.reason }}</span>
          </li>
        </ul>
      </div>
      <div class="modal-actions">
        <button class="btn" @click="showTagMgr = false">关闭</button>
      </div>
    </div>
  </div>

  <!-- ============ 弹层：批量打标签 ============ -->
  <div class="mask" v-if="showBatchTag" @click.self="showBatchTag = false">
    <div class="card modal">
      <h2>批量打标签</h2>
      <p class="hint block">已选中 {{ picked.length }} 位联系人，勾选要{{ batchTagRemove ? '移除' : '添加' }}的标签</p>
      <p class="empty" v-if="!tags.length">还没有标签，先去联系人列表页点「新建标签」</p>
      <div class="tag-bar" v-else>
        <button type="button" class="tag-chip" v-for="t in tags" :key="t.id"
                :class="{on: batchTagIds.indexOf(t.id) >= 0}" @click="toggleBatchTag(t.id)">{{ t.name }}</button>
      </div>
      <label class="check-row"><input type="checkbox" v-model="batchTagRemove"> 从这些联系人身上移除（而不是添加）</label>
      <div class="modal-actions">
        <button class="btn" type="button" @click="showBatchTag = false">取消</button>
        <button class="btn primary" type="button" @click="applyBatchTag"
                :disabled="tagBusy || !batchTagIds.length || !picked.length">{{ tagBusy ? '处理中…' : '确定' }}</button>
      </div>
    </div>
  </div>

  <!-- ============ 弹层：记一个时间线事件 ============ -->
  <div class="mask" v-if="showEventModal" @click.self="showEventModal = false">
    <form class="card modal" @submit.prevent="addEvent">
      <h2>记一个事件</h2>
      <p class="hint block">记到「{{ contact ? displayName(contact) : '' }}」的时间线上，和系统自动生成的事件排在一起</p>
      <input class="text-input" v-model.trim="eventForm.title" maxlength="60" placeholder="标题，如：一起吃了饭 / 借了我 500 块">
      <textarea class="text-input" v-model.trim="eventForm.detail" maxlength="500" rows="3"
                style="margin-top:10px" placeholder="补充说明（可不填）"></textarea>
      <input class="text-input" type="datetime-local" v-model="eventForm.eventTime" style="margin-top:10px">
      <div class="modal-actions">
        <button class="btn" type="button" @click="showEventModal = false">取消</button>
        <button class="btn primary" type="submit" :disabled="timelineBusy || !eventForm.title">{{ timelineBusy ? '保存中…' : '记下' }}</button>
      </div>
    </form>
  </div>

  <!-- ============ 弹层：手动添加待跟进 ============ -->
  <div class="mask" v-if="showFollowupModal" @click.self="showFollowupModal = false">
    <form class="card modal" @submit.prevent="addFollowup">
      <h2>记一笔待跟进</h2>
      <select class="text-input" v-model.number="followupForm.contactId">
        <option :value="0" disabled>选择联系人</option>
        <option v-for="c in pickContacts" :key="c.id" :value="c.id">{{ displayName(c) }}</option>
      </select>
      <select class="text-input" v-model="followupForm.kind" style="margin-top:10px">
        <option v-for="(label, k) in followupKinds" :key="k" :value="k">{{ label }}</option>
      </select>
      <textarea class="text-input" v-model.trim="followupForm.content" maxlength="300" rows="3"
                style="margin-top:10px" placeholder="要跟进什么，如：答应了帮他改简历 / 他问的报价还没回"></textarea>
      <input class="text-input" v-model.trim="followupForm.amount" maxlength="40"
             v-if="followupForm.kind === 'money'" style="margin-top:10px" placeholder="金额，如：500 元（借出 / 欠我）">
      <label class="cal-due-label">截止日期（可选，会在关系日历上高亮）
        <input class="text-input" type="date" v-model="followupForm.dueDate" style="margin-top:4px">
      </label>
      <div class="modal-actions">
        <button class="btn" type="button" @click="showFollowupModal = false">取消</button>
        <button class="btn primary" type="submit"
                :disabled="followupBusy || !followupForm.contactId || !followupForm.content">{{ followupBusy ? '保存中…' : '添加' }}</button>
      </div>
    </form>
  </div>

  <!-- ============ 弹层：新建关系目标 ============ -->
  <div class="mask" v-if="showGoalForm" @click.self="closeGoalForm">
    <form class="card modal" @submit.prevent="addGoal">
      <h2>定一个关系目标</h2>
      <select class="text-input" v-model.number="goalForm.contactId">
        <option :value="0" disabled>选择联系人</option>
        <option v-for="c in goalPickContacts" :key="c.id" :value="c.id">{{ displayName(c) }}</option>
      </select>
      <input class="text-input" v-model.trim="goalForm.title" maxlength="40" style="margin-top:10px"
             placeholder="目标标题，如：本周主动发 5 条"> 
      <select class="text-input" v-model="goalForm.metric" style="margin-top:10px">
        <option value="weekly_me_messages">本周主动发消息数</option>
        <option value="period_me_messages">指定周期内主动发消息数</option>
      </select>
      <input class="text-input" type="number" min="1" max="999" v-model.number="goalForm.targetCount" style="margin-top:10px"
             placeholder="达标条数（1~999）">
      <div class="asst-row" v-if="goalForm.metric === 'period_me_messages'" style="margin-top:10px">
        <label class="check-row inline">起始<input class="text-input" type="date" v-model="goalForm.periodStart"></label>
        <label class="check-row inline">结束<input class="text-input" type="date" v-model="goalForm.periodEnd"></label>
      </div>
      <p class="hint block" style="margin-top:8px">系统按窗口内你主动发给 TA 的消息条数自动判定达标；达成即 +XP 并写入时间线。</p>
      <div class="modal-actions">
        <button class="btn" type="button" @click="closeGoalForm">取消</button>
        <button class="btn primary" type="submit"
                :disabled="goalsBusy || !goalForm.contactId || !goalForm.title">{{ goalsBusy ? '保存中…' : '创建目标' }}</button>
      </div>
    </form>
  </div>

  <div class="toasts">
    <transition-group name="toast">
      <div v-for="t in toasts" :key="t.id" class="toast" :class="t.type">{{ t.msg }}</div>
    </transition-group>
  </div>
  </template>

</div>
<script src="/assets/vue.global.prod.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
